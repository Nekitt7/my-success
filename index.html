<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Путь — дневник целей</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0C;
  --surface:#121215;
  --surface-2:#191920;
  --line:#232329;
  --line-soft:#1B1B21;

  --blue:#7C5CFC; --blue-deep:#5433C9;
  --violet:#7C5CFC; --violet-deep:#5433C9;
  --amber:#E8834A; --amber-deep:#B85F2E;
  --fire-1:#E8A34A; --fire-2:#E8834A; --fire-3:#D9604F;
  --ice:#6BA8D9; --mint:#5FBFA3;

  --text:#F2F2F4; --muted:#8A8A96; --dim:#5A5A66;

  --r-lg:14px; --r-md:12px; --r-sm:10px;
  --safe-top:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--ink);color:var(--text);
  padding:calc(20px + var(--safe-top)) 18px calc(92px + env(safe-area-inset-bottom));
  min-height:100vh;-webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}
button,input,textarea{font-family:inherit;letter-spacing:inherit}
.ic{width:18px;height:18px;flex:none;display:block}
.ic-lg{width:21px;height:21px}

/* ---------- счётчики ---------- */
.topbar{display:flex;align-items:center;gap:26px;margin-bottom:32px;
  animation:fade .4s both}
.metric{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;
  color:var(--muted);cursor:pointer;transition:opacity .15s}
.metric:active{opacity:.6}
.metric span{color:var(--text)}
.m-fire{color:var(--fire-2)} .m-ice{color:var(--ice)} .m-best{color:var(--violet)}
.metric.pulse{animation:pop .4s ease}

/* крупные счётчики — только на экране «Сегодня» */
.topbar.big{gap:0;justify-content:space-between;margin-bottom:38px}
.topbar.big .metric{flex:1;flex-direction:column;gap:9px;font-size:28px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.topbar.big .metric .ic{width:30px;height:30px}
.topbar.big .metric span{color:var(--text);line-height:1}

/* ---------- главная цель ---------- */
.hero{position:relative;margin-bottom:34px;animation:fade .4s .05s both}
.hero-eyebrow{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hero-eyebrow svg{display:none}
.hero-title{font-size:26px;font-weight:600;line-height:1.2;margin-bottom:20px;letter-spacing:-0.025em}
.hero-row{display:flex;align-items:center;gap:18px}
.ring{width:52px;height:52px;flex:none;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:3}
.ring-fg{fill:none;stroke:var(--violet);stroke-width:3;stroke-linecap:round;
  transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.3,1)}
.ring-wrap{position:relative;flex:none}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600}
.hero-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero-day{font-size:14px;font-weight:500}
.hero-note{font-size:13px;font-weight:400;color:var(--muted)}
.hero-warn{color:var(--fire-2)}

/* ---------- секции ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 14px}
.sec-t{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.sec-c{font-size:11px;font-weight:500;color:var(--dim)}

/* ---------- карточки ---------- */
.stack{display:flex;flex-direction:column;gap:1px;margin-bottom:34px;
  background:var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.card-wrap{animation:fade .35s both;background:var(--ink);padding:18px 0}
.card{display:flex;align-items:center;justify-content:space-between;gap:14px}
.card-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.card-t{font-size:15px;font-weight:500;line-height:1.35}
.card-s{font-size:13px;font-weight:400;color:var(--muted);line-height:1.45}
.card.done{opacity:.4}
.card.done .card-t{text-decoration:line-through}
.mini{height:2px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:10px;width:100%}
.mini i{display:block;height:100%;background:var(--violet);transition:width .5s cubic-bezier(.2,.8,.3,1)}

.goal-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.goal-head.full .card-t{color:var(--muted)}
.tick-done{width:22px;height:22px;border-radius:50%;flex:none;background:var(--violet);
  display:flex;align-items:center;justify-content:center}
.tick-done svg{width:12px;height:12px;color:var(--ink)}
.tick-count{font-size:13px;font-weight:500;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}

/* ---------- задачи ---------- */
.tasks{display:flex;flex-direction:column;margin-top:14px}
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 0;
  font-size:14px;font-weight:400;cursor:pointer;line-height:1.4;
  border-top:1px solid var(--line-soft);transition:opacity .15s}
.task:first-child{border-top:none}
.task:active{opacity:.55}
.task.on span{color:var(--dim);text-decoration:line-through}
.task-box{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px;
  border:1.5px solid var(--line);background:transparent;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.task.on .task-box{background:var(--violet);border-color:var(--violet)}
.task-box svg{width:10px;height:10px;opacity:0;transition:opacity .2s;color:var(--ink)}
.task.on .task-box svg{opacity:1;stroke:var(--ink)}
.task-num{font-size:12px;font-weight:400;color:var(--dim);flex:none;min-width:13px;margin-top:1px;
  font-variant-numeric:tabular-nums}

/* ---------- кнопки ---------- */
.btn{border:none;border-radius:var(--r-sm);font-weight:500;font-size:14px;letter-spacing:0;
  text-transform:none;padding:13px 18px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .15s,background .15s;flex:none}
.btn:active{opacity:.7}
.btn-go{background:var(--violet);color:#fff}
.btn-main{background:var(--violet);color:#fff;width:100%;padding:14px}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);width:100%;padding:13px}
.btn:disabled{opacity:.35;cursor:default}
.btn-sm{padding:9px 15px;font-size:13px}

/* ---------- дорожка ---------- */
.path{position:relative;padding:4px 0}
.node{position:relative;display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;animation:fade .4s both}
.dot{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:500;
  border:1px solid var(--line);background:transparent;color:var(--dim);
  z-index:2;transition:all .3s;font-variant-numeric:tabular-nums}
.dot.done{background:var(--violet);border-color:var(--violet);color:#fff}
.dot.now{border-color:var(--violet);color:var(--violet)}
.node-num{font-size:11px;font-weight:400;color:var(--dim);letter-spacing:.04em;margin-bottom:3px}
.node-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.node-t{font-size:14px;font-weight:500;line-height:1.4}
.node.locked .node-t{color:var(--muted)}
.node-s{font-size:12px;font-weight:400;color:var(--dim)}
.sub-num{font-size:11px;font-weight:400;color:var(--dim);flex:none;min-width:22px;margin-top:2px;
  font-variant-numeric:tabular-nums}
.subs{margin:8px 0 0 44px;display:flex;flex-direction:column;gap:8px}
.sub{display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:400;
  color:var(--muted);line-height:1.4;cursor:pointer}
.sub-box{width:16px;height:16px;border-radius:50%;flex:none;margin-top:1px;
  border:1.5px solid var(--line);background:transparent;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.sub.on .sub-box{background:var(--violet);border-color:var(--violet)}
.sub.on span{color:var(--dim);text-decoration:line-through}
.sub-box svg{width:9px;height:9px;opacity:0;transition:opacity .2s;stroke:var(--ink)}
.sub.on .sub-box svg{opacity:1}

/* ---------- переключатель целей ---------- */
.switcher{display:flex;gap:20px;overflow-x:auto;padding:0 0 16px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  border-bottom:1px solid var(--line-soft);margin-bottom:22px}
.switcher::-webkit-scrollbar{display:none}
.gtab{flex:none;background:transparent;border:none;padding:0 0 2px;
  font-size:14px;font-weight:400;color:var(--dim);cursor:pointer;transition:color .18s;
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-bottom:1px solid transparent;margin-bottom:-17px;padding-bottom:16px}
.gtab.on{color:var(--text);border-bottom-color:var(--violet)}

/* ---------- цепочка дней ---------- */
.chain{position:relative;width:100%;margin:6px 0}
.day{position:absolute;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--line);background:transparent;color:var(--dim);
  font-weight:500;font-size:13px;line-height:1;animation:fade .4s both;z-index:2;cursor:pointer;
  font-variant-numeric:tabular-nums;transition:all .25s}
.day small{display:none}
.day.done{background:var(--violet);border-color:var(--violet);color:#fff}
.day.freeze{background:transparent;border-color:var(--ice);color:var(--ice)}
.day.miss{border-color:var(--line-soft);color:#3A3A44}
.day.future{opacity:.4}
.day.now{border-color:var(--violet);color:var(--violet);
  box-shadow:0 0 0 4px rgba(124,92,252,.12)}
.link{position:absolute;transform:translate(-50%,-50%);width:3px;height:3px;border-radius:50%;
  background:var(--line);z-index:1;animation:fade .5s both}
.link.on{background:var(--violet);opacity:.5}
.bolt{position:absolute;transform:translateX(-50%);z-index:5;pointer-events:none;
  animation:hop 2.2s cubic-bezier(.4,0,.5,1) infinite}
.bolt svg{display:block;width:20px;height:20px}
.bolt-tail{display:none}
.finish{position:absolute;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;
  align-items:center;gap:6px;font-size:11px;font-weight:400;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim)}

/* ---------- панели и формы ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px;animation:fade .35s both}
.field{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:13px 14px;color:var(--text);font-size:15px;font-weight:400;outline:none;
  transition:border-color .2s;resize:none}
.field::placeholder{color:var(--dim);font-weight:400}
.field:focus{border-color:var(--violet)}
.label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px}
.gap{height:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:62px;background:transparent;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 6px;color:var(--muted);font-weight:400;font-size:14px;
  cursor:pointer;transition:all .18s;text-align:center}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.chip:active{opacity:.7}

.task-rows{display:flex;flex-direction:column;gap:9px}
.task-row{display:flex;align-items:center;gap:11px}
.task-row-n{font-size:13px;font-weight:400;color:var(--dim);flex:none;min-width:14px;
  text-align:center;font-variant-numeric:tabular-nums}
.task-input{flex:1;min-width:0;padding:12px 13px;font-size:14px}
.task-del{flex:none;width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .18s}
.task-del svg{width:13px;height:13px}
.task-del:active{color:var(--fire-3)}

/* ---------- счётчик напоминаний ---------- */
.stepper{display:flex;align-items:center;gap:16px;justify-content:space-between;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.step-btn{width:34px;height:34px;border-radius:50%;flex:none;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.step-btn:active{background:var(--violet);border-color:var(--violet)}
.step-btn svg{width:14px;height:14px}
.step-val{flex:1;text-align:center;display:flex;flex-direction:column;gap:3px}
.step-val b{font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.step-val span{font-size:11px;font-weight:400;color:var(--muted)}
.times-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.time-chip{background:transparent;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:6px 11px;font-size:13px;font-weight:400;color:var(--muted);
  font-variant-numeric:tabular-nums}
.time-chip.off{color:var(--dim)}

/* ---------- строки настроек ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row-t{font-size:14px;font-weight:500}
.row-s{font-size:12.5px;font-weight:400;color:var(--muted);margin-top:3px}
.badge{font-size:11px;font-weight:400;padding:4px 9px;border-radius:20px;flex:none;
  border:1px solid var(--line)}
.badge.ok{color:var(--mint);border-color:rgba(95,191,163,.35)}
.badge.off{color:var(--dim)}
.badge.star{color:var(--violet);border-color:rgba(124,92,252,.35)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-bottom:30px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.tile{background:var(--ink);padding:20px 18px;animation:fade .35s both}
.tile-n{font-size:30px;font-weight:600;line-height:1;margin-bottom:7px;font-variant-numeric:tabular-nums}
.tile-l{font-size:12px;font-weight:400;color:var(--muted)}

.ava{width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;
  border:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500;color:var(--violet)}
.profile-head{display:flex;align-items:center;gap:16px;margin-bottom:4px}

.empty{text-align:center;padding:56px 20px;animation:fade .4s both}
.empty svg{opacity:.2;margin-bottom:20px;width:40px;height:40px}
.empty-t{font-size:16px;font-weight:500;margin-bottom:8px}
.empty-s{font-size:14px;font-weight:400;color:var(--muted);line-height:1.55;margin-bottom:24px;
  max-width:290px;margin-left:auto;margin-right:auto}

.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;font-size:12px;font-weight:400;
  color:var(--dim);justify-content:center}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:8px;height:8px;border-radius:50%;display:block}

/* ---------- нижнее меню ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(10,10,12,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line-soft);
  display:flex;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);
  font-size:10px;font-weight:400;cursor:pointer;padding:2px 0;transition:color .2s}
.tab.on{color:var(--violet)}
.tab .ic-lg{transition:none}

.toast{position:fixed;left:50%;top:calc(20px + var(--safe-top));transform:translate(-50%,-160%);
  background:var(--surface-2);color:var(--text);border:1px solid var(--line);
  padding:11px 18px;border-radius:var(--r-sm);font-weight:400;font-size:13.5px;
  z-index:200;transition:transform .35s cubic-bezier(.2,1.1,.4,1);max-width:88%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.spark{position:fixed;width:5px;height:5px;border-radius:50%;z-index:150;pointer-events:none}

.backdrop{position:fixed;inset:0;background:rgba(5,5,7,.7);z-index:150;
  opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:160;background:var(--surface);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:14px 20px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  max-height:82vh;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet-grip{width:32px;height:3px;border-radius:2px;background:var(--line);margin:0 auto 20px}
.sheet-num{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.sheet-badge{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:500;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet-badge.done{background:var(--violet);border-color:var(--violet);color:#fff}
.sheet-badge.freeze{border-color:var(--ice);color:var(--ice)}
.sheet-badge.now{border-color:var(--violet);color:var(--violet)}
.sheet-badge.miss{border-color:var(--line-soft);color:var(--dim)}
.sheet-t{font-size:18px;font-weight:500;line-height:1.2}
.sheet-s{font-size:13px;font-weight:400;color:var(--muted);margin-top:3px}
.sheet-task{background:transparent;border:none;border-radius:0;padding:0;margin-bottom:22px}
.sheet-task-l{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin-bottom:10px}
.sheet-task-t{font-size:16px;font-weight:500;line-height:1.4}
.sheet-task-s{font-size:13px;font-weight:400;color:var(--muted);margin-top:6px}
.sheet-subs{display:flex;flex-direction:column;margin:0 0 6px}
.sheet-sub{display:flex;align-items:flex-start;gap:12px;background:transparent;
  border:none;border-top:1px solid var(--line-soft);border-radius:0;padding:14px 0;
  font-size:14px;font-weight:400;cursor:pointer;transition:opacity .15s;line-height:1.4}
.sheet-sub:first-child{border-top:none}
.sheet-sub.on span{color:var(--dim);text-decoration:line-through}
.sheet-sub:active{opacity:.6}

/* ---------- обучение ---------- */
.tour{position:fixed;inset:0;z-index:300;background:rgba(10,10,12,.96);
  display:flex;align-items:center;justify-content:center;padding:28px;
  opacity:0;transition:opacity .3s}
.tour.show{opacity:1}
.tour-card{background:transparent;border:none;border-radius:0;padding:0;
  max-width:330px;width:100%;
  transform:translateY(12px);transition:transform .35s cubic-bezier(.2,1,.4,1)}
.tour.show .tour-card{transform:none}
.tour-ico{width:40px;height:40px;border-radius:0;margin:0 0 22px;
  display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:none}
.tour-ico svg{width:26px;height:26px;color:var(--violet);stroke:var(--violet)}
.tour-t{font-size:22px;font-weight:600;text-align:left;margin-bottom:12px;line-height:1.25;
  letter-spacing:-0.02em}
.tour-s{font-size:14.5px;font-weight:400;color:var(--muted);text-align:left;
  line-height:1.6;margin-bottom:28px}
.tour-dots{display:flex;gap:5px;justify-content:flex-start;margin-bottom:22px}
.tour-dot{width:5px;height:5px;border-radius:50%;background:var(--line);transition:all .3s}
.tour-dot.on{background:var(--violet);width:16px;border-radius:3px}

@keyframes drop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateX(-50%) scale(.9)}to{opacity:1;transform:translateX(-50%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-7px)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}

@media (prefers-reduced-motion:reduce){

/* ================== НАПОМИНАНИЯ ================== */
const DAY_START=9, DAY_HOURS=12, MAX_REMINDERS=12;

/* Время не задано — делим 12-часовое окно поровну и ставим в середину каждой части */
function autoTimes(n){
  if(n<=0) return [];
  const step=DAY_HOURS/n, out=[];
  for(let i=0;i<n;i++){
    const pos=DAY_START+step*(i+0.5);
    let h=Math.floor(pos), m=Math.round((pos-h)*60/5)*5;
    if(m===60){ h+=1; m=0; }
    out.push(String(h%24).padStart(2,'0')+':'+String(m).padStart(2,'0'));
  }
  return out;
}

function parseTimes(text){
  const out=[];
  String(text||'').split(/[,;\s]+/).forEach(function(p){
    if(!p) return;
    const m=p.match(/^(\d{1,2})(?:[:.](\d{2}))?$/);
    if(!m) return;
    const h=Number(m[1]), mi=Number(m[2]||0);
    if(h>=0&&h<=23&&mi>=0&&mi<=59)
      out.push(String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'));
  });
  return out.filter(function(v,i,a){ return a.indexOf(v)===i; }).sort();
}

function myTimes(){
  const custom=parseTimes(S.remindTimes||'');
  if(custom.length) return custom;
  return autoTimes(Math.max(0,Math.min(MAX_REMINDERS,Number(S.remindCount==null?2:S.remindCount))));
}

/* ================== ХРАНИЛИЩЕ ================== */
const KEY='pathstate_v3';
let memory=null;

function loadState(){
  return new Promise(function(resolve){
    if(tg&&tg.CloudStorage&&tg.CloudStorage.getItem){
      let settled=false;
      const done=function(v){ if(!settled){ settled=true; resolve(v); } };
      setTimeout(function(){ done(null); },2500);
      tg.CloudStorage.getItem(KEY,function(err,val){
        if(err||!val) return done(null);
        try{ done(JSON.parse(val)); }catch(e){ done(null); }
      });
    } else resolve(memory);
  });
}
function saveState(){
  const raw=JSON.stringify(S);
  memory=JSON.parse(raw);
  if(tg&&tg.CloudStorage&&tg.CloudStorage.setItem){
    try{ tg.CloudStorage.setItem(KEY,raw,function(){}); }catch(e){}
  }
  if(API_URL) pushToServer();
}

/* ================== СЕРВЕР ================== */
let syncBusy=false;

async function api(path,payload){
  if(!API_URL) throw new Error('no server');
  const r=await fetch(API_URL.replace(/\/$/,'')+path,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({initData:tg?tg.initData:''},payload||{}))
  });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

async function pullFromServer(silent){
  if(!API_URL){ if(!silent) toast(t('syncNotSet')); return false; }
  if(syncBusy) return false;
  syncBusy=true;
  try{
    const d=await api('/api/state');
    if(d&&d.goals){
      S.goals=(d.goals||[]).map(function(g){ return migrateGoal(g); });
      S.streak=d.streak||0; S.best=d.best||0;
      if(typeof d.freezes==='number') S.freezes=d.freezes;
      S.lastDone=d.lastDone||S.lastDone;
      S.days=Object.assign({},S.days,d.days||{});
      S.seq=Math.max(S.seq||1,(d.seq||0)+1);
      if(typeof d.remindCount==='number') S.remindCount=d.remindCount;
      if(typeof d.remindTimes==='string') S.remindTimes=d.remindTimes;
      memory=JSON.parse(JSON.stringify(S));
      if(tg&&tg.CloudStorage&&tg.CloudStorage.setItem){
        try{ tg.CloudStorage.setItem(KEY,JSON.stringify(S),function(){}); }catch(e){}
      }
      if(!silent) toast(t('syncOk'));
      return true;
    }
  }catch(e){ if(!silent) toast(t('syncFail')); }
  finally{ syncBusy=false; }
  return false;
}
function deviceTz(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){ return ''; }
}

function pushToServer(){
  if(!API_URL||!tg) return;
  // пояс устройства уходит вместе с данными — по нему бот шлёт напоминания
  api('/api/save',{state:S,tz:deviceTz(),
    remindCount:Number(S.remindCount==null?2:S.remindCount),
    remindTimes:S.remindTimes||''}).catch(function(){});
}

/* ================== ДАТЫ ================== */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>key(new Date());
function shift(n){ const d=new Date(); d.setDate(d.getDate()+n); return key(d); }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return key(d); }
function plural(n,one,few,many){
  const a=n%10,b=n%100;
  if(b>=11&&b<=14) return many;
  if(a===1) return one;
  if(a>=2&&a<=4) return few;
  return many;
}
const dayWord=n=>(S&&S.lang==='en')?(n===1?'day':'days'):plural(n,'день','дня','дней');

function weekTag(){ const d=new Date(); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return key(d); }
function liveStreak(){
  if(!S.lastDone) return 0;
  return (S.lastDone===today()||S.lastDone===shift(-1))?S.streak:0;
}
const anyDoneToday=()=>!!S.days[today()];
function refillFreezes(){ if(S.freezeWeek!==weekTag()){ S.freezeWeek=weekTag(); S.freezes=1; } }

function applyFreeze(){
  if(!S.lastDone||S.streak<=0) return null;
  if(S.lastDone!==shift(-2)) return null;
  refillFreezes();
  if(S.freezes<=0) return null;
  S.freezes-=1; S.lastDone=shift(-1); S.days[shift(-1)]='freeze';
  saveState(); return S.streak;
}

/* ================== ЦЕЛИ ================== */
function spread(count,total){
  if(count<=0) return [];
  if(count>=total) return Array(count).fill(1);
  const base=Math.floor(total/count);
  const out=Array(count).fill(base);
  let rest=total-base*count;
  for(let i=count-1;rest>0;i--,rest--) out[i%count]+=1;
  return out;
}
function addGoal(title,targetDays,items){
  const g={id:S.seq++,title:title,targetDays:targetDays,created:today(),log:{},
    tasks:items.map(function(x){
      return {id:S.seq++, text:((x&&typeof x==='object')?x.text:String(x)).slice(0,160)};
    })};
  S.goals.push(g);
  if(!S.mainGoal) S.mainGoal=g.id;
  saveState(); return g;
}

/* Старые цели со steps превращаем в ежедневные задачи — данные не теряются */
function migrateGoal(g){
  if(!g) return g;
  if(!g.log) g.log={};
  if(!g.tasks){
    g.tasks=[];
    (g.steps||[]).forEach(function(st){
      g.tasks.push({id:st.id||(S.seq++),text:st.text});
      (st.subs||[]).forEach(function(sb){ g.tasks.push({id:S.seq++,text:sb.text}); });
    });
    if(g.marks) for(const d in g.marks) if(!g.log[d]) g.log[d]=g.tasks.map(function(t){ return t.id; });
    delete g.steps; delete g.marks;
  }
  return g;
}

/* ---------- ежедневные задачи ---------- */
function dayLog(g,date){ return (g.log&&g.log[date])||[]; }
function isTaskDone(g,date,tid){ return dayLog(g,date).indexOf(tid)>=0; }

function allDone(g,date){
  if(!g.tasks||!g.tasks.length) return false;
  const done=dayLog(g,date);
  return g.tasks.every(function(t){ return done.indexOf(t.id)>=0; });
}
function tasksLeft(g){
  const done=dayLog(g,today());
  return (g.tasks||[]).filter(function(t){ return done.indexOf(t.id)<0; }).length;
}

/* Огонёк растёт, только когда закрыты ВСЕ задачи цели за день */
function toggleTask(goalId,taskId){
  const g=S.goals.find(function(x){ return x.id===goalId; }); if(!g) return null;
  const d=today();
  if(!g.log) g.log={};
  const arr=(g.log[d]||[]).slice();
  const i=arr.indexOf(taskId);
  if(i>=0) arr.splice(i,1); else arr.push(taskId);
  g.log[d]=arr;

  let completed=false, grew=false;
  if(allDone(g,d)){
    completed=true;
    if(!S.days[d]){
      S.streak=(S.lastDone===shift(-1))?S.streak+1:1;
      S.best=Math.max(S.best,S.streak);
      S.lastDone=d; S.days[d]='done'; grew=true;
    }
  }
  saveState();
  return {on:i<0, completed:completed, grew:grew, streak:S.streak, left:tasksLeft(g)};
}
function addGoalPlan(title,targetDays,plan){
  const items=[];
  plan.forEach(function(x){
    items.push({text:x.step});
    (x.subs||[]).forEach(function(tx){ items.push({text:String(tx)}); });
  });
  return addGoal(title,targetDays,items.slice(0,15));
}

function goalStat(g){
  const total=Math.max(1,g.targetDays||30);
  let done=0;
  for(const d in (g.log||{})) if(allDone(g,d)) done++;
  const left=diffDays(today(),addDays(g.created,total));
  const elapsed=diffDays(g.created,today());
  return{total:total,done:done,left:left,
    stepsLeft:tasksLeft(g),
    behind:Math.max(0,elapsed-done),
    pct:Math.min(100,Math.round(done/total*100)),
    finished:done>=total};
}
const goalDoneToday=g=>allDone(g,today());
function mainGoal(){
  let g=S.goals.find(function(x){ return x.id===S.mainGoal; });
  if(!g) g=S.goals.find(function(x){ return !goalStat(x).finished; })||S.goals[0]||null;
  return g;
}
function sortedGoals(){
  return S.goals.slice().sort(function(a,b){
    if(a.id===S.mainGoal) return -1;
    if(b.id===S.mainGoal) return 1;
    const fa=goalStat(a).finished?1:0, fb=goalStat(b).finished?1:0;
    return fa-fb;
  });
}

/* Задача конкретного дня внутри конкретной цели */
function taskForDay(g,dateStr){
  const idx=diffDays(g.created,dateStr)+1;
  if(idx<1) return null;
  let cum=0;
  for(let i=0;i<g.steps.length;i++){
    const s=g.steps[i];
    cum+=s.days;
    if(idx<=cum) return {goal:g,step:s,inStep:idx-(cum-s.days),ofStep:s.days};
  }
  return null;
}

/* Цепочка одной цели: от первого дня до последнего дня срока */
function renderChain(g){
  const totalDays=Math.max(1,g.targetDays||30);
  const days=[];
  for(let i=0;i<totalDays;i++) days.push(addDays(g.created,i));

  const STEP=74,TOP=46,AMP=27;
  const xs=i=>50+AMP*Math.sin(i*0.72);
  const height=TOP+days.length*STEP+30;
  let h='<div class="chain" style="height:'+height+'px">';

  for(let i=0;i<days.length-1;i++){
    const x1=xs(i),y1=TOP+i*STEP,x2=xs(i+1),y2=TOP+(i+1)*STEP;
    const on=allDone(g,days[i])&&allDone(g,days[i+1]);
    for(let k=1;k<=2;k++){
      const f=k/3;
      h+='<i class="link'+(on?' on':'')+'" style="left:'+(x1+(x2-x1)*f).toFixed(2)+'%;top:'+(y1+(y2-y1)*f).toFixed(1)+'px;animation-delay:'+(i*30)+'ms"></i>';
    }
  }

  days.forEach(function(d,i){
    const y=TOP+i*STEP,x=xs(i),n=i+1;
    const mark=allDone(g,d)?'done':(S.days[d]==='freeze'?'freeze':null);
    const isToday=d===today();
    const cls=mark==='done'?'done':mark==='freeze'?'freeze':isToday?'now':(d>today()?'future':'miss');
    const inner=mark==='done'?ICON_CHECK:mark==='freeze'?ICON_SNOW:String(n);

    h+='<div class="day '+cls+'" data-act="day" data-g="'+g.id+'" data-d="'+d+'" style="left:'+x.toFixed(2)+'%;top:'+y+'px;animation-delay:'+Math.min(i*30,900)+'ms">'+
       inner+(mark?'<small>'+n+'</small>':'')+'</div>';

    if(isToday){
      h+='<div class="bolt" style="left:'+x.toFixed(2)+'%;top:'+(y-48)+'px">'+
         '<svg width="32" height="32" viewBox="0 0 24 24" fill="#FFB23F" stroke="#C77A12" stroke-width="1.5" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>'+
         '<i class="bolt-tail"></i></div>';
    }
  });

  h+='<div class="finish" style="left:50%;top:'+(TOP+days.length*STEP)+'px">'+
     '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h13l-2.5 4L18 12H5"/></svg>'+
     t('finishLabel')+'</div>';
  return h+'</div>';
}

/* ================== КАРТОЧКА ДНЯ ================== */
function openDay(goalId,dateStr){
  const g=S.goals.find(function(x){ return x.id===goalId; }); if(!g) return;
  const full=allDone(g,dateStr);
  const isToday=dateStr===today(), isFuture=dateStr>today();
  const n=diffDays(g.created,dateStr)+1;
  const frozen=S.days[dateStr]==='freeze';
  const cls=full?'done':frozen?'freeze':isToday?'now':isFuture?'':'miss';
  const status=full?t('stDone'):frozen?t('stFreeze')
              :isToday?t('stNow'):isFuture?t('stFuture'):t('stMiss');

  let body='<div class="sheet-task-l" style="margin:0 3px 8px">'+t('subsLabel')+'</div><div class="sheet-subs">';
  (g.tasks||[]).forEach(function(tk,k){
    const on=isTaskDone(g,dateStr,tk.id);
    body+='<div class="sheet-sub'+(on?' on':'')+'"'+
      (isToday?' data-act="sheet-task" data-g="'+g.id+'" data-t="'+tk.id+'"':' style="opacity:.55"')+'>'+
      '<i class="sub-box">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>'+
      '</i><b class="sub-num">'+(k+1)+'</b><span>'+esc(tk.text)+'</span></div>';
  });
  body+='</div><div style="height:14px"></div>';

  let note='';
  if(isFuture) note='<div class="card-s" style="text-align:center;margin-bottom:12px">'+t('cantFuture')+'</div>';
  else if(!isToday&&!full) note='<div class="card-s" style="text-align:center;margin-bottom:12px">'+t('cantPast')+'</div>';
  else if(isToday&&!full) note='<div class="card-s" style="text-align:center;margin-bottom:12px">'+t('needAll')+'</div>';

  const back=document.createElement('div');
  back.className='backdrop'; back.id='backdrop';
  const sheet=document.createElement('div');
  sheet.className='sheet'; sheet.id='sheet';
  sheet.innerHTML='<div class="sheet-grip"></div><div class="sheet-num">'+
    '<div class="sheet-badge '+cls+'">'+n+'</div><div><div class="sheet-t">'+t('dayTitle',{n:n})+'</div>'+
    '<div class="sheet-s">'+esc(g.title)+' \u00b7 '+status+'</div></div></div>'+body+note+
    '<button class="btn btn-ghost" data-act="sheet-close">'+t('close')+'</button>';

  document.body.appendChild(back); document.body.appendChild(sheet);
  requestAnimationFrame(function(){ back.classList.add('show'); sheet.classList.add('show'); });

  back.addEventListener('click',closeSheet);
  sheet.addEventListener('click',function(e){
    const el=e.target.closest('[data-act]'); if(!el) return;
    if(el.dataset.act==='sheet-close'){ closeSheet(); return; }
    if(el.dataset.act==='sheet-task'){
      const r=toggleTask(Number(el.dataset.g),Number(el.dataset.t));
      el.classList.toggle('on'); haptic('tap');
      if(r&&r.completed){
        const rect=el.getBoundingClientRect();
        sparks(rect.left+rect.width/2,rect.top+rect.height/2);
        haptic('ok');
        toast(r.grew?t('inRow',{n:r.streak,w:dayWord(r.streak)}):t('goalAllDone'));
        closeSheet(); setTimeout(render,320);
      }
    }
  });
}

function closeSheet(){
  const back=document.getElementById('backdrop'),sheet=document.getElementById('sheet');
  if(back) back.classList.remove('show');
  if(sheet) sheet.classList.remove('show');
  setTimeout(function(){ if(back) back.remove(); if(sheet) sheet.remove(); },340);
}

/* ================== СОБЫТИЯ ================== */
document.getElementById('nav').addEventListener('click',function(e){
  const tab=e.target.closest('.tab'); if(!tab) return;
  if(screen===tab.dataset.tab) return;
  screen=tab.dataset.tab;
  if(screen!=='goals') draft=null;
  haptic('tap'); render();
});

document.getElementById('app').addEventListener('click',function(e){
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;

  if(act==='hint'){ toast(t(el.dataset.h)); haptic('tap'); return; }

  if(act==='theme'){
    S.theme=el.dataset.v; applyTheme(S.theme); saveState(); haptic('ok'); render(); return;
  }

  if(act==='tour'){ tourStep=0; showTour(); return; }

  if(act==='rc'){
    const d=Number(el.dataset.v);
    let n=Number(S.remindCount==null?2:S.remindCount)+d;
    n=Math.max(0,Math.min(MAX_REMINDERS,n));
    S.remindCount=n; S.remindTimes='';
    saveState(); haptic('tap'); render(); return;
  }

  if(act==='rt-save'){
    const inp=document.getElementById('r-times');
    const raw=inp?inp.value.trim():'';
    if(!raw){ S.remindTimes=''; saveState(); haptic('tap'); toast(t('notifSaved')); render(); return; }
    const parsed=parseTimes(raw);
    if(!parsed.length){ toast(t('notifBad')); haptic('warn'); return; }
    S.remindTimes=parsed.join(', ');
    S.remindCount=parsed.length;
    saveState(); haptic('ok'); toast(t('notifSaved')); render(); return;
  }

  if(act==='rt-auto'){
    S.remindTimes=''; saveState(); haptic('tap'); toast(t('notifSaved')); render(); return;
  }

  if(act==='task-add'){
    syncDraft();
    if(draft.tasks.length<15) draft.tasks.push('');
    haptic('tap'); render(); return;
  }

  if(act==='task-del'){
    syncDraft();
    draft.tasks.splice(Number(el.dataset.i),1);
    if(!draft.tasks.length) draft.tasks=[''];
    haptic('tap'); render(); return;
  }

  if(act==='task'){
    const r=toggleTask(Number(el.dataset.g),Number(el.dataset.t));
    haptic('tap');
    if(r&&r.completed){
      const rect=el.getBoundingClientRect();
      sparks(rect.left+rect.width/2,rect.top+rect.height/2);
      haptic('ok');
      const fire=document.getElementById('m-fire');
      if(fire&&r.grew){ fire.classList.add('pulse'); setTimeout(function(){ fire.classList.remove('pulse'); },500); }
      toast(r.grew?t('inRow',{n:r.streak,w:dayWord(r.streak)}):t('goalAllDone'));
    }
    render(); return;
  }

  if(act==='sub'){
    toggleSub(Number(el.dataset.g),Number(el.dataset.s),Number(el.dataset.i));
    haptic('tap'); render(); return;
  }

  if(act==='day'){ haptic('tap'); openDay(Number(el.dataset.g),el.dataset.d); return; }
  if(act==='chain'){ chainGoal=Number(el.dataset.g); haptic('tap'); render(); return; }

  if(act==='setmain'){
    S.mainGoal=Number(el.dataset.g); saveState(); haptic('ok'); toast(t('mainSet')); render(); return;
  }

  if(act==='group'){
    haptic('tap');
    if(tg&&tg.openTelegramLink) tg.openTelegramLink(GROUP_URL);
    else window.open(GROUP_URL,'_blank');
    return;
  }

  if(act==='save-name'){
    const inp=document.getElementById('p-name');
    if(inp&&inp.value.trim()){ S.name=inp.value.trim().slice(0,40); saveState(); haptic('ok'); toast(t('nameSaved')); render(); }
    return;
  }

  if(act==='rival-search'){
    const inp=document.getElementById('r-nick');
    const nick=(inp?inp.value:'').trim().replace(/^@/,'');
    if(!nick) return;
    haptic('tap');
    api('/api/find',{nick:nick}).then(function(d){
      if(d&&d.nick){ rivalFound=d; render(); }
      else { rivalFound=null; toast(t('rivalNotFound')); }
    }).catch(function(){ toast(t('syncFail')); });
    return;
  }

  if(act==='rival-invite'){
    haptic('ok');
    api('/api/invite',{nick:el.dataset.n}).then(function(){
      toast(t('rivalInvited')); rivalFound=null; render();
    }).catch(function(){ toast(t('syncFail')); });
    return;
  }

  if(act==='inv-yes'||act==='inv-no'){
    haptic('tap');
    api('/api/invite-reply',{nick:el.dataset.n,accept:act==='inv-yes'}).then(function(){
      pullFromServer(true).then(function(){ render(); });
    }).catch(function(){ toast(t('syncFail')); });
    return;
  }

  if(act==='gen-plan'){
    syncDraft();
    if(!draft.title.trim()){ toast(t('genNeedTitle')); haptic('warn'); return; }
    haptic('tap');
    el.disabled=true; el.textContent=t('genWait');
    const prev=(draft.aiPlan||[]).map(function(x){ return x.step; });
    api('/api/plan',{goal:draft.title.trim(),days:draft.days||30,
                     about:'',avoid:prev.length?prev:null})
      .then(function(d){
        if(d&&d.plan&&d.plan.length){
          draft.aiPlan=d.plan;
          draft.steps=d.plan.map(function(x){ return x.step; }).join('\n');
          haptic('ok'); toast(t('genOk'));
        } else { toast(t('genFail')); }
        render();
      })
      .catch(function(){ toast(t('genFail')); render(); });
    return;
  }

  if(act==='go-new'){ draft={title:'',days:30,tasks:['','',''],aiPlan:null}; screen='goals'; haptic('tap'); render(); return; }
  if(act==='cancel'){ draft=null; haptic('tap'); render(); return; }
  if(act==='days'){ syncDraft(); draft.days=Number(el.dataset.n); haptic('tap'); render(); return; }

  if(act==='lang'){
    S.lang=el.dataset.v; saveState(); haptic('tap');
    document.documentElement.lang=S.lang; render(); return;
  }

  if(act==='sync'){ haptic('tap'); pullFromServer(false).then(function(ok){ if(ok) render(); }); return; }

  if(act==='reset'){
    const kill=function(){ S=blank(); saveState(); haptic('ok'); toast(t('resetOk')); screen='today'; render(); };
    if(tg&&tg.showConfirm) tg.showConfirm(t('resetAsk'),function(ok){ if(ok) kill(); });
    else if(confirm(t('resetAsk'))) kill();
    return;
  }

  if(act==='save-goal'){
    syncDraft();
    const title=draft.title.trim();
    const steps=(draft.tasks||[]).map(function(x){ return String(x||'').trim(); })
                                 .filter(Boolean).map(function(x){ return {text:x.slice(0,160)}; });
    const days=Math.max(1,Math.min(365,Number(draft.days)||30));
    if(!title){ toast(t('needTitle')); haptic('warn'); return; }
    if(!steps.length){ toast(t('needStep')); haptic('warn'); return; }
    // если шаги пришли от нейросети и не правились — сохраняем её распределение дней
    addGoal(title,days,steps);
    if(tg&&tg.sendData){ try{ tg.sendData(JSON.stringify({action:'add_goal',title:title,days:days,steps:steps})); }catch(err){} }
    draft=null; haptic('ok'); toast(t('goalCreated')); screen='today'; render(); return;
  }

  if(act==='toggle'){ const id=Number(el.dataset.g); openGoal=openGoal===id?null:id; haptic('tap'); render(); return; }

  if(act==='drop'){
    const id=Number(el.dataset.g);
    const kill=function(){
      S.goals=S.goals.filter(function(g){ return g.id!==id; });
      if(S.mainGoal===id) S.mainGoal=S.goals.length?S.goals[0].id:null;
      if(chainGoal===id) chainGoal=null;
      openGoal=null; saveState(); haptic('ok'); toast(t('goalDeleted')); render();
    };
    if(tg&&tg.showConfirm) tg.showConfirm(t('deleteAsk'),function(ok){ if(ok) kill(); });
    else if(confirm(t('deleteAsk'))) kill();
    return;
  }

});

function syncDraft(){
  if(!draft) return;
  const a=document.getElementById('d-title'), b=document.getElementById('d-days');
  if(a) draft.title=a.value;
  if(b&&b.value.trim()){ const n=parseInt(b.value,10); if(n>=1&&n<=365) draft.days=n; }
  const inputs=document.querySelectorAll('.task-input');
  if(inputs.length){
    const arr=[];
    inputs.forEach(function(el){ arr[Number(el.dataset.i)]=el.value; });
    draft.tasks=arr.map(function(x){ return x||''; });
  }
}

/* ================== СТАРТ ================== */
(async function init(){
  const saved=await loadState();
  S = (saved&&saved.goals) ? Object.assign(blank(),saved) : blank();
  if(!S.lang) S.lang=tgLang();
  if(!S.start) S.start=today();
  if(!S.invites) S.invites=[];
  if(!S.duels) S.duels=[];
  S.goals=(S.goals||[]).map(migrateGoal);
  const u=tgUser();
  if(u.username) S.nick=u.username;
  if(u.photo_url) S.photo=u.photo_url;
  if(!S.mainGoal&&S.goals.length) S.mainGoal=S.goals[0].id;
  if(S.remindCount==null) S.remindCount=2;
  if(S.remindTimes==null) S.remindTimes='';
  if(!S.theme) S.theme='violet';
  applyTheme(S.theme);
  document.documentElement.lang=S.lang;
  memory=JSON.parse(JSON.stringify(S));

  const rescued=applyFreeze();
  render();

  if(!S.tourDone) setTimeout(function(){ tourStep=0; showTour(); },450);

  if(API_URL) pullFromServer(true).then(function(ok){ if(ok) render(); });

  if(rescued) setTimeout(function(){ toast(t('frozeSaved',{n:rescued})); },700);
  else if(!anyDoneToday()&&liveStreak()>0)
    setTimeout(function(){ toast(t('dontLose',{n:liveStreak(),w:dayWord(liveStreak())})); },800);
})();
</script>
