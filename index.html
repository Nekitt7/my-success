<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sparko — дневник целей</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#F2F6F8; --surface:#FFFFFF; --surface-2:#EAF4F9;
  --line:#D3E3EC; --line-soft:#E6EFF4;
  --field:#7FD4EE;
  --blue:#B01E33; --blue-deep:#7C1523;
  --violet:#B01E33; --violet-deep:#7C1523;
  --amber:#FF9D0F; --amber-deep:#C46E00;
  --fire-1:#FFD24A; --fire-2:#FF7A2F; --fire-3:#E01F1F;
  --ice:#2E9EE0; --mint:#1FB574;
  --text:#17222B; --muted:#5C7484; --dim:#8FA6B4;
  --r-lg:18px; --r-md:14px; --r-sm:11px;
  --chain-title:#0E3A4C;
  --nav-bg:rgba(255,255,255,.96);
  --safe-top:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--ink);color:var(--text);
  padding:calc(14px + var(--safe-top)) 14px calc(96px + env(safe-area-inset-bottom));
  min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
.ic{width:20px;height:20px;flex:none;display:block}
.ic-lg{width:25px;height:25px}

/* ---------- счётчики ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;background:var(--surface);
  border:2px solid var(--line);border-radius:var(--r-lg);padding:11px 8px;margin-bottom:18px;
  animation:drop .45s cubic-bezier(.2,.9,.3,1.2) both}
.metric{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:900;flex:1;
  justify-content:center;position:relative;cursor:pointer;transition:transform .12s}
.metric:active{transform:scale(.94)}
.metric+.metric::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:20px;background:var(--line-soft);border-radius:2px}
.m-fire{color:var(--fire-2)}
.m-fire svg{filter:drop-shadow(0 0 7px rgba(255,138,61,.55))}
.m-ice{color:var(--ice)} .m-best{color:var(--violet)}
.metric.pulse{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

/* крупные счётчики — только на экране «Сегодня» */
.topbar.big{padding:18px 8px;margin-bottom:22px}
.topbar.big .metric{flex-direction:column;gap:10px;font-size:30px;letter-spacing:-.5px}
.topbar.big .metric .ic{width:32px;height:32px}
.topbar.big .metric+.metric::before{height:52px}

/* ---------- главная цель ---------- */
.hero{position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--violet) 0%,var(--violet-deep) 45%,var(--blue-deep) 100%);
  border-radius:var(--r-lg);padding:20px;margin-bottom:22px;box-shadow:0 6px 0 rgba(0,0,0,.32);
  animation:drop .5s .06s cubic-bezier(.2,.9,.3,1.2) both}
.hero::after{content:'';position:absolute;right:-60px;top:-70px;width:190px;height:190px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.hero-eyebrow{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;
  color:rgba(255,255,255,.62);margin-bottom:7px;position:relative;display:flex;align-items:center;gap:6px}
.hero-title{font-size:23px;font-weight:900;line-height:1.15;margin-bottom:16px;position:relative}
.hero-row{display:flex;align-items:center;gap:16px;position:relative}
.ring{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(0,0,0,.25);stroke-width:8}
.ring-fg{fill:none;stroke:var(--mint);stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)}
.ring-wrap{position:relative;flex:none}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900}
.hero-meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-day{font-size:15px;font-weight:800}
.hero-note{font-size:13px;font-weight:700;color:rgba(255,255,255,.7)}
.hero-warn{color:#FFD48A}

/* ---------- секции ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.sec-t{font-size:13px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:var(--fire-3)}
.sec-t::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;
  background:var(--fire-2);margin-right:7px;vertical-align:middle}
.sec-c{font-size:13px;font-weight:900;color:var(--dim)}

/* ---------- цели и задачи ---------- */
.stack{display:flex;flex-direction:column;gap:15px;margin-bottom:26px}
.card-wrap{animation:drop .45s both;background:var(--surface);border:2px solid var(--line);
  border-radius:var(--r-lg);padding:15px;box-shadow:0 4px 0 var(--line-soft)}
.card-t{font-size:16px;font-weight:800;line-height:1.25}
.card-s{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.4}
.mini{height:5px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;
  margin-top:5px;width:100%}
.mini i{display:block;height:100%;background:var(--blue);border-radius:4px;
  transition:width .5s cubic-bezier(.2,.8,.3,1)}

.goal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:13px;border-bottom:2px solid var(--line-soft)}
.goal-head.full .card-t{color:var(--muted)}
.tick-done{width:34px;height:34px;border-radius:50%;flex:none;background:linear-gradient(160deg,#FF9D2F,#E01F1F);
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #B01414}
.tick-done svg{width:17px;height:17px;color:#fff}
.tick-count{font-size:15px;font-weight:900;color:var(--fire-3);flex:none}

.tasks{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.task{display:flex;align-items:flex-start;gap:10px;background:var(--ink);
  border:2px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;
  font-size:14.5px;font-weight:700;cursor:pointer;transition:all .18s;line-height:1.35}
.task.on{border-color:var(--fire-2);background:color-mix(in srgb,var(--fire-2) 12%,transparent)}
.task.on span{color:var(--dim);text-decoration:line-through}
.task:active{transform:scale(.985)}
.task-box{width:21px;height:21px;border-radius:7px;flex:none;margin-top:1px;
  border:2px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.task.on .task-box{background:linear-gradient(160deg,#FF9D2F,#E01F1F);border-color:#B01414}
.task-box svg{width:13px;height:13px;opacity:0;transition:opacity .2s}
.task.on .task-box svg{opacity:1}
.task-num{font-size:12px;font-weight:900;color:var(--fire-3);flex:none;min-width:14px;margin-top:2px}
.task.on .task-num{color:var(--dim)}

/* ---------- кнопки ---------- */
.btn{border:none;border-radius:var(--r-sm);font-weight:900;font-size:15px;letter-spacing:.4px;
  text-transform:uppercase;padding:12px 18px;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:7px;transition:transform .08s ease,box-shadow .08s ease,opacity .2s;flex:none}
.btn:active{transform:translateY(4px)}
.btn-go{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn-go:active{box-shadow:0 0 0 var(--blue-deep)}
.btn-main{background:var(--violet);color:#fff;box-shadow:0 5px 0 var(--violet-deep);
  width:100%;padding:15px}
.btn-main:active{box-shadow:0 0 0 var(--violet-deep)}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--line);
  box-shadow:none;width:100%;padding:13px}
.btn-ghost:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn-sm{padding:10px 14px;font-size:13px}

/* ---------- дорожка и подшаги ---------- */
.sub-num{font-size:11px;font-weight:900;color:var(--dim);flex:none;min-width:24px;margin-top:2px}
.sub-box{width:19px;height:19px;border-radius:6px;flex:none;margin-top:1px;
  border:2px solid var(--line);background:var(--ink);
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.sub-box svg{width:12px;height:12px;opacity:0;transition:opacity .2s}

/* ---------- переключатель целей ---------- */
.switcher{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 12px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.switcher::-webkit-scrollbar{display:none}
.gtab{flex:none;background:var(--surface);border:2px solid var(--line);border-radius:20px;
  padding:9px 15px;font-size:13.5px;font-weight:900;color:var(--muted);cursor:pointer;
  transition:all .18s;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtab.on{background:var(--violet);border-color:var(--violet-deep);color:#fff;
  box-shadow:0 3px 0 var(--violet-deep)}
.gtab:active{transform:translateY(2px)}

/* ---------- цепочка дней ---------- */
.chain{position:relative;width:100%;margin:4px 0 8px}
.decor{position:absolute;display:block;pointer-events:none;z-index:0;
  animation:decorIn .6s both, decorFloat 6s ease-in-out infinite}
.decor svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.14))}
.decor.win{animation:decorIn .6s both, decorFloat 3s ease-in-out infinite}
@keyframes decorIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes decorFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.day{position:absolute;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid var(--line);background:var(--surface-2);color:var(--dim);
  font-weight:900;font-size:15px;line-height:1;animation:rise .5s both;z-index:2;cursor:pointer}
.day small{font-size:9px;font-weight:800;opacity:.75;margin-top:2px}
/* пройдено — огонь, заморозка — синий, впереди — зелёный, пропуск — серый */
.day.done{background:linear-gradient(160deg,#4FD98F,#1FB574);border-color:#158A57;color:#fff;
  box-shadow:0 4px 0 #107045,0 0 14px rgba(31,181,116,.45)}
.day.freeze{background:linear-gradient(160deg,#6FC4F5,#2E7FD4);border-color:#1F63AB;color:#fff;
  box-shadow:0 4px 0 #17518E,0 0 12px rgba(63,169,217,.45)}
.day.miss{background:#B8C2C9;border-color:#8E9AA3;color:#5C6870;box-shadow:0 3px 0 #8E9AA3}
.gpill-dot{width:100%;height:4px;border-radius:3px;background:var(--gc,#E01F1F);margin-bottom:8px}
.chain .day.done{background:linear-gradient(160deg,var(--gc),var(--gcd));border-color:var(--gcd);
  box-shadow:0 4px 0 var(--gcd),0 0 14px color-mix(in srgb,var(--gc) 55%,transparent)}
.chain .link.on{background:var(--gc)}
.day.future{background:linear-gradient(160deg,#FF6B6B,#E01F1F);border-color:#B01414;color:#fff;box-shadow:0 4px 0 #8E1010;opacity:1}
.day.now{background:linear-gradient(160deg,#FFD24A,#F26522 55%,#D62828);
  border-color:#B01E1E;color:#fff;box-shadow:0 4px 0 #8E1414,0 0 22px rgba(242,101,34,.75);
  animation:rise .5s both,burn 1.4s ease-in-out infinite}
.day.now::before{content:'';position:absolute;inset:-8px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(255,138,61,.55),transparent 70%);
  animation:burnGlow 1.8s ease-in-out infinite}

@keyframes burn{0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.08)}}
@keyframes burnGlow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
/* точки между кружками бегут от пройденного дня к следующему */
.link{position:absolute;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;
  background:var(--line);z-index:1;animation:fade .6s both}
.link.on{background:var(--violet);animation:pulseDot 1.8s ease-in-out infinite}
.link.next{background:var(--amber);animation:runDot 1.4s ease-in-out infinite}
.day.done{animation:rise .5s both, popIn .5s both}
.day.now::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:2px solid var(--violet);opacity:.5;animation:ripple 2.2s ease-out infinite}
.day.just{animation:stamp .6s cubic-bezier(.3,1.7,.4,1)}

@keyframes pulseDot{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}
  50%{transform:translate(-50%,-50%) scale(1.5);opacity:1}}
@keyframes runDot{0%{transform:translate(-50%,-50%) scale(.6);opacity:.3}
  50%{transform:translate(-50%,-50%) scale(1.6);opacity:1}
  100%{transform:translate(-50%,-50%) scale(.6);opacity:.3}}
@keyframes ripple{0%{transform:scale(1);opacity:.55}70%{transform:scale(1.5);opacity:0}
  100%{transform:scale(1.5);opacity:0}}
@keyframes popIn{0%{transform:translateX(-50%) scale(.4)}
  60%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}
@keyframes stamp{0%{transform:translateX(-50%) scale(1)}
  40%{transform:translateX(-50%) scale(1.35) rotate(-8deg)}
  100%{transform:translateX(-50%) scale(1)}}
.bolt{position:absolute;transform:translateX(-50%);z-index:5;pointer-events:none;
  animation:hop 1.6s cubic-bezier(.4,0,.5,1) infinite}
.bolt svg{filter:drop-shadow(0 3px 6px rgba(255,178,63,.55));display:block}
.bolt-tail{position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--amber)}
.finish{position:absolute;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;
  align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase;color:var(--mint)}

/* ---------- панели и формы ---------- */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:0 4px 0 var(--line-soft);animation:drop .45s both}
.field{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:13px 15px;color:var(--text);font-size:16px;font-weight:700;outline:none;
  transition:border-color .2s;resize:none;-webkit-text-fill-color:var(--text)}
.field::placeholder{color:var(--dim);font-weight:700}
.field:focus{border-color:var(--violet)}
.label{font-size:12px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px 3px}
.gap{height:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:68px;background:var(--ink);border:2px solid var(--line);
  border-radius:var(--r-sm);padding:12px 6px;color:var(--muted);font-weight:900;font-size:15px;
  cursor:pointer;transition:all .15s;text-align:center}
.chip.on{background:var(--violet);border-color:var(--violet-deep);color:#fff;
  box-shadow:0 3px 0 var(--violet-deep)}
.chip:active{transform:translateY(2px)}

.task-rows{display:flex;flex-direction:column;gap:9px}
.task-row{display:flex;align-items:center;gap:9px}
.task-row-n{font-size:14px;font-weight:900;color:var(--violet);flex:none;min-width:17px;text-align:center}
.task-input{flex:1;min-width:0;padding:12px 14px;font-size:15px}
.task-del{flex:none;width:38px;height:38px;border-radius:11px;border:2px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .18s}
.task-del svg{width:15px;height:15px}
.task-del:active{transform:scale(.9);color:var(--fire-3)}

/* ---------- счётчик напоминаний ---------- */
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;background:var(--ink);
  border:2px solid var(--line);border-radius:var(--r-md);padding:12px}
.step-btn{width:42px;height:42px;border-radius:13px;flex:none;cursor:pointer;border:none;
  background:var(--violet);color:#fff;box-shadow:0 3px 0 var(--violet-deep);
  display:flex;align-items:center;justify-content:center;transition:transform .1s}
.step-btn:active{transform:translateY(3px);box-shadow:none}
.step-btn svg{width:18px;height:18px}
.step-val{flex:1;text-align:center;display:flex;flex-direction:column;gap:2px}
.step-val b{font-size:30px;font-weight:900;line-height:1}
.step-val span{font-size:11.5px;font-weight:800;color:var(--muted)}
.times-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;justify-content:center}
.time-chip{background:var(--surface-2);border:2px solid var(--line);border-radius:20px;
  padding:6px 12px;font-size:13px;font-weight:900;color:var(--blue)}
.time-chip.off{color:var(--dim)}

/* ---------- настройки ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:2px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row-t{font-size:15px;font-weight:800}
.row-s{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px}
.badge{font-size:11px;font-weight:900;padding:5px 10px;border-radius:20px;letter-spacing:.6px;
  text-transform:uppercase;flex:none}
.badge.ok{background:rgba(124,224,208,.15);color:var(--mint)}
.badge.off{background:rgba(180,173,224,.13);color:var(--muted)}
.badge.star{background:rgba(255,178,63,.16);color:var(--amber)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);
  padding:15px;box-shadow:0 4px 0 var(--line-soft);animation:drop .45s both}
.tile-n{font-size:28px;font-weight:900;line-height:1;margin-bottom:5px}
.tile-l{font-size:12px;font-weight:800;color:var(--muted)}

.ava{width:66px;height:66px;border-radius:50%;flex:none;object-fit:cover;
  border:3px solid var(--violet-deep);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;
  color:var(--violet)}
.profile-head{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.ava-wrap{position:relative;flex:none;cursor:pointer}
.ava-wrap:active{transform:scale(.95)}
.ava-edit{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;
  background:var(--violet);border:2px solid var(--surface);display:flex;align-items:center;justify-content:center}
.ava-edit svg{width:13px;height:13px}
/* строки рейтинга */
.prow{display:flex;align-items:center;gap:11px;padding:10px 0}
.prow.me{background:color-mix(in srgb,var(--fire-2) 10%,transparent);
  border-radius:10px;padding:10px 8px;margin:0 -8px}
.prow.blocked{opacity:.5}
.prow-n{font-size:15px;font-weight:900;color:var(--muted);min-width:24px;text-align:center;flex:none;
  font-variant-numeric:tabular-nums}
.prow-mid{flex:1;min-width:0}
.prow-name{font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-sub{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-right{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.prow-right span{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:900;color:var(--fire-2)}
.prow-right .bolt{width:13px;height:13px}
.rowline{height:2px;background:var(--line-soft);margin:2px 0}

.prof-rank{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;font-weight:900}
.prof-rank span{color:var(--muted)}
.prof-rank .bolt{width:14px;height:14px;color:var(--fire-2);margin-left:4px}
.prof-rank b{color:var(--fire-2)}

.empty{text-align:center;padding:34px 20px;animation:fade .5s both}
.empty svg{opacity:.35;margin-bottom:14px}
.empty-t{font-size:17px;font-weight:900;margin-bottom:7px}
.empty-s{font-size:14px;font-weight:700;color:var(--muted);line-height:1.5;margin-bottom:18px}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:700;
  color:var(--muted);justify-content:center}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:block}

/* ---------- нижнее меню ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--nav-bg);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:2px solid var(--line);
  display:flex;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:2px 0;color:var(--muted);transition:color .2s}
.tab-frame{width:58px;height:42px;border:3px solid var(--line);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--tc) 14%,var(--surface));transition:all .2s}
.tab .ic-lg{width:24px;height:24px}
.tab.on{color:var(--text)}
.tab.on .tab-frame{border-color:var(--tc);background:var(--tc);
  box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 16px color-mix(in srgb,var(--tc) 55%,transparent)}
.tab.on .ic-lg{stroke:#fff !important}
.tab:active .tab-frame{transform:translateY(2px)}

.toast{position:fixed;left:50%;top:calc(18px + var(--safe-top));transform:translate(-50%,-160%);
  background:var(--violet);color:#fff;padding:12px 20px;border-radius:14px;font-weight:900;
  font-size:14px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.45);
  transition:transform .4s cubic-bezier(.2,1.4,.4,1);max-width:88%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.flash{position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .18s}
.flash.show{opacity:1}
.flash-ring{position:absolute;width:150px;height:150px;border-radius:50%;border:6px solid;
  animation:ringOut .8s cubic-bezier(.2,.8,.3,1) forwards}
.flash-txt{position:relative;font-size:34px;font-weight:900;letter-spacing:2px;
  animation:flashPop .8s cubic-bezier(.3,1.6,.4,1) forwards;
  text-shadow:0 4px 18px rgba(0,0,0,.25)}
@keyframes slideL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes ringOut{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.8);opacity:0}}
@keyframes flashPop{0%{transform:scale(.5);opacity:0}30%{transform:scale(1.12);opacity:1}
  75%{transform:scale(1);opacity:1}100%{transform:scale(1.05);opacity:0}}

.badge-box.fire.burst{animation:fireBurstAnim .9s cubic-bezier(.3,1.5,.4,1)}
@keyframes fireBurstAnim{0%{transform:scale(1)}30%{transform:scale(1.22)}
  55%{transform:scale(.98)}100%{transform:scale(1)}}
.badge-box.fire .badge-ico svg{animation:flameFlicker 1.2s ease-in-out infinite;transform-origin:50% 80%}
.badge-box.fire .badge-n{color:var(--fire-3)}

.spark{position:fixed;width:9px;height:9px;border-radius:2px;z-index:150;pointer-events:none}

/* ---------- шторка ---------- */
.backdrop{position:fixed;inset:0;background:rgba(6,4,16,.72);z-index:150;
  opacity:0;transition:opacity .28s;backdrop-filter:blur(3px)}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:160;background:var(--surface);
  border-top:2px solid var(--line);border-radius:26px 26px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.9,.3,1.05);
  max-height:82vh;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet-num{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.sheet-badge{width:56px;height:56px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:19px;font-weight:900;border:3px solid var(--line);
  background:var(--surface-2);color:var(--dim)}
.sheet-badge.done{background:var(--blue);border-color:var(--blue-deep);color:#fff}
.sheet-badge.freeze{background:var(--ice);border-color:#4A9BD8;color:#0B2340}
.sheet-badge.now{background:var(--violet);border-color:var(--violet-deep);color:#fff}
.sheet-badge.miss{background:#1C1738;border-color:#241E49;color:#453F72}
.sheet-t{font-size:20px;font-weight:900;line-height:1.15}
.sheet-s{font-size:13px;font-weight:700;color:var(--muted);margin-top:3px}
.sheet-task{background:var(--ink);border:2px solid var(--line);border-radius:var(--r-md);
  padding:15px;margin-bottom:16px}
.sheet-task-l{font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px}
.sheet-task-t{font-size:17px;font-weight:800;line-height:1.3}
.sheet-task-s{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.sheet-subs{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px}
.sheet-sub{display:flex;align-items:flex-start;gap:11px;background:var(--ink);
  border:2px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;
  font-size:14.5px;font-weight:700;cursor:pointer;transition:all .2s;line-height:1.35}
.sheet-sub.on{border-color:var(--blue-deep);background:rgba(76,141,255,.09)}
.sheet-sub.on span{color:var(--dim);text-decoration:line-through}
.sheet-sub.on .sub-box{background:var(--blue);border-color:var(--blue-deep)}
.sheet-sub.on .sub-box svg{opacity:1}
.sheet-sub:active{transform:scale(.985)}

/* ---------- обучение ---------- */
.tour{position:fixed;inset:0;z-index:300;background:rgba(8,6,20,.9);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:24px;opacity:0;transition:opacity .3s}
.tour.show{opacity:1}
.tour-card{background:var(--surface);border:2px solid var(--line);border-radius:26px;
  padding:26px 22px 22px;max-width:360px;width:100%;box-shadow:0 10px 0 var(--line-soft);
  transform:translateY(18px) scale(.96);transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.tour.show .tour-card{transform:none}
.tour-ico{width:66px;height:66px;border-radius:50%;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--violet),var(--blue));
  box-shadow:0 5px 0 var(--violet-deep)}
.tour-ico svg{width:32px;height:32px}
.tour-t{font-size:21px;font-weight:900;text-align:center;margin-bottom:10px;line-height:1.2}
.tour-s{font-size:14.5px;font-weight:700;color:var(--muted);text-align:center;
  line-height:1.55;margin-bottom:20px}
.tour-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.tour-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .3s}
.tour-dot.on{background:var(--violet);width:22px;border-radius:5px}

.gcar{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:0 14px 4px;margin:0 -14px 16px}
.gcar::-webkit-scrollbar{display:none}
.gcard{flex:none;max-width:170px;background:var(--surface);border:2px solid var(--line);
  border-radius:14px;padding:10px 14px;font-size:14px;font-weight:800;color:var(--muted);
  cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;
  white-space:nowrap;overflow:hidden}
.gcard span{overflow:hidden;text-overflow:ellipsis}
.gcard.on{background:var(--plum);border-color:var(--fire-2);color:var(--cream);
  box-shadow:0 3px 0 var(--plum-deep)}
.gcard.add{border-style:dashed;color:var(--dim)}
.gflame{width:17px;height:17px;flex:none;display:block;animation:flameFlicker 1.4s ease-in-out infinite}
.gflame svg{width:100%;height:100%;display:block}

.field-zone{position:relative;background:linear-gradient(180deg,var(--sky-1),var(--sky-2));
  border-radius:var(--r-lg);padding:16px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.28);
  animation:drop .45s both}
.fz-head{position:relative;z-index:2;margin-bottom:8px}
.fz-title{font-size:17px;font-weight:900;color:#16323F}
.fz-sub{font-size:12.5px;font-weight:800;color:#2C5468;margin-top:2px}
.fz-body{position:relative;display:flex;align-items:flex-start;gap:6px;min-height:300px}

.trail{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;padding:6px 0}
.tnode{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;cursor:pointer;position:relative;
  border:3px solid #16323F;background:#FFF3E0;color:#16323F;
  box-shadow:0 4px 0 #16323F;animation:rise2 .45s both;transition:transform .12s}
.tnode:active{transform:translateY(3px)}
.tnode svg{width:20px;height:20px}
.tnode.done{background:var(--fire-2);border-color:var(--plum-deep);color:#fff;
  box-shadow:0 4px 0 var(--plum-deep)}
.tnode.now{background:var(--plum);border-color:var(--fire-2);color:var(--cream);
  box-shadow:0 4px 0 var(--plum-deep),0 0 0 0 rgba(255,155,90,.6);
  animation:rise2 .45s both,ring 2.2s .5s ease-out infinite}
.tnode.miss{background:#B9CBD4;border-color:#7E96A2;color:#5A727E;box-shadow:0 4px 0 #7E96A2}
.tnode.future{opacity:.65}
.tfinish{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#FFD98A;border:3px solid #16323F;box-shadow:0 4px 0 #16323F;color:#16323F}
.tfinish svg{width:22px;height:22px}

@keyframes rise2{from{opacity:0;transform:translateY(12px) scale(.85)}to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 4px 0 var(--plum-deep),0 0 0 0 rgba(255,155,90,.6)}
  100%{box-shadow:0 4px 0 var(--plum-deep),0 0 0 16px rgba(255,155,90,0)}}

/* три значка в рамках, как на эскизе */
/* полоса кубка */
.rankbar{background:var(--surface);border:3px solid var(--rc);border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:12px;animation:drop .4s both;
  box-shadow:0 0 16px color-mix(in srgb,var(--rc) 30%,transparent)}
.rank-head{display:flex;align-items:center;gap:9px}
.rank-cup{display:flex;flex:none}
.rank-name{font-size:16px;font-weight:900;color:var(--rd);flex:1}
.rank-ch{display:flex;align-items:center;gap:4px;font-size:17px;font-weight:900;color:var(--fire-2)}
.bolt{display:inline-flex;width:17px;height:17px}
.bolt svg{width:100%;height:100%}
.rank-line{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 7px}
.rank-line i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--rc),var(--rd));transition:width .6s cubic-bezier(.2,.8,.3,1)}
.rank-hint{font-size:12px;font-weight:800;color:var(--muted)}

/* всплывающие заряды */
.chargefly{position:fixed;left:50%;top:38%;transform:translate(-50%,10px) scale(.7);
  z-index:260;pointer-events:none;opacity:0;transition:all .4s cubic-bezier(.2,1.5,.4,1);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:40px;font-weight:900;color:var(--fire-2);
  text-shadow:0 4px 20px rgba(255,122,47,.45)}
.chargefly.show{opacity:1;transform:translate(-50%,-30px) scale(1)}
.chargefly .bolt{width:34px;height:34px}
.chargefly b{font-size:14px;letter-spacing:1.5px;color:var(--violet)}

.badges{display:flex;gap:8px;margin-bottom:16px;align-items:flex-end;animation:drop .4s both}
.badge-box{flex:1;background:var(--surface);border:3px solid var(--line);
  border-radius:var(--r-md) var(--r-md) 0 0;
  padding:10px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;transition:transform .12s;position:relative}
.badge-box:active{transform:translateY(2px)}
/* центральный выше — пьедестал */
.badge-box.rec{padding-top:16px}
.badge-box.goals{padding-top:16px}
.badge-box.fire{padding-top:26px;border-width:4px;
  box-shadow:0 0 20px rgba(255,122,47,.35);background:linear-gradient(180deg,
    color-mix(in srgb,var(--fire-2) 12%,var(--surface)),var(--surface))}
.badge-box.fire .badge-ico{width:38px;height:38px}
.badge-box.fire .badge-n{font-size:29px}
.badge-box:active{transform:scale(.95)}
.badge-box.rec{border-color:#2E9E6B}
.badge-box.fire{border-color:var(--fire-3)}
.badge-box.goals{border-color:var(--amber)}
.badge-ico{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center}
.badge-ico svg{width:100%;height:100%}
.badge-n{font-size:24px;font-weight:900;color:var(--text);line-height:1;font-variant-numeric:tabular-nums}

/* заголовок карусели — «книга» в огне */
/* карусель целей: активная в центре и подсвечена */
.gcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding:6px 0 14px;margin:0 -18px;padding-left:calc(50% - 82px);padding-right:calc(50% - 82px)}
.gcar::-webkit-scrollbar{display:none}
.gpill{flex:0 0 164px;scroll-snap-align:center;background:var(--surface);
  border:3px solid var(--line);border-radius:16px;padding:12px 12px;cursor:pointer;
  transition:all .28s cubic-bezier(.2,.9,.3,1);transform:scale(.88);opacity:.55;text-align:center}
.gpill.on{transform:scale(1);opacity:1;border-color:var(--fire-2);
  box-shadow:0 0 0 4px rgba(242,101,34,.18),0 0 26px rgba(242,101,34,.55),0 6px 18px rgba(214,40,40,.25);
  animation:emberPulse 1.8s ease-in-out infinite}
.gpill.on::before{content:'';position:absolute;inset:-6px;border-radius:20px;z-index:-1;
  background:linear-gradient(120deg,#FFC53D,#F26522,#D62828,#FFC53D);
  background-size:300% 100%;animation:emberFlow 3s linear infinite;filter:blur(9px);opacity:.75}
.gpill{position:relative}
.gpill.on .gpill-t{background:linear-gradient(100deg,#FFC53D,#F26522,#D62828,#FFC53D);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:emberFlow 3s linear infinite}
.gpill.on .gpill-s{color:var(--fire-2);font-weight:900}

@keyframes emberFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes emberPulse{0%,100%{box-shadow:0 0 0 4px rgba(242,101,34,.18),0 0 22px rgba(242,101,34,.45),0 6px 18px rgba(214,40,40,.22)}
  50%{box-shadow:0 0 0 6px rgba(242,101,34,.26),0 0 34px rgba(242,101,34,.7),0 6px 22px rgba(214,40,40,.3)}}
.gpill-t{font-size:17px;font-weight:900;line-height:1.25;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.gpill-s{font-size:13.5px;font-weight:800;color:var(--muted);margin-top:6px;line-height:1.3}
.gpill.add{border-style:dashed;color:var(--violet)}
.gpill.done{border-color:var(--mint)}

.book{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 12px}
.book-t{background:var(--surface);border:3px solid var(--fire-3);border-radius:12px;
  padding:7px 18px;font-size:15px;font-weight:900;letter-spacing:.5px}
.tagl,.tagr{font-size:10px;font-weight:900;padding:4px 8px;border-radius:6px;color:#fff}
.tagl{background:#2B4FA8}
.tagr{background:#2E9E6B}

/* голубое поле с тропинкой */
.field-box{background:var(--field);border-radius:var(--r-lg);padding:16px 14px 20px;
  position:relative;overflow:hidden;margin-bottom:22px;animation:drop .45s both}
.lives{display:flex;align-items:center;gap:6px;margin:0 0 12px;padding:8px 12px;
  background:rgba(0,0,0,.16);border-radius:12px;width:fit-content}
.lives-l{font-size:11px;font-weight:900;letter-spacing:1.4px;color:rgba(255,255,255,.85);margin-right:4px}
.life{width:22px;height:22px;animation:heartBeat 2.4s ease-in-out infinite}
.life.off{opacity:.45}
@keyframes heartBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(1)}
  36%{transform:scale(1.14)}48%{transform:scale(1)}}
.chain-title{font-size:20px;font-weight:900;letter-spacing:.3px;text-align:center;
  margin:2px 0 4px;letter-spacing:.3px}
.field-icon{position:absolute;width:44px;height:44px}
.field-icon.bicep{left:14px;top:44%}
.field-icon.trophy{left:22px;bottom:14px}

.mascot-zone{position:relative;display:block;margin:0 0 14px}
.motto{position:relative;background:var(--surface);border:3px solid var(--fire-2);
  border-radius:14px;padding:17px 18px;font-size:18px;font-weight:900;line-height:1.4;
  text-align:center;cursor:pointer;color:var(--text);
  box-shadow:0 0 18px rgba(242,101,34,.28);animation:bubbleIn .45s cubic-bezier(.2,1.4,.4,1) both}
.motto::before{content:'';position:absolute;inset:-3px;border-radius:14px;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,197,61,.5),rgba(242,101,34,.5),rgba(214,40,40,.5),rgba(255,197,61,.5));
  background-size:300% 100%;animation:emberFlow 4s linear infinite;opacity:.5;z-index:-1;filter:blur(6px)}
.motto:active{transform:scale(.98)}
.mascot{filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.mascot{width:108px;height:104px;flex:none;position:relative;cursor:pointer;
  animation:idle 3.4s ease-in-out infinite;transform-origin:50% 90%}
.mascot.cheer{animation:cheer .8s cubic-bezier(.3,1.5,.5,1)}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot svg{transition:color .4s}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);
  border-radius:16px;padding:13px 15px;font-size:14.5px;font-weight:800;line-height:1.4;
  box-shadow:0 4px 0 var(--line-soft);animation:bubbleIn .45s cubic-bezier(.2,1.4,.4,1) both;margin-bottom:12px}
.bubble::after{content:'';position:absolute;left:-9px;bottom:16px;width:0;height:0;
  border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:10px solid var(--line)}

.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 14px 4px;margin:0 -14px}
.carousel::-webkit-scrollbar{display:none}
.cslide{flex:0 0 86%;scroll-snap-align:center;background:var(--surface);border:2px solid var(--line);
  border-radius:var(--r-lg);padding:15px;box-shadow:0 4px 0 var(--line-soft);animation:drop .4s both}
.cslide.full{border-color:var(--blue-deep)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 20px}
.dot-i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}
.dot-i.on{background:var(--violet);width:20px;border-radius:4px}

.celebrate{position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--ink);opacity:0;transition:opacity .25s;pointer-events:none}
.celebrate.show{opacity:1;pointer-events:auto}
.cel-flame{width:150px;height:150px;animation:flameIn .7s cubic-bezier(.2,1.6,.4,1) both}
.cel-flame svg{width:100%;height:100%}
.cel-num{font-size:92px;font-weight:900;color:var(--fire-2);line-height:1;margin-top:14px;
  animation:numIn .5s .25s cubic-bezier(.2,1.7,.4,1) both;text-shadow:0 0 34px rgba(255,138,61,.45)}
.cel-mascot{width:150px;height:140px;margin-top:6px}
.cel-strong{font-size:15px;font-weight:900;letter-spacing:3px;color:var(--fire-2);
  margin-top:14px;text-align:center;animation:drop .45s .4s both}
.cel-say{font-size:15px;font-weight:800;color:var(--violet);margin-top:8px;text-align:center;
  padding:0 28px;animation:drop .45s .45s both}
.cel-t{font-size:26px;font-weight:900;margin-top:18px;text-align:center;animation:drop .45s .4s both}
.cel-s{font-size:15px;font-weight:700;color:var(--muted);margin-top:9px;text-align:center;
  padding:0 32px;animation:drop .45s .5s both}
.cel-btn{margin-top:28px;width:78%;animation:drop .45s .6s both}
.conf{position:fixed;width:11px;height:11px;z-index:401;pointer-events:none}

@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1.5deg)}}
@keyframes cheer{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.18) rotate(4deg)}
  60%{transform:scale(1.05) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes flexL{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-6deg) scale(1.05)}}
@keyframes flexR{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(6deg) scale(1.05)}}
@keyframes pumpL{0%,100%{transform:rotate(0)}40%{transform:rotate(-30deg) scale(1.12)}}
@keyframes pumpR{0%,100%{transform:rotate(0)}40%{transform:rotate(30deg) scale(1.12)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.15)}}
.m-eye{transform-origin:82px 32px}
@keyframes bubbleIn{from{opacity:0;transform:translateX(-10px) scale(.94)}to{opacity:1;transform:none}}

}
function applySafeArea(){
  let top=0;
  try{
    if(tg.contentSafeAreaInset&&tg.contentSafeAreaInset.top) top+=tg.contentSafeAreaInset.top;
    if(tg.safeAreaInset&&tg.safeAreaInset.top) top+=tg.safeAreaInset.top;
  }catch(e){}
  document.documentElement.style.setProperty('--safe-top',top+'px');
}
function haptic(k){
  if(!tg||!tg.HapticFeedback) return;
  try{
    if(k==='ok') tg.HapticFeedback.notificationOccurred('success');
    else if(k==='warn') tg.HapticFeedback.notificationOccurred('warning');

}

function goalColor(g){
  if(!g) return GOAL_COLORS[0];
  const i=S.goals.findIndex(function(x){ return x.id===g.id; });
  return GOAL_COLORS[(i<0?0:i)%GOAL_COLORS.length];

/* ================== НАПОМИНАНИЯ ================== */
const DAY_START=9, DAY_HOURS=12, MAX_REMINDERS=12;

/* Время не задано — делим 12-часовое окно поровну и ставим в середину каждой части */
function autoTimes(n){
  if(n<=0) return [];
  const step=DAY_HOURS/n, out=[];
  for(let i=0;i<n;i++){
    const pos=DAY_START+step*(i+0.5);
    let h=Math.floor(pos), m=Math.round((pos-h)*60/5)*5;
    if(m===60){ h+=1; m=0; }
    out.push(String(h%24).padStart(2,'0')+':'+String(m).padStart(2,'0'));
  }
  return out;
}

function parseTimes(text){
  const out=[];
  String(text||'').split(/[,;\s]+/).forEach(function(p){
    if(!p) return;
    const m=p.match(/^(\d{1,2})(?:[:.](\d{2}))?$/);
    if(!m) return;
    const h=Number(m[1]), mi=Number(m[2]||0);
    if(h>=0&&h<=23&&mi>=0&&mi<=59)
      out.push(String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'));
  });
  return out.filter(function(v,i,a){ return a.indexOf(v)===i; }).sort();
}

function myTimes(){
  const custom=parseTimes(S.remindTimes||'');
  if(custom.length) return custom;
  return autoTimes(Math.max(0,Math.min(MAX_REMINDERS,Number(S.remindCount==null?2:S.remindCount))));
}

const KEY='pathstate_v3';

function loadState(){
  return new Promise(function(resolve){
    if(tg&&tg.CloudStorage&&tg.CloudStorage.getItem){
      let settled=false;
      const done=function(v){ if(!settled){ settled=true; resolve(v); } };
      setTimeout(function(){ done(null); },2500);

        if(err||!val) return done(null);
        try{ done(JSON.parse(val)); }catch(e){ done(null); }
      });
    } else resolve(memory);
  });

/* ================== СЕРВЕР ================== */
let syncBusy=false;

async function api(path,payload){
  if(!API_URL) throw new Error('no server');
  const r=await fetch(API_URL.replace(/\/$/,'')+path,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({initData:tg?tg.initData:''},payload||{}))
  });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

async function pullFromServer(silent){
  if(!API_URL){ if(!silent) toast(t('syncOffline')); return false; }
  if(syncBusy) return false;
  syncBusy=true;
  try{
    const d=await api('/api/state');
    if(d){
      // приходит всегда, даже когда целей ещё нет
      S.isAdmin=!!d.admin;
      S.blocked=!!d.blocked;
    }
    if(d&&d.goals){
      S.goals=(d.goals||[]).map(function(g){ return migrateGoal(g); });
      S.streak=d.streak||0; S.best=d.best||0;
      if(typeof d.freezes==='number') S.freezes=d.freezes;
      S.lastDone=d.lastDone||S.lastDone;
      S.days=Object.assign({},S.days,d.days||{});
      S.seq=Math.max(S.seq||1,(d.seq||0)+1);
      if(typeof d.remindCount==='number') S.remindCount=d.remindCount;
      if(typeof d.remindTimes==='string') S.remindTimes=d.remindTimes;
      memory=JSON.parse(JSON.stringify(S));
      if(tg&&tg.CloudStorage&&tg.CloudStorage.setItem){
        try{ tg.CloudStorage.setItem(KEY,JSON.stringify(S),function(){}); }catch(e){}
      }
      if(!silent) toast(t('syncOk'));
      return true;
    }
    if(d){ saveLocal(); return true; }
  }catch(e){ if(!silent) toast(t('syncFail')); }
  finally{ syncBusy=false; }
  return false;
}

function saveLocal(){
  memory=JSON.parse(JSON.stringify(S));
  if(tg&&tg.CloudStorage&&tg.CloudStorage.setItem){

/* ================== ДАТЫ ================== */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>key(new Date());
function shift(n){ const d=new Date(); d.setDate(d.getDate()+n); return key(d); }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return key(d); }
function plural(n,one,few,many){
  const a=n%10,b=n%100;
  if(b>=11&&b<=14) return many;
  if(a===1) return one;

}

/* ================== ЦЕЛИ ================== */
function spread(count,total){
  if(count<=0) return [];
  if(count>=total) return Array(count).fill(1);
  const base=Math.floor(total/count);
  const out=Array(count).fill(base);
  let rest=total-base*count;
  for(let i=count-1;rest>0;i--,rest--) out[i%count]+=1;
  return out;
}
/* Не больше 20 новых целей в день, иначе блок на трое суток */
const GOALS_PER_DAY=20, BLOCK_DAYS=3;

function blockedUntil(){
  if(!S.blockUntil) return null;
  return (S.blockUntil>today())?S.blockUntil:null;
}
function goalsAddedToday(){ return (S.goalsAdded&&S.goalsAdded[today()])||0; }

function canAddGoal(){
  if(S.blocked) return false;
  if(blockedUntil()) return false;
  return goalsAddedToday()<GOALS_PER_DAY;
}
function noteGoalAdded(){
  if(!S.goalsAdded) S.goalsAdded={};
  S.goalsAdded[today()]=goalsAddedToday()+1;
  if(S.goalsAdded[today()]>=GOALS_PER_DAY) S.blockUntil=addDays(today(),BLOCK_DAYS);
}

function addGoal(title,targetDays,items){
  const g={id:S.seq++,title:title,targetDays:targetDays,created:today(),log:{},
    tasks:items.map(function(x){
      return {id:S.seq++, text:((x&&typeof x==='object')?x.text:String(x)).slice(0,160)};
    })};
  S.goals.push(g);
  if(!S.mainGoal) S.mainGoal=g.id;
  saveState(); return g;
}

/* Старые цели со steps превращаем в ежедневные задачи — данные не теряются */
function migrateGoal(g){
  if(!g) return g;
  if(!g.log) g.log={};
  if(!g.tasks){
    g.tasks=[];
    (g.steps||[]).forEach(function(st){
      g.tasks.push({id:st.id||(S.seq++),text:st.text});
      (st.subs||[]).forEach(function(sb){ g.tasks.push({id:S.seq++,text:sb.text}); });
    });
    if(g.marks) for(const d in g.marks) if(!g.log[d]) g.log[d]=g.tasks.map(function(t){ return t.id; });
    delete g.steps; delete g.marks;
  }
  return g;
}

/* ---------- ежедневные задачи ---------- */
function dayLog(g,date){ return (g.log&&g.log[date])||[]; }
function isTaskDone(g,date,tid){ return dayLog(g,date).indexOf(tid)>=0; }

function allDone(g,date){
  if(!g.tasks||!g.tasks.length) return false;
  const done=dayLog(g,date);
  return g.tasks.every(function(t){ return done.indexOf(t.id)>=0; });
}
function tasksLeft(g){
  const done=dayLog(g,today());
  return (g.tasks||[]).filter(function(t){ return done.indexOf(t.id)<0; }).length;
}

/* Огонёк растёт, только когда закрыты ВСЕ задачи цели за день */
function toggleTask(goalId,taskId){
  const g=S.goals.find(function(x){ return x.id===goalId; }); if(!g) return null;
  const d=today();
  if(!g.log) g.log={};
  const arr=(g.log[d]||[]).slice();
  const i=arr.indexOf(taskId);
  if(i>=0) arr.splice(i,1); else arr.push(taskId);
  g.log[d]=arr;

  let completed=false, grew=false, events=[];
  if(allDone(g,d)){
    completed=true;
    // за цель начисляем один раз в день
    if(!S.paid) S.paid={};
    const key=d+':'+g.id;
    if(!S.paid[key]){
      S.paid[key]=1;
      events=events.concat(addCharges(CHARGE_GOAL,'goal'));
    }
    if(!S.days[d]){
      S.streak=(S.lastDone===shift(-1))?S.streak+1:1;
      S.best=Math.max(S.best,S.streak);
      S.lastDone=d; S.days[d]='done'; grew=true;
      events=events.concat(addCharges(CHARGE_STREAK,'streak'));
    }
  }
  saveState();
  return {on:i<0, completed:completed, grew:grew, streak:S.streak,
          left:tasksLeft(g), events:events};
}
function addGoalPlan(title,targetDays,plan){
  const items=[];
  plan.forEach(function(x){
    items.push({text:x.step});
    (x.subs||[]).forEach(function(tx){ items.push({text:String(tx)}); });
  });
  return addGoal(title,targetDays,items.slice(0,15));
}

function goalStat(g){
  const total=Math.max(1,g.targetDays||30);
  let done=0;
  for(const d in (g.log||{})) if(allDone(g,d)) done++;
  const left=diffDays(today(),addDays(g.created,total));
  const elapsed=diffDays(g.created,today());
  return{total:total,done:done,left:left,
    stepsLeft:tasksLeft(g),
    behind:Math.max(0,elapsed-done),
    pct:Math.min(100,Math.round(done/total*100)),
    finished:done>=total};
}
const goalDoneToday=g=>allDone(g,today());
function mainGoal(){
  let g=S.goals.find(function(x){ return x.id===S.mainGoal; });
  if(!g) g=S.goals.find(function(x){ return !goalStat(x).finished; })||S.goals[0]||null;
  return g;
}
function sortedGoals(){
  return S.goals.slice().sort(function(a,b){
    if(a.id===S.mainGoal) return -1;
    if(b.id===S.mainGoal) return 1;
    const fa=goalStat(a).finished?1:0, fb=goalStat(b).finished?1:0;
    return fa-fb;
  });
}

/* Задача конкретного дня внутри конкретной цели */
function taskForDay(g,dateStr){
  const idx=diffDays(g.created,dateStr)+1;
  if(idx<1) return null;
  let cum=0;
  for(let i=0;i<g.steps.length;i++){
    const s=g.steps[i];
    cum+=s.days;
    if(idx<=cum) return {goal:g,step:s,inStep:idx-(cum-s.days),ofStep:s.days};
  }
  return null;
}

/* Цепочка одной цели: от первого дня до последнего дня срока */
/* Украшения по бокам тропинки: вершины, флажки, облака, сундук.
   Ставятся на пустой стороне от кружка, чтобы не перекрывать путь. */
function chainDecor(count,STEP,TOP,g){
  const gc=goalColor(g);
  const st=goalStat(g);
  let h='';
  const cloud='<svg viewBox="0 0 64 34"><path d="M14 30c-7 0-12-5-12-11S7 8 14 8c2-5 7-8 12-8 7 0 13 5 14 12 6 0 12 4 12 10s-6 10-13 10z" fill="rgba(255,255,255,.34)"/></svg>';
  const peak='<svg viewBox="0 0 70 56"><path d="M35 2 68 54H2z" fill="rgba(0,0,0,.13)"/><path d="M35 2 24 20l11 9 11-9z" fill="rgba(255,255,255,.5)"/></svg>';
  const flag='<svg viewBox="0 0 40 56"><path d="M9 54V4" stroke="rgba(255,255,255,.6)" stroke-width="4" stroke-linecap="round"/><path d="M11 6h24l-7 9 7 9H11z" fill="'+gc.c+'"/></svg>';
  const chest='<svg viewBox="0 0 56 46"><rect x="4" y="18" width="48" height="26" rx="4" fill="#8A5A2B"/><path d="M4 18c0-8 11-14 24-14s24 6 24 14z" fill="#A66C33"/><rect x="24" y="22" width="8" height="12" rx="2" fill="#FFC53D"/></svg>';
  const star='<svg viewBox="0 0 40 40"><path d="m20 3 5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="rgba(255,255,255,.42)"/></svg>';

  const items=[
    {y:TOP+STEP*1.2, side:'left',  w:78, el:cloud, o:.9},
    {y:TOP+STEP*2.6, side:'left',  w:86, el:peak,  o:1},
    {y:TOP+STEP*4.0, side:'right', w:56, el:flag,  o:1},
    {y:TOP+STEP*5.6, side:'right', w:74, el:cloud, o:.8},
    {y:TOP+STEP*7.0, side:'left',  w:52, el:star,  o:.9},
    {y:TOP+STEP*8.4, side:'right', w:88, el:peak,  o:1},
    {y:TOP+STEP*10.0,side:'left',  w:70, el:chest, o:1},
    {y:TOP+STEP*11.6,side:'right', w:76, el:cloud, o:.85}
  ];

  items.forEach(function(it,i){
    if(it.y>TOP+STEP*(count-0.5)) return;
    const pos=it.side==='left'?'left:4%':'right:4%';
    h+='<i class="decor" style="'+pos+';top:'+it.y.toFixed(0)+'px;width:'+it.w+'px;'+
       'opacity:'+it.o+';animation-delay:'+(i*260)+'ms">'+it.el+'</i>';
  });

  // финишный флаг у последнего кружка
  if(st.finished){
    h+='<i class="decor win" style="left:6%;top:'+(TOP+STEP*(count-1))+'px;width:70px">'+flag+'</i>';
  }
  return h;
}

function renderChain(g){
  const gc=goalColor(g);
  const totalDays=Math.max(1,g.targetDays||30);
  const days=[];
  for(let i=0;i<totalDays;i++) days.push(addDays(g.created,i));

  const STEP=74,TOP=46,AMP=27;
  // фиксированный узор: путь всегда ложится одинаково и не плавает
  const PATTERN=[50,63,73,63,50,37,27,37];
  const xs=i=>PATTERN[i%PATTERN.length];
  const height=TOP+days.length*STEP+30;
  let h='<div class="chain" style="height:'+height+'px;--gc:'+gc.c+';--gcd:'+gc.d+'">';
  h+=chainDecor(days.length,STEP,TOP,g);

  for(let i=0;i<days.length-1;i++){
    const x1=xs(i),y1=TOP+i*STEP,x2=xs(i+1),y2=TOP+(i+1)*STEP;
    const on=allDone(g,days[i])&&allDone(g,days[i+1]);
    const nxt=!on&&((days[i]===today()&&allDone(g,days[i]))||days[i+1]===today());
    for(let k=1;k<=2;k++){
      const f=k/3;
      h+='<i class="link'+(on?' on':(nxt?' next':''))+'" style="left:'+(x1+(x2-x1)*f).toFixed(2)+'%;top:'+(y1+(y2-y1)*f).toFixed(1)+'px;animation-delay:'+(i*30)+'ms"></i>';
    }
  }

  days.forEach(function(d,i){
    const y=TOP+i*STEP,x=xs(i),n=i+1;
    const mark=allDone(g,d)?'done':(S.days[d]==='freeze'?'freeze':null);
    const isToday=d===today();
    const cls=mark==='done'?'done':mark==='freeze'?'freeze':isToday?'now':(d>today()?'future':'miss');
    const inner=mark==='done'?ICON_CHECK:mark==='freeze'?ICON_SNOW:String(n);

    h+='<div class="day '+cls+'" data-act="day" data-g="'+g.id+'" data-d="'+d+'" style="left:'+x.toFixed(2)+'%;top:'+y+'px;animation-delay:'+Math.min(i*30,900)+'ms">'+
       inner+(mark?'<small>'+n+'</small>':'')+'</div>';

    if(isToday){
      h+='<div class="bolt" style="left:'+x.toFixed(2)+'%;top:'+(y-48)+'px">'+
         '<svg width="32" height="32" viewBox="0 0 24 24" fill="#FFB23F" stroke="#C77A12" stroke-width="1.5" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>'+
         '<i class="bolt-tail"></i></div>';
    }
  });

  h+='<div class="finish" style="left:50%;top:'+(TOP+days.length*STEP)+'px">'+
     '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h13l-2.5 4L18 12H5"/></svg>'+
     t('finishLabel')+'</div>';
  return h+'</div>';
}

function openDay(goalId,dateStr){
  const g=S.goals.find(function(x){ return x.id===goalId; }); if(!g) return;
  const full=allDone(g,dateStr);
  const isToday=dateStr===today(), isFuture=dateStr>today();
  const n=diffDays(g.created,dateStr)+1;
  const frozen=S.days[dateStr]==='freeze';
  const cls=full?'done':frozen?'freeze':isToday?'now':isFuture?'':'miss';
  const status=full?t('stDone'):frozen?t('stFreeze')
              :isToday?t('stNow'):isFuture?t('stFuture'):t('stMiss');

  let body='<div class="sheet-task-l" style="margin:0 3px 8px">'+t('subsLabel')+'</div><div class="sheet-subs">';
  (g.tasks||[]).forEach(function(tk,k){
    const on=isTaskDone(g,dateStr,tk.id);
    body+='<div class="sheet-sub'+(on?' on':'')+'"'+
      (isToday?' data-act="sheet-task" data-g="'+g.id+'" data-t="'+tk.id+'"':' style="opacity:.55"')+'>'+
      '<i class="sub-box">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>'+
      '</i><b class="sub-num">'+(k+1)+'</b><span>'+esc(tk.text)+'</span></div>';
  });
  body+='</div><div style="height:14px"></div>';

  let note='';
  if(isFuture) note='<div class="card-s" style="text-align:center;margin-bottom:12px">'+t('cantFuture')+'</div>';
  else if(!isToday&&!full) note='<div class="card-s" style="text-align:center;margin-bottom:12px">'+t('cantPast')+'</div>';
  else if(isToday&&!full) note='<div class="card-s" style="text-align:center;margin-bottom:12px">'+t('needAll')+'</div>';

  const back=document.createElement('div');
  back.className='backdrop'; back.id='backdrop';
  const sheet=document.createElement('div');
  sheet.className='sheet'; sheet.id='sheet';
  const left=(g.tasks||[]).filter(function(tk){ return !isTaskDone(g,dateStr,tk.id); }).length;
  const sheetMood = full?'allDone':(left===1?'almost':(left<(g.tasks||[]).length?'progress':'hello'));

  sheet.innerHTML='<div class="sheet-grip"></div>'+
    (isToday?'<div class="mascot-zone" style="min-height:88px;margin-bottom:14px">'+
      '<div class="motto" data-act="sheet-poke" id="sheet-bubble">'+esc(say(sheetMood))+'</div></div>':'')+
    '<div class="sheet-num">'+
    '<div class="sheet-badge '+cls+'">'+n+'</div><div><div class="sheet-t">'+t('dayTitle',{n:n})+'</div>'+
    '<div class="sheet-s">'+esc(g.title)+' \u00b7 '+status+'</div></div></div>'+body+note+
    '<button class="btn btn-ghost" data-act="sheet-close">'+t('close')+'</button>';

  document.body.appendChild(back); document.body.appendChild(sheet);
  requestAnimationFrame(function(){ back.classList.add('show'); sheet.classList.add('show'); });

  back.addEventListener('click',closeSheet);
  sheet.addEventListener('click',function(e){
    const el=e.target.closest('[data-act]'); if(!el) return;
    if(el.dataset.act==='sheet-close'){ closeSheet(); return; }
    if(el.dataset.act==='sheet-poke'){
      el.classList.add('cheer');
      setTimeout(function(){ el.classList.remove('cheer'); },800);
      const sb=document.getElementById('sheet-bubble');
      if(sb){ sb.textContent=say('poke'); sb.style.animation='none'; void sb.offsetHeight; sb.style.animation=''; }

      haptic('tap'); return;
    }
    if(el.dataset.act==='sheet-task'){
      const r=toggleTask(Number(el.dataset.g),Number(el.dataset.t));
      el.classList.toggle('on'); haptic('tap');
      if(r&&r.completed){
        const rect=el.getBoundingClientRect();
        sparks(rect.left+rect.width/2,rect.top+rect.height/2);
        if(r.events) chargeFly(r.events);
        closeSheet();
        // полноэкранное поздравление с орлом — как при закрытии дня
        setTimeout(function(){
          const allNow=S.goals.filter(function(x){ return x.tasks&&x.tasks.length; }).every(goalDoneToday);
          celebrate(r.grew?S.streak:0,
                    allNow?t('celAll'):(r.grew?t('celFirst'):t('celGoal')),
                    r.grew?t('celSub'):say('allDone'));
        },340);
      } else {
        if(r&&r.on) flash(r.left===1?t('flashLast'):t('flashOk'),'var(--fire-2)');
        if(r&&r.events) chargeFly(r.events);
        const m=document.querySelector('.mascot');
        if(m){ m.classList.add('cheer'); setTimeout(function(){ m.classList.remove('cheer'); },800); }
        const b=document.getElementById('sheet-bubble')||document.getElementById('bubble');
        if(b&&r){ b.textContent=(r.left===1)?say('almost'):(r.on?say('progress'):say('hello'));
          b.style.animation='none'; void b.offsetHeight; b.style.animation=''; }
      }
    }
  });
}

function closeSheet(){
  const back=document.getElementById('backdrop'),sheet=document.getElementById('sheet');
  if(back) back.classList.remove('show');
  if(sheet) sheet.classList.remove('show');
  setTimeout(function(){ if(back) back.remove(); if(sheet) sheet.remove(); },340);
}

/* Загрузка своей аватарки: ужимаем до 160px, чтобы не раздувать хранилище */
function pickAvatar(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.addEventListener('change',function(){
    const f=inp.files&&inp.files[0]; if(!f) return;
    if(f.size>8*1024*1024){ toast(t('avaBig')); haptic('warn'); return; }
    const fr=new FileReader();
    fr.onload=function(){
      const img=new Image();
      img.onload=function(){
        const N=160, cv=document.createElement('canvas');
        cv.width=N; cv.height=N;
        const ctx=cv.getContext('2d');
        const side=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,N,N);
        S.avatar=cv.toDataURL('image/jpeg',0.72);
        saveState(); haptic('ok'); toast(t('avaSaved')); render();
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
  inp.click();
}

  const letter=((u&&u.name)||'?').trim().charAt(0).toUpperCase();
  return '<div class="ava" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz/2.7)+'px">'+esc(letter)+'</div>';
}

const NAV_ICONS={
  star:'<path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/>',

};

/* Все иконки всегда горят цветом выбранной темы, активная — ярче и крупнее */
function navHtml(){
  const items=[['more','star','#E8B21F'],['goals','cup','#E8901F'],['rivals','swords','#B01E33']];

    const k=it[0], ico=it[1], col=it[2];

function render(){
  refillFreezes();
  const app=document.getElementById('app');
  app.innerHTML = screen==='today'?viewToday()
                : screen==='goals'?viewGoals()
                : screen==='person'?viewPerson()
                : screen==='rivals'?viewRivals()
                : viewSettings();
  document.getElementById('nav').innerHTML=navHtml();
  // орёл живёт своей жизнью: меняет реплики и позы
  const msc=document.getElementById('mascot');
  const bub=document.getElementById('bubble');
  if(msc&&bub){
    clearInterval(window.__motiv);
    const goalsNow=S.goals.filter(function(g){ return g.tasks&&g.tasks.length; });
    window.__motiv=setInterval(function(){
      if(!document.getElementById('mascot')){ clearInterval(window.__motiv); return; }
      const md=mascotMood(goalsNow);
      bub.textContent=say(md);
      bub.style.animation='none'; void bub.offsetHeight; bub.style.animation='';

      msc.classList.add('cheer');
      setTimeout(function(){ msc.classList.remove('cheer'); },800);
    },7000);
  }

  const gcar=document.getElementById('gcar');
  if(gcar){
    const active=gcar.querySelector('.gpill.on');
    if(active) gcar.scrollLeft=active.offsetLeft-(gcar.clientWidth/2)+(active.offsetWidth/2);
    let tmr=null;
    gcar.addEventListener('scroll',function(){
      clearTimeout(tmr);
      tmr=setTimeout(function(){
        const mid=gcar.scrollLeft+gcar.clientWidth/2;
        let best=null,bd=1e9;
        Array.prototype.forEach.call(gcar.children,function(el){
          const c=el.offsetLeft+el.offsetWidth/2, d=Math.abs(c-mid);
          if(d<bd){ bd=d; best=el; }
        });
        Array.prototype.forEach.call(gcar.children,function(el){ el.classList.toggle('on',el===best); });
        if(best&&best.dataset.g&&Number(best.dataset.g)!==chainGoal){
          chainGoal=Number(best.dataset.g);
          const pg=currentChainGoal();
          const ttl=document.querySelector('.chain-title');
          if(ttl&&pg) ttl.textContent=pg.title;
          const box=document.querySelector('.field-box');
          if(box&&pg){
            const old=box.querySelector('.chain');
            if(old) old.outerHTML=renderChain(pg);
          }
        }
      },90);
    },{passive:true});
  }

  const car=document.getElementById('carousel');
  const dots=document.getElementById('dots');
  if(car){
    car.addEventListener('scroll',function(){
      const w=car.scrollWidth/car.children.length;
      const i=Math.max(0,Math.min(car.children.length-1,Math.round(car.scrollLeft/w)));
      if(dots) Array.prototype.forEach.call(dots.children,function(d,k){ d.classList.toggle('on',k===i); });
      const sl=car.children[i];
      if(sl&&sl.dataset.gid) chainGoal=Number(sl.dataset.gid);
    },{passive:true});
  }

  const ring=app.querySelector('.ring-fg');
  if(ring) requestAnimationFrame(function(){ ring.style.strokeDashoffset=ring.dataset.off; });

}

/* ================== СВАЙП МЕЖДУ РАЗДЕЛАМИ ================== */
const SCREENS=['today','goals','rivals','more'];

(function swipeNav(){
  let x0=null,y0=null,t0=0,lock=false;
  const app=document.getElementById('app');
  if(!app) return;

  app.addEventListener('touchstart',function(e){
    if(e.touches.length!==1) return;
    // не перехватываем жест внутри горизонтальных лент
    lock=!!e.target.closest('.gcar,.carousel,.switcher,.sheet,.chips,.task-rows');
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now();
  },{passive:true});

  app.addEventListener('touchend',function(e){
    if(x0===null||lock){ x0=null; return; }
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    x0=null;
    if(dt>600) return;
    if(Math.abs(dx)<64||Math.abs(dx)<Math.abs(dy)*1.8) return;

    const i=SCREENS.indexOf(screen);
    if(i<0) return;
    const next=dx<0?i+1:i-1;
    if(next<0||next>=SCREENS.length) return;

    screen=SCREENS[next];
    if(screen!=='goals') draft=null;
    haptic('tap');
    const app2=document.getElementById('app');
    if(app2){
      app2.style.animation='none'; void app2.offsetHeight;
      app2.style.animation='slide'+(dx<0?'L':'R')+' .28s cubic-bezier(.2,.9,.3,1)';
    }
    render();
  },{passive:true});
})();

  if(screen==='rivals'){ foundPlayer=null; S.isAdmin?loadAdmin():loadTop(); }
});

document.getElementById('app').addEventListener('click',function(e){
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;

  if(act==='hint'){ toast(t(el.dataset.h)); haptic('tap'); return; }

  if(act==='scheme'){
    S.scheme=el.dataset.v; applyScheme(S.scheme); applyTheme(S.theme);
    saveState(); haptic('ok'); render(); return;
  }

  if(act==='theme'){
    S.theme=el.dataset.v; applyTheme(S.theme); saveState(); haptic('ok'); render(); return;
  }

  if(act==='tour'){ tourStep=0; showTour(); return; }

  if(act==='rc'){
    const d=Number(el.dataset.v);
    let n=Number(S.remindCount==null?2:S.remindCount)+d;
    n=Math.max(0,Math.min(MAX_REMINDERS,n));
    S.remindCount=n; S.remindTimes='';
    saveState(); haptic('tap'); render(); return;
  }

  if(act==='rt-save'){
    const inp=document.getElementById('r-times');
    const raw=inp?inp.value.trim():'';
    if(!raw){ S.remindTimes=''; saveState(); haptic('tap'); toast(t('notifSaved')); render(); return; }
    const parsed=parseTimes(raw);
    if(!parsed.length){ toast(t('notifBad')); haptic('warn'); return; }
    S.remindTimes=parsed.join(', ');
    S.remindCount=parsed.length;
    saveState(); haptic('ok'); toast(t('notifSaved')); render(); return;
  }

  if(act==='rt-auto'){
    S.remindTimes=''; saveState(); haptic('tap'); toast(t('notifSaved')); render(); return;
  }

  if(act==='task-add'){
    syncDraft();
    if(draft.tasks.length<15) draft.tasks.push('');
    haptic('tap'); render(); return;
  }

  if(act==='task-del'){
    syncDraft();
    draft.tasks.splice(Number(el.dataset.i),1);
    if(!draft.tasks.length) draft.tasks=[''];
    haptic('tap'); render(); return;
  }

  if(act==='task'){
    const r=toggleTask(Number(el.dataset.g),Number(el.dataset.t));
    haptic('tap');
    if(r&&r.completed){
      const allNow=S.goals.filter(function(g){ return g.tasks&&g.tasks.length; }).every(goalDoneToday);
      celebrate(r.grew?S.streak:0,
                allNow?t('celAll'):(r.grew?t('celFirst'):t('celGoal')),
                r.grew?t('celSub'):'');
      return;
    }
    if(r&&r.on) flash(r.left===1?t('flashLast'):t('flashOk'),'var(--fire-2)');
    if(r&&r.events) chargeFly(r.events);
    render(); return;
  }

  if(act==='pick'){ chainGoal=Number(el.dataset.g); haptic('tap'); render(); return; }

  if(act==='pick'){
    chainGoal=Number(el.dataset.g);
    haptic('tap'); render();
    setTimeout(function(){
      const on=document.querySelector('.gpill.on');
      if(on&&on.scrollIntoView) on.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    },40);
    return;
  }

  if(act==='poke'){
    el.classList.add('cheer');
    setTimeout(function(){ el.classList.remove('cheer'); },800);
    const b=document.getElementById('bubble');
    if(b){ b.textContent=say('poke'); b.style.animation='none'; void b.offsetHeight; b.style.animation=''; }
    haptic('tap'); return;
  }

  if(act==='sub'){
    toggleSub(Number(el.dataset.g),Number(el.dataset.s),Number(el.dataset.i));
    haptic('tap'); render(); return;
  }

  if(act==='day'){ haptic('tap'); openDay(Number(el.dataset.g),el.dataset.d); return; }
  if(act==='chain'){ chainGoal=Number(el.dataset.g); haptic('tap'); render(); return; }

  if(act==='setmain'){
    S.mainGoal=Number(el.dataset.g); saveState(); haptic('ok'); toast(t('mainSet')); render(); return;
  }

  if(act==='group'){
    haptic('tap');
    if(tg&&tg.openTelegramLink) tg.openTelegramLink(GROUP_URL);
    else window.open(GROUP_URL,'_blank');
    return;
  }

  if(act==='p-refresh'||act==='p-find'||act==='a-refresh'||act==='a-block'||act==='a-unblock'){
    haptic('tap');
    if(act==='p-refresh'){ loadTop(); return; }
    if(act==='a-refresh'){ loadAdmin(); return; }
    if(act==='p-find'){
      const inp=document.getElementById('r-nick');
      const nick=(inp?inp.value:'').trim().replace(/^@/,'');
      if(!nick) return;
      api('/api/find',{nick:nick}).then(function(d){
        foundPlayer=(d&&d.nick)?d:false; render();
      }).catch(function(){ toast(t('syncFail')); });
      return;
    }
    const inp=document.getElementById('a-nick');
    const nick=(inp?inp.value:'').trim().replace(/^@/,'');
    if(!nick){ toast(t('aNeedNick')); return; }
    api('/api/admin',{action:(act==='a-block')?'block':'unblock',nick:nick})
      .then(function(){ toast(act==='a-block'?t('aDoneBlock'):t('aDoneUnblock')); loadAdmin(); })
      .catch(function(){ toast(t('syncFail')); });
    return;
  }

  if(act==='ava-pick'){ haptic('tap'); pickAvatar(); return; }

  if(act==='ava-clear'){
    S.avatar=''; saveState(); haptic('tap'); toast(t('avaReset')); render(); return;
  }

  if(act==='save-name'){
    const inp=document.getElementById('p-name');
    if(inp&&inp.value.trim()){ S.name=inp.value.trim().slice(0,40); saveState(); haptic('ok'); toast(t('nameSaved')); render(); }
    return;
  }

  if(act==='gen-plan'){
    syncDraft();
    if(!draft.title.trim()){ toast(t('genNeedTitle')); haptic('warn'); return; }
    haptic('tap');

    const applyLocal=function(){
      const list=localPlan(draft.title);
      // при повторном нажатии слегка меняем порядок, чтобы вариант отличался
      if(draft.aiPlan) list.push(list.shift());
      draft.tasks=list.slice(0,15);
      draft.aiPlan=list.map(function(x){ return {step:x}; });
      haptic('ok'); toast(t('genLocal')); render();
    };

    if(!API_URL){ applyLocal(); return; }

    el.disabled=true; el.textContent=t('genWait');
    const prev=(draft.aiPlan||[]).map(function(x){ return x.step; });
    api('/api/plan',{goal:draft.title.trim(),days:draft.days||30,
                     about:'',avoid:prev.length?prev:null})
      .then(function(d){
        if(d&&d.plan&&d.plan.length){
          const list=[];
          d.plan.forEach(function(x){
            list.push(x.step);
            (x.subs||[]).forEach(function(tx){ list.push(String(tx)); });
          });
          draft.aiPlan=d.plan;
          draft.tasks=list.slice(0,15);
          haptic('ok'); toast(t('genOk')); render();
        } else applyLocal();
      })
      .catch(function(){ applyLocal(); });
    return;
  }

  if(act==='go-new'){ draft={title:'',days:30,tasks:['','',''],aiPlan:null}; screen='goals'; haptic('tap'); render(); return; }
  if(act==='cancel'){ draft=null; haptic('tap'); render(); return; }
  if(act==='days'){ syncDraft(); draft.days=Number(el.dataset.n); haptic('tap'); render(); return; }

  if(act==='lang'){
    S.lang=el.dataset.v; saveState(); haptic('tap');
    document.documentElement.lang=S.lang; render(); return;
  }

  if(act==='sync'){ haptic('tap'); pullFromServer(false).then(function(ok){ if(ok) render(); }); return; }

  if(act==='reset'){
    const kill=function(){ S=blank(); saveState(); haptic('ok'); toast(t('resetOk')); screen='today'; render(); };
    if(tg&&tg.showConfirm) tg.showConfirm(t('resetAsk'),function(ok){ if(ok) kill(); });
    else if(confirm(t('resetAsk'))) kill();
    return;
  }

  if(act==='save-goal'){
    syncDraft();
    const title=draft.title.trim();
    const steps=(draft.tasks||[]).map(function(x){ return String(x||'').trim(); })
                                 .filter(Boolean).map(function(x){ return {text:x.slice(0,160)}; });
    const days=Math.max(1,Math.min(365,Number(draft.days)||30));
    if(!canAddGoal()){
      const till=blockedUntil();
      toast(till?t('blockedTill',{d:till}):t('limitReached',{n:GOALS_PER_DAY}));
      haptic('warn'); return;
    }
    if(!title){ toast(t('needTitle')); haptic('warn'); return; }
    if(!steps.length){ toast(t('needStep')); haptic('warn'); return; }
    // если шаги пришли от нейросети и не правились — сохраняем её распределение дней
    addGoal(title,days,steps);
    if(tg&&tg.sendData){ try{ tg.sendData(JSON.stringify({action:'add_goal',title:title,days:days,steps:steps})); }catch(err){} }
    draft=null; haptic('ok'); toast(t('goalCreated')); screen='today'; render(); return;
  }

  if(act==='toggle'){ const id=Number(el.dataset.g); openGoal=openGoal===id?null:id; haptic('tap'); render(); return; }

  if(act==='drop'){
    const id=Number(el.dataset.g);
    const kill=function(){
      S.goals=S.goals.filter(function(g){ return g.id!==id; });
      if(S.mainGoal===id) S.mainGoal=S.goals.length?S.goals[0].id:null;
      if(chainGoal===id) chainGoal=null;
      openGoal=null; saveState(); haptic('ok'); toast(t('goalDeleted')); render();
    };
    if(tg&&tg.showConfirm) tg.showConfirm(t('deleteAsk'),function(ok){ if(ok) kill(); });
    else if(confirm(t('deleteAsk'))) kill();
    return;
  }

});

function syncDraft(){
  if(!draft) return;
  const a=document.getElementById('d-title'), b=document.getElementById('d-days');
  if(a) draft.title=a.value;
  if(b&&b.value.trim()){ const n=parseInt(b.value,10); if(n>=1&&n<=365) draft.days=n; }
  const inputs=document.querySelectorAll('.task-input');
  if(inputs.length){
    const arr=[];
    inputs.forEach(function(el){ arr[Number(el.dataset.i)]=el.value; });
    draft.tasks=arr.map(function(x){ return x||''; });
  }
}

/* ================== СТАРТ ================== */
(async function init(){
  const saved=await loadState();
  S = (saved&&saved.goals) ? Object.assign(blank(),saved) : blank();
  if(!S.lang) S.lang=tgLang();
  if(!S.start) S.start=today();
  S.goals=(S.goals||[]).map(migrateGoal);
  const u=tgUser();
  if(u.username) S.nick=u.username;
  if(u.photo_url) S.photo=u.photo_url;
  if(!S.mainGoal&&S.goals.length) S.mainGoal=S.goals[0].id;
  if(S.remindCount==null) S.remindCount=2;
  if(S.remindTimes==null) S.remindTimes='';
  if(!S.theme||!THEMES[S.theme]) S.theme='crimson';
  if(!S.scheme||!SCHEMES[S.scheme]) S.scheme='light';
  applyScheme(S.scheme);
  applyTheme(S.theme);
  document.documentElement.lang=S.lang;
  memory=JSON.parse(JSON.stringify(S));

  const rescued=applyFreeze();
  render();

  if(!S.tourDone) setTimeout(function(){ tourStep=0; showTour(); },450);

  // приложение уже показано и работает; сервер, если есть, догонит данные позже
  if(API_URL) setTimeout(function(){
    pullFromServer(true).then(function(ok){
      if(ok) render();
      // подтягиваем рейтинг заранее, чтобы раздел открывался уже заполненным
      if(S.isAdmin) loadAdmin(); else loadTop();
    });
  },300);

  if(rescued) setTimeout(function(){ toast(t('frozeSaved',{n:rescued})); },700);
  else if(!anyDoneToday()&&liveStreak()>0)
    setTimeout(function(){ toast(t('dontLose',{n:liveStreak(),w:dayWord(liveStreak())})); },800);
})();
</script>
