<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Путь — дневник целей</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0918;
  --surface:#17132E;
  --surface-2:#211B45;
  --line:#2E2757;
  --line-soft:#241E49;

  --blue:#4C8DFF;
  --blue-deep:#2A63C8;
  --violet:#7C5CFC;
  --violet-deep:#5433C9;
  --amber:#FFB23F;
  --amber-deep:#C77A12;
  --ice:#7CC4FF;

  --text:#FFFFFF;
  --muted:#9A93C7;
  --dim:#6C659B;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:12px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{
  font-family:'Nunito',system-ui,sans-serif;
  background:var(--ink);
  color:var(--text);
  padding:14px 14px calc(96px + env(safe-area-inset-bottom));
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit}
.hidden{display:none !important}

/* ============ иконки ============ */
.ic{width:20px;height:20px;flex:none;display:block}
.ic-lg{width:26px;height:26px}

/* ============ верхняя панель ============ */
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--surface);
  border:2px solid var(--line);
  border-radius:var(--r-lg);
  padding:11px 8px;
  margin-bottom:18px;
  animation:drop .45s cubic-bezier(.2,.9,.3,1.2) both;
}
.metric{
  display:flex;align-items:center;gap:7px;
  font-size:17px;font-weight:900;
  flex:1;justify-content:center;
  position:relative;
}
.metric+.metric::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:20px;background:var(--line-soft);border-radius:2px;
}
.m-fire{color:var(--amber)}
.m-ice{color:var(--ice)}
.m-best{color:var(--violet)}
.metric.pulse{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

/* ============ карточка цели ============ */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(140deg,#5B47E0 0%,#3A5BD9 55%,#2E77D0 100%);
  border-radius:var(--r-lg);
  padding:20px 20px 18px;
  margin-bottom:22px;
  box-shadow:0 6px 0 #26205C;
  animation:drop .5s .06s cubic-bezier(.2,.9,.3,1.2) both;
}
.hero::after{
  content:'';position:absolute;right:-60px;top:-70px;
  width:190px;height:190px;border-radius:50%;
  background:rgba(255,255,255,.07);
}
.hero-eyebrow{
  font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;
  color:rgba(255,255,255,.62);margin-bottom:7px;
}
.hero-title{font-size:23px;font-weight:900;line-height:1.15;margin-bottom:16px;position:relative}
.hero-row{display:flex;align-items:center;gap:16px;position:relative}
.ring{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(0,0,0,.25);stroke-width:8}
.ring-fg{fill:none;stroke:#7CE0D0;stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)}
.ring-wrap{position:relative;flex:none}
.ring-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;
}
.hero-meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-day{font-size:15px;font-weight:800}
.hero-note{font-size:13px;font-weight:700;color:rgba(255,255,255,.7)}
.hero-warn{color:#FFD48A}

/* ============ заголовки секций ============ */
.sec{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 4px 12px;
}
.sec-t{font-size:13px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.sec-c{font-size:13px;font-weight:900;color:var(--dim)}

/* ============ карточки задач ============ */
.stack{display:flex;flex-direction:column;gap:11px;margin-bottom:26px}
.card{
  background:var(--surface);
  border:2px solid var(--line);
  border-radius:var(--r-md);
  padding:14px 15px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 4px 0 var(--line-soft);
  animation:drop .45s both;
}
.card-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.card-t{font-size:16px;font-weight:800;line-height:1.25}
.card-s{font-size:12.5px;font-weight:700;color:var(--muted)}
.card.done{opacity:.45;box-shadow:none;border-color:var(--line-soft);background:#120F28}
.card.done .card-t{text-decoration:line-through;text-decoration-thickness:2px}
.card.tapped{animation:shake .4s}

/* мини-полоса прогресса шага */
.mini{height:5px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:5px;width:120px;max-width:100%}
.mini i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.3,1)}

/* ============ кнопки ============ */
.btn{
  border:none;border-radius:var(--r-sm);
  font-weight:900;font-size:15px;letter-spacing:.4px;text-transform:uppercase;
  padding:12px 18px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .08s ease,box-shadow .08s ease,opacity .2s;
  flex:none;
}
.btn:active{transform:translateY(4px)}
.btn-go{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn-go:active{box-shadow:0 0 0 var(--blue-deep)}
.btn-main{background:var(--violet);color:#fff;box-shadow:0 5px 0 var(--violet-deep);width:100%;padding:15px}
.btn-main:active{box-shadow:0 0 0 var(--violet-deep)}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--line);box-shadow:none;width:100%;padding:13px}
.btn-ghost:active{transform:translateY(2px)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn-sm{padding:9px 14px;font-size:13px}

/* ============ дорожка ============ */
.path{position:relative;padding:6px 0 10px}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{
  position:relative;display:flex;align-items:center;gap:13px;
  margin-bottom:16px;
  animation:drop .5s both;
}
.dot{
  width:50px;height:50px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;
  border:3px solid var(--line);
  background:var(--surface-2);color:var(--dim);
  z-index:2;transition:all .35s cubic-bezier(.3,1.5,.5,1);
}
.dot.done{background:var(--blue);border-color:var(--blue-deep);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.dot.now{
  background:var(--violet);border-color:var(--violet-deep);color:#fff;
  box-shadow:0 4px 0 var(--violet-deep);
  animation:breathe 2.4s ease-in-out infinite;
}
.dot.just{animation:pop .55s cubic-bezier(.3,1.7,.5,1)}
.node-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.node-t{font-size:15px;font-weight:800;line-height:1.25}
.node.locked .node-t{color:var(--dim)}
.node-s{font-size:12px;font-weight:700;color:var(--muted)}
.node.locked .node-s{color:#4E4880}

/* ============ формы ============ */
.panel{
  background:var(--surface);border:2px solid var(--line);
  border-radius:var(--r-lg);padding:16px;
  box-shadow:0 4px 0 var(--line-soft);
  animation:drop .45s both;
}
.field{
  width:100%;background:var(--ink);
  border:2px solid var(--line);border-radius:var(--r-sm);
  padding:13px 15px;color:#fff;font-size:16px;font-weight:700;
  outline:none;transition:border-color .2s;resize:none;
}
.field::placeholder{color:var(--dim);font-weight:700}
.field:focus{border-color:var(--violet)}
.label{font-size:12px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px 3px}
.gap{height:16px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  flex:1;min-width:68px;
  background:var(--ink);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:12px 6px;color:var(--muted);font-weight:900;font-size:15px;
  cursor:pointer;transition:all .15s;text-align:center;
}
.chip.on{background:var(--violet);border-color:var(--violet-deep);color:#fff;box-shadow:0 3px 0 var(--violet-deep)}
.chip:active{transform:translateY(2px)}

/* ============ календарь ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-h{font-size:11px;font-weight:900;color:var(--dim);text-align:center;padding-bottom:2px}
.cell{
  aspect-ratio:1;border-radius:9px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--dim);
  animation:fade .4s both;
}
.cell.done{background:var(--blue);color:#fff;box-shadow:inset 0 -3px 0 var(--blue-deep)}
.cell.freeze{background:var(--ice);color:#0B2340;box-shadow:inset 0 -3px 0 #4A9BD8}
.cell.miss{background:#1C1738;color:#443E70}
.cell.void{background:transparent}
.cell.today{outline:2px solid var(--violet);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:block}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}
.tile{
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);
  padding:15px;box-shadow:0 4px 0 var(--line-soft);
  animation:drop .45s both;
}
.tile-n{font-size:28px;font-weight:900;line-height:1;margin-bottom:5px}
.tile-l{font-size:12px;font-weight:800;color:var(--muted)}

/* ============ пустые состояния ============ */
.empty{text-align:center;padding:34px 20px;animation:fade .5s both}
.empty svg{opacity:.35;margin-bottom:14px}
.empty-t{font-size:17px;font-weight:900;margin-bottom:7px}
.empty-s{font-size:14px;font-weight:700;color:var(--muted);line-height:1.5;margin-bottom:18px}

/* ============ нижнее меню ============ */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(23,19,46,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:2px solid var(--line);
  display:flex;
  padding:9px 0 calc(9px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--dim);font-size:11px;font-weight:900;letter-spacing:.4px;
  cursor:pointer;padding:3px 0;transition:color .2s;
}
.tab.on{color:var(--violet)}
.tab.on .ic-lg{transform:translateY(-2px) scale(1.08)}
.tab .ic-lg{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}

/* ============ тост ============ */
.toast{
  position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);
  background:var(--violet);color:#fff;
  padding:12px 20px;border-radius:14px;
  font-weight:900;font-size:14px;z-index:200;
  box-shadow:0 6px 20px rgba(0,0,0,.45);
  transition:transform .4s cubic-bezier(.2,1.4,.4,1);
  max-width:88%;text-align:center;
}
.toast.show{transform:translate(-50%,0)}

/* ============ частицы ============ */
.spark{position:fixed;width:9px;height:9px;border-radius:2px;z-index:150;pointer-events:none}

/* ============ анимации ============ */
@keyframes drop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{box-shadow:0 4px 0 var(--violet-deep),0 0 0 0 rgba(124,92,252,.5)}
  50%{box-shadow:0 4px 0 var(--violet-deep),0 0 0 11px rgba(124,92,252,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="app"></div>

<nav class="nav">
  <div class="tab on" data-tab="today">
    <svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
    <span>Сегодня</span>
  </div>
  <div class="tab" data-tab="goals">
    <svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>
    <span>Цели</span>
  </div>
  <div class="tab" data-tab="stats">
    <svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
    <span>Успехи</span>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ==========================================================================
   Telegram
   ========================================================================== */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0B0918'); tg.setBackgroundColor('#0B0918'); } catch(e){} }

function haptic(type){
  if (!tg || !tg.HapticFeedback) return;
  try {
    if (type === 'ok') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'warn') tg.HapticFeedback.notificationOccurred('warning');
    else tg.HapticFeedback.impactOccurred('light');
  } catch(e){}
}

/* ==========================================================================
   Хранилище: CloudStorage Telegram, память как запасной вариант
   ========================================================================== */
const KEY = 'pathstate_v1';
let memory = null;

function loadState(){
  return new Promise(resolve => {
    if (tg && tg.CloudStorage && tg.CloudStorage.getItem) {
      let settled = false;
      const done = v => { if (!settled) { settled = true; resolve(v); } };
      setTimeout(() => done(null), 2500);          // не ждём вечно
      tg.CloudStorage.getItem(KEY, (err, val) => {
        if (err || !val) return done(null);
        try { done(JSON.parse(val)); } catch(e){ done(null); }
      });
    } else {
      resolve(memory);
    }
  });
}

function saveState(){
  const raw = JSON.stringify(S);
  memory = JSON.parse(raw);
  if (tg && tg.CloudStorage && tg.CloudStorage.setItem) {
    try { tg.CloudStorage.setItem(KEY, raw, () => {}); } catch(e){}
  }
}

/* ==========================================================================
   Даты
   ========================================================================== */
const pad = n => String(n).padStart(2,'0');
const key = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const today = () => key(new Date());
function shift(n){ const d = new Date(); d.setDate(d.getDate()+n); return key(d); }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000); }

function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m100 >= 11 && m100 <= 14) return many;
  if (m10 === 1) return one;
  if (m10 >= 2 && m10 <= 4) return few;
  return many;
}
const dayWord = n => plural(n,'день','дня','дней');

/* ==========================================================================
   Состояние
   ========================================================================== */
let S = null;
let screen = 'today';
let draft = null;          // черновик новой цели
let openGoal = null;       // id раскрытой цели

function blank(){
  return {
    name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Друг',
    streak: 0, best: 0, freezes: 1, freezeWeek: weekTag(),
    lastDone: null, days: {}, goals: [], seq: 1
  };
}

function weekTag(){
  const d = new Date(); const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return key(d);
}

function liveStreak(){
  if (!S.lastDone) return 0;
  return (S.lastDone === today() || S.lastDone === shift(-1)) ? S.streak : 0;
}
const doneToday = () => !!S.days[today()];

function refillFreezes(){
  if (S.freezeWeek !== weekTag()){ S.freezeWeek = weekTag(); S.freezes = 1; }
}

/* Пропущен ровно один день — тратим заморозку и спасаем серию */
function applyFreeze(){
  if (!S.lastDone || S.streak <= 0) return null;
  if (S.lastDone !== shift(-2)) return null;
  refillFreezes();
  if (S.freezes <= 0) return null;
  S.freezes -= 1;
  S.lastDone = shift(-1);
  S.days[shift(-1)] = 'freeze';
  saveState();
  return S.streak;
}

/* ==========================================================================
   Цели
   ========================================================================== */
function spread(count, total){
  if (count <= 0) return [];
  if (count >= total) return Array(count).fill(1);
  const base = Math.floor(total / count);
  const out = Array(count).fill(base);
  let rest = total - base * count;
  for (let i = count - 1; rest > 0; i--, rest--) out[i % count] += 1;
  return out;
}

function addGoal(title, targetDays, stepTexts){
  const lens = spread(stepTexts.length, targetDays);
  const g = {
    id: S.seq++, title, targetDays, created: today(),
    steps: stepTexts.map((t,i) => ({ id: S.seq++, text: t, days: lens[i], progress: 0, done: false }))
  };
  S.goals.push(g);
  saveState();
  return g;
}

const nextStep = g => g.steps.find(s => !s.done) || null;

function goalStat(g){
  const total = g.steps.reduce((a,s)=>a+s.days,0) || 1;
  const done  = g.steps.reduce((a,s)=>a+(s.done ? s.days : s.progress),0);
  const left  = diffDays(today(), addDays(g.created, g.targetDays));
  const elapsed = diffDays(g.created, today());
  return { total, done, left, behind: Math.max(0, elapsed - done),
           pct: Math.min(100, Math.round(done/total*100)),
           finished: g.steps.length > 0 && g.steps.every(s=>s.done) };
}
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate()+n); return key(d);
}

/* Отметка шага: +1 день к шагу, +1 к серии (один раз за сутки) */
function completeStep(goalId, stepId){
  const g = S.goals.find(x=>x.id===goalId); if (!g) return null;
  const s = g.steps.find(x=>x.id===stepId); if (!s || s.done) return null;

  s.progress += 1;
  const closed = s.progress >= s.days;
  if (closed) s.done = true;

  let grew = false;
  if (!doneToday()){
    S.streak = (S.lastDone === shift(-1)) ? S.streak + 1 : 1;
    S.best = Math.max(S.best, S.streak);
    S.lastDone = today();
    S.days[today()] = 'done';
    grew = true;
  }
  saveState();
  return { closed, grew, streak: S.streak, goalDone: goalStat(g).finished };
}

/* ==========================================================================
   Мелочи интерфейса
   ========================================================================== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

function sparks(x, y){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#4C8DFF','#7C5CFC','#FFB23F','#7CE0D0','#FFFFFF'];
  for (let i=0;i<16;i++){
    const p = document.createElement('i');
    p.className = 'spark';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', (Math.random()*180-90).toFixed(0)+'px');
    p.style.setProperty('--dy', (-Math.random()*150-40).toFixed(0)+'px');
    p.style.setProperty('--rot', (Math.random()*540-270).toFixed(0)+'deg');
    p.style.animation = `fly ${(0.6+Math.random()*0.5).toFixed(2)}s cubic-bezier(.15,.7,.4,1) forwards`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1200);
  }
}

function stagger(sel){
  document.querySelectorAll(sel).forEach((el,i)=>{ el.style.animationDelay = (i*55) + 'ms'; });
}

/* ==========================================================================
   Экран: Сегодня
   ========================================================================== */
function viewToday(){
  const st = liveStreak();
  const active = S.goals.find(g => !goalStat(g).finished) || S.goals[0] || null;
  let h = topbar(st);

  if (!active){
    h += emptyBlock(
      'Ни одной цели',
      'Большая цель, разбитая на дни, перестаёт быть страшной. Заведи первую — и завтра уже будет что отметить.',
      'Создать цель', 'go-new'
    );
    return h;
  }

  const gs = goalStat(active);
  const R = 26, C = 2*Math.PI*R;
  const off = C * (1 - gs.pct/100);

  h += `<div class="hero">
    <div class="hero-eyebrow">Главная цель</div>
    <div class="hero-title">${esc(active.title)}</div>
    <div class="hero-row">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 64 64">
          <circle class="ring-bg" cx="32" cy="32" r="${R}"/>
          <circle class="ring-fg" cx="32" cy="32" r="${R}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${off.toFixed(1)}"/>
        </svg>
        <div class="ring-num">${gs.pct}%</div>
      </div>
      <div class="hero-meta">
        <div class="hero-day">День ${gs.done} из ${gs.total}</div>
        <div class="hero-note${gs.behind>=3?' hero-warn':''}">${
          gs.finished ? 'Цель достигнута'
          : gs.left < 0 ? `Срок вышел ${-gs.left} ${dayWord(-gs.left)} назад`
          : gs.behind >= 3 ? `Отставание ${gs.behind} ${dayWord(gs.behind)} от плана`
          : `Осталось ${gs.left} ${dayWord(gs.left)}`
        }</div>
      </div>
    </div>
  </div>`;

  const tasks = S.goals.map(g => ({ g, s: nextStep(g) })).filter(x => x.s);
  h += `<div class="sec"><div class="sec-t">План на сегодня</div><div class="sec-c">${tasks.length}</div></div>`;

  if (!tasks.length){
    h += `<div class="panel" style="text-align:center">
      <div class="card-t" style="margin-bottom:6px">Все шаги пройдены</div>
      <div class="card-s" style="margin-bottom:14px">Допиши план или поставь новую цель.</div>
      <button class="btn btn-main" data-act="go-new">Новая цель</button></div>`;
    return h;
  }

  h += '<div class="stack">';
  tasks.forEach(({g,s}) => {
    const finished = doneToday();
    const pct = Math.round(s.progress / s.days * 100);
    h += `<div class="card${finished?' done':''}" id="c${s.id}">
      <div class="card-body">
        <div class="card-t">${esc(s.text)}</div>
        <div class="card-s">${esc(g.title)}${s.days>1 ? ` · день ${Math.min(s.progress+ (finished?0:1), s.days)} из ${s.days}` : ''}</div>
        ${s.days>1 ? `<div class="mini"><i style="width:${pct}%"></i></div>` : ''}
      </div>
      ${finished
        ? `<button class="btn btn-go btn-sm" disabled>Готово</button>`
        : `<button class="btn btn-go btn-sm" data-act="done" data-g="${g.id}" data-s="${s.id}">Готово</button>`}
    </div>`;
  });
  h += '</div>';

  if (doneToday()){
    h += `<div class="panel" style="text-align:center">
      <div class="card-t" style="margin-bottom:5px">День закрыт</div>
      <div class="card-s">Возвращайся завтра, чтобы серия не прервалась.</div></div>`;
  }
  return h;
}

function topbar(st){
  return `<div class="topbar">
    <div class="metric m-fire" id="m-fire">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.5 3.2-1.4 4.6-2.7 6C7.8 9.6 7 11 7 13a5 5 0 0 0 10 0c0-2.7-1.6-4.4-2.6-6.2-.4 .9-1 1.5-1.7 1.9.7-2.4.2-5-.7-6.7z"/></svg>
      <span>${st}</span></div>
    <div class="metric m-ice">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9"/></svg>
      <span>${S.freezes}</span></div>
    <div class="metric m-best">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M9 20h6M12 15v5"/></svg>
      <span>${S.best}</span></div>
  </div>`;
}

function emptyBlock(title, sub, btn, act){
  return `<div class="empty">
    <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#7C5CFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>
    <div class="empty-t">${title}</div>
    <div class="empty-s">${sub}</div>
    <button class="btn btn-main" data-act="${act}">${btn}</button>
  </div>`;
}

/* ==========================================================================
   Экран: Цели
   ========================================================================== */
function viewGoals(){
  if (draft) return viewDraft();

  let h = `<div class="sec"><div class="sec-t">Мои цели</div><div class="sec-c">${S.goals.length}</div></div>`;

  if (!S.goals.length){
    return h + emptyBlock('Пока пусто',
      'Цель без плана — это желание. Раздели её на шаги, и появится маршрут.',
      'Создать цель','go-new');
  }

  S.goals.forEach(g => {
    const gs = goalStat(g);
    const isOpen = openGoal === g.id;
    h += `<div class="panel" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer" data-act="toggle" data-g="${g.id}">
        <div style="min-width:0">
          <div class="card-t" style="margin-bottom:5px">${esc(g.title)}</div>
          <div class="card-s">${gs.finished ? 'Достигнута' : `${gs.done} из ${gs.total} ${dayWord(gs.total)} · осталось ${Math.max(0,gs.left)}`}</div>
        </div>
        <div style="font-size:19px;font-weight:900;color:var(--violet);flex:none">${gs.pct}%</div>
      </div>
      <div class="mini" style="width:100%;margin-top:11px"><i style="width:${gs.pct}%"></i></div>
      ${isOpen ? renderPath(g) + `
        <div class="gap"></div>
        <button class="btn btn-ghost" data-act="drop" data-g="${g.id}">Удалить цель</button>` : ''}
    </div>`;
  });

  h += `<div class="gap"></div><button class="btn btn-main" data-act="go-new">Новая цель</button>`;
  return h;
}

function renderPath(g){
  let h = '<div class="path" style="margin-top:16px">';
  let marked = false;
  g.steps.forEach((s,i) => {
    const indent = [0,14,26,14][i % 4];
    let cls, inner, sub;
    if (s.done){
      cls = 'done';
      inner = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';
      sub = `${s.days} ${dayWord(s.days)} · пройдено`;
    } else if (!marked){
      marked = true; cls = 'now'; inner = String(i+1);
      sub = s.days > 1 ? `сегодня день ${s.progress+1} из ${s.days}` : 'сегодня';
    } else {
      cls = ''; inner = String(i+1);
      sub = `${s.days} ${dayWord(s.days)}`;
    }
    h += `<div class="node${cls===''?' locked':''}" style="margin-left:${indent}px;animation-delay:${i*45}ms">
      <div class="dot ${cls}">${inner}</div>
      <div class="node-txt"><div class="node-t">${esc(s.text)}</div><div class="node-s">${sub}</div></div>
    </div>`;
  });
  return h + '</div>';
}

/* ==========================================================================
   Экран: создание цели
   ========================================================================== */
function viewDraft(){
  const presets = [14,30,60,90];
  return `
  <div class="sec"><div class="sec-t">Новая цель</div></div>
  <div class="panel">
    <div class="label">Что хочешь получить</div>
    <input class="field" id="d-title" placeholder="Выполнить норматив МС по плаванию" value="${esc(draft.title)}">

    <div class="gap"></div>
    <div class="label">За сколько дней</div>
    <div class="chips">
      ${presets.map(n=>`<div class="chip${draft.days===n?' on':''}" data-act="days" data-n="${n}">${n}</div>`).join('')}
    </div>
    <div style="height:8px"></div>
    <input class="field" id="d-days" inputmode="numeric" placeholder="или своё число" value="${presets.includes(draft.days)?'':draft.days||''}">

    <div class="gap"></div>
    <div class="label">Шаги — по одному в строке</div>
    <textarea class="field" id="d-steps" rows="6" placeholder="Набрать объём 3 км в неделю
Отработать старт и повороты
Проплыть контрольную сотню
Выйти на соревнования">${esc(draft.steps)}</textarea>
    <div class="card-s" style="margin:9px 3px 0">Дни распределятся по шагам поровну. Порядок важен: идти будешь сверху вниз.</div>

    <div class="gap"></div>
    <button class="btn btn-main" data-act="save-goal">Создать цель</button>
    <div style="height:9px"></div>
    <button class="btn btn-ghost" data-act="cancel">Отмена</button>
  </div>`;
}

/* ==========================================================================
   Экран: Успехи
   ========================================================================== */
function viewStats(){
  const total = Object.values(S.days).filter(v=>v==='done').length;
  const frozen = Object.values(S.days).filter(v=>v==='freeze').length;
  const finished = S.goals.filter(g=>goalStat(g).finished).length;

  let h = `<div class="sec"><div class="sec-t">Успехи</div></div>
  <div class="tiles">
    <div class="tile" style="animation-delay:0ms"><div class="tile-n" style="color:var(--amber)">${liveStreak()}</div><div class="tile-l">Дней подряд</div></div>
    <div class="tile" style="animation-delay:60ms"><div class="tile-n" style="color:var(--violet)">${S.best}</div><div class="tile-l">Лучшая серия</div></div>
    <div class="tile" style="animation-delay:120ms"><div class="tile-n" style="color:var(--blue)">${total}</div><div class="tile-l">Всего отмечено</div></div>
    <div class="tile" style="animation-delay:180ms"><div class="tile-n" style="color:#7CE0D0">${finished}</div><div class="tile-l">Целей закрыто</div></div>
  </div>`;

  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const first = (new Date(y,m,1).getDay() + 6) % 7;
  const len = new Date(y, m+1, 0).getDate();

  h += `<div class="sec"><div class="sec-t">${months[m]} ${y}</div></div><div class="panel"><div class="cal">`;
  ['пн','вт','ср','чт','пт','сб','вс'].forEach(d => h += `<div class="cal-h">${d}</div>`);
  for (let i=0;i<first;i++) h += '<div class="cell void"></div>';
  for (let d=1; d<=len; d++){
    const k = `${y}-${pad(m+1)}-${pad(d)}`;
    const v = S.days[k];
    const cls = v === 'done' ? 'done' : v === 'freeze' ? 'freeze' : (k < today() ? 'miss' : '');
    h += `<div class="cell ${cls}${k===today()?' today':''}" style="animation-delay:${d*11}ms">${d}</div>`;
  }
  h += `</div><div class="legend">
    <span><i class="sw" style="background:var(--blue)"></i>отмечено</span>
    <span><i class="sw" style="background:var(--ice)"></i>заморозка${frozen?` (${frozen})`:''}</span>
    <span><i class="sw" style="background:#1C1738"></i>пропуск</span>
  </div></div>`;
  return h;
}

/* ==========================================================================
   Отрисовка
   ========================================================================== */
function render(){
  refillFreezes();
  const app = document.getElementById('app');
  app.innerHTML = screen === 'today' ? viewToday()
                : screen === 'goals' ? viewGoals()
                : viewStats();

  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('on', t.dataset.tab === screen));

  stagger('.stack .card');

  // запускаем кольцо прогресса после вставки в DOM
  const ring = app.querySelector('.ring-fg');
  if (ring) requestAnimationFrame(() => { ring.style.strokeDashoffset = ring.dataset.off; });
}

/* ==========================================================================
   События
   ========================================================================== */
document.querySelector('.nav').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  if (screen === tab.dataset.tab) return;
  screen = tab.dataset.tab;
  if (screen !== 'goals') draft = null;
  haptic('tap');
  render();
});

document.getElementById('app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'go-new'){
    draft = { title:'', days:30, steps:'' };
    screen = 'goals';
    haptic('tap');
    render();
    return;
  }

  if (act === 'cancel'){ draft = null; haptic('tap'); render(); return; }

  if (act === 'days'){
    syncDraft();
    draft.days = Number(el.dataset.n);
    haptic('tap');
    render();
    return;
  }

  if (act === 'save-goal'){
    syncDraft();
    const title = draft.title.trim();
    const steps = draft.steps.split('\n')
      .map(s => s.replace(/^\s*(?:[-–—•*]|\d+[.)])\s*/,'').trim())
      .filter(Boolean).slice(0,20);
    const days = Math.max(1, Math.min(365, Number(draft.days) || 30));

    if (!title){ toast('Впиши название цели'); haptic('warn'); return; }
    if (!steps.length){ toast('Нужен хотя бы один шаг'); haptic('warn'); return; }

    addGoal(title, days, steps);
    if (tg && tg.sendData){
      try { tg.sendData(JSON.stringify({ action:'add_goal', title, days, steps })); } catch(err){}
    }
    draft = null;
    haptic('ok');
    toast('Цель создана');
    screen = 'today';
    render();
    return;
  }

  if (act === 'toggle'){
    const id = Number(el.dataset.g);
    openGoal = openGoal === id ? null : id;
    haptic('tap');
    render();
    return;
  }

  if (act === 'drop'){
    const id = Number(el.dataset.g);
    const kill = () => {
      S.goals = S.goals.filter(g => g.id !== id);
      openGoal = null; saveState(); haptic('ok'); toast('Цель удалена'); render();
    };
    if (tg && tg.showConfirm) tg.showConfirm('Удалить цель вместе с планом?', ok => { if (ok) kill(); });
    else if (confirm('Удалить цель вместе с планом?')) kill();
    return;
  }

  if (act === 'done'){
    const goalId = Number(el.dataset.g), stepId = Number(el.dataset.s);
    const r = completeStep(goalId, stepId);
    if (!r) return;

    const rect = el.getBoundingClientRect();
    sparks(rect.left + rect.width/2, rect.top + rect.height/2);
    haptic('ok');

    const fire = document.getElementById('m-fire');
    if (fire && r.grew){ fire.classList.add('pulse'); setTimeout(()=>fire.classList.remove('pulse'),500); }

    if (r.goalDone) toast('Цель достигнута');
    else if (r.closed) toast('Шаг пройден полностью');
    else if (r.grew) toast(`${r.streak} ${dayWord(r.streak)} подряд`);
    else toast('Отмечено');

    setTimeout(render, 260);
  }
});

/* сохраняем ввод формы перед перерисовкой */
function syncDraft(){
  if (!draft) return;
  const t = document.getElementById('d-title');
  const d = document.getElementById('d-days');
  const s = document.getElementById('d-steps');
  if (t) draft.title = t.value;
  if (s) draft.steps = s.value;
  if (d && d.value.trim()){
    const n = parseInt(d.value, 10);
    if (n >= 1 && n <= 365) draft.days = n;
  }
}

/* ==========================================================================
   Старт
   ========================================================================== */
(async function init(){
  const saved = await loadState();
  S = saved && saved.goals ? Object.assign(blank(), saved) : blank();
  memory = JSON.parse(JSON.stringify(S));

  const rescued = applyFreeze();
  render();

  if (rescued) setTimeout(() => toast(`Заморозка спасла серию: ${rescued}`), 700);
  else if (!doneToday() && liveStreak() > 0)
    setTimeout(() => toast(`Серия ${liveStreak()} ${dayWord(liveStreak())} — не потеряй её`), 800);
})();
</script>
