<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Путь — дневник целей</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0918; --surface:#17132E; --surface-2:#211B45;
  --line:#2E2757; --line-soft:#241E49;
  --blue:#4C8DFF; --blue-deep:#2A63C8;
  --violet:#7C5CFC; --violet-deep:#5433C9;
  --amber:#FFB23F; --amber-deep:#C77A12;
  --ice:#7CC4FF; --mint:#7CE0D0; --rose:#FF5C8A;
  --text:#FFFFFF; --muted:#9A93C7; --dim:#6C659B;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --safe-top:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{
  font-family:'Nunito',system-ui,sans-serif;background:var(--ink);color:var(--text);
  padding:calc(14px + var(--safe-top)) 14px calc(96px + env(safe-area-inset-bottom));
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit}
.ic{width:20px;height:20px;flex:none;display:block}
.ic-lg{width:24px;height:24px}

.topbar{display:flex;justify-content:space-between;align-items:center;background:var(--surface);
  border:2px solid var(--line);border-radius:var(--r-lg);padding:11px 8px;margin-bottom:18px;
  animation:drop .45s cubic-bezier(.2,.9,.3,1.2) both}
.metric{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:900;flex:1;justify-content:center;position:relative}
.metric+.metric::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:20px;background:var(--line-soft);border-radius:2px}
.m-fire{color:var(--amber)} .m-ice{color:var(--ice)} .m-best{color:var(--violet)}
.metric.pulse{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

.hero{position:relative;overflow:hidden;
  background:linear-gradient(140deg,#5B47E0 0%,#3A5BD9 55%,#2E77D0 100%);
  border-radius:var(--r-lg);padding:20px;margin-bottom:22px;box-shadow:0 6px 0 #26205C;
  animation:drop .5s .06s cubic-bezier(.2,.9,.3,1.2) both}
.hero::after{content:'';position:absolute;right:-60px;top:-70px;width:190px;height:190px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.hero-eyebrow{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;
  color:rgba(255,255,255,.62);margin-bottom:7px;position:relative;display:flex;align-items:center;gap:6px}
.hero-title{font-size:23px;font-weight:900;line-height:1.15;margin-bottom:16px;position:relative}
.hero-row{display:flex;align-items:center;gap:16px;position:relative}
.ring{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(0,0,0,.25);stroke-width:8}
.ring-fg{fill:none;stroke:var(--mint);stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)}
.ring-wrap{position:relative;flex:none}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.hero-meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-day{font-size:15px;font-weight:800}
.hero-note{font-size:13px;font-weight:700;color:rgba(255,255,255,.7)}
.hero-warn{color:#FFD48A}

.sec{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.sec-t{font-size:13px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.sec-c{font-size:13px;font-weight:900;color:var(--dim)}

.stack{display:flex;flex-direction:column;gap:11px;margin-bottom:26px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);
  padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 4px 0 var(--line-soft);animation:drop .45s both}
.card-body{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.card-t{font-size:16px;font-weight:800;line-height:1.25}
.card-s{font-size:12.5px;font-weight:700;color:var(--muted)}
.card.done{opacity:.55;box-shadow:none;border-color:var(--line-soft);background:#120F28}
.card.done .card-t{text-decoration:line-through;text-decoration-thickness:2px}
.mini{height:6px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:5px;width:100%}
.mini i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.3,1)}

.btn{border:none;border-radius:var(--r-sm);font-weight:900;font-size:15px;letter-spacing:.4px;
  text-transform:uppercase;padding:12px 18px;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:7px;transition:transform .08s ease,box-shadow .08s ease,opacity .2s;flex:none}
.btn:active{transform:translateY(4px)}
.btn-go{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn-go:active{box-shadow:0 0 0 var(--blue-deep)}
.btn-main{background:var(--violet);color:#fff;box-shadow:0 5px 0 var(--violet-deep);width:100%;padding:15px}
.btn-main:active{box-shadow:0 0 0 var(--violet-deep)}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--line);box-shadow:none;width:100%;padding:13px}
.btn-ghost:active{transform:translateY(2px)}
.btn-accent{background:var(--amber);color:#1A0F00;box-shadow:0 4px 0 var(--amber-deep)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn-sm{padding:9px 14px;font-size:13px}

.path{position:relative;padding:6px 0 10px}
.node{position:relative;display:flex;align-items:center;gap:13px;margin-bottom:16px;animation:drop .5s both}
.dot{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;border:3px solid var(--line);background:var(--surface-2);color:var(--dim);
  z-index:2;transition:all .35s cubic-bezier(.3,1.5,.5,1)}
.dot.done{background:var(--blue);border-color:var(--blue-deep);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.dot.now{background:var(--violet);border-color:var(--violet-deep);color:#fff;
  box-shadow:0 4px 0 var(--violet-deep);animation:breathe 2.4s ease-in-out infinite}
.node-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.node-t{font-size:15px;font-weight:800;line-height:1.25}
.node.locked .node-t{color:var(--dim)}
.node-s{font-size:12px;font-weight:700;color:var(--muted)}

/* ===== переключатель целей ===== */
.goal-selector{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);
  border:2px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin-bottom:18px}
.goal-sel-btn{background:var(--surface);border:2px solid var(--line);color:var(--text);border-radius:8px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900}
.goal-sel-btn:active{transform:scale(.92)}
.goal-sel-info{text-align:center;min-width:0;padding:0 8px}
.goal-sel-title{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-sel-sub{font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}

/* ===== цепочка дней ===== */
.chain{position:relative;width:100%;margin:4px 0 8px}
.day{position:absolute;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid var(--line);background:var(--surface-2);color:var(--dim);
  font-weight:900;font-size:15px;line-height:1;animation:rise .5s both;z-index:2;cursor:pointer}
.day small{font-size:9px;font-weight:800;opacity:.75;margin-top:2px}
.day.done{background:var(--blue);border-color:var(--blue-deep);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.day.freeze{background:var(--ice);border-color:#4A9BD8;color:#0B2340;box-shadow:0 4px 0 #4A9BD8}
.day.miss{background:#1C1738;border-color:#241E49;color:#453F72}
.day.future{opacity:.4}
.day.now{background:var(--violet);border-color:var(--violet-deep);color:#fff;
  box-shadow:0 4px 0 var(--violet-deep);animation:rise .5s both,breathe 2.4s .6s ease-in-out infinite}
.link{position:absolute;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;
  background:var(--line);z-index:1;animation:fade .6s both}
.link.on{background:var(--blue-deep)}
.bolt{position:absolute;transform:translateX(-50%);z-index:5;pointer-events:none;
  animation:hop 1.6s cubic-bezier(.4,0,.5,1) infinite}
.bolt svg{filter:drop-shadow(0 3px 6px rgba(255,178,63,.55));display:block}
.bolt-tail{position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--amber)}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:0 4px 0 var(--line-soft);animation:drop .45s both}
.field{width:100%;background:var(--ink);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:13px 15px;color:#fff;font-size:15px;font-weight:700;outline:none;transition:border-color .2s;resize:none}
.field::placeholder{color:var(--dim);font-weight:700}
.field:focus{border-color:var(--violet)}
.label{font-size:12px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px 3px}
.gap{height:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:68px;background:var(--ink);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:12px 6px;color:var(--muted);font-weight:900;font-size:14px;cursor:pointer;transition:all .15s;text-align:center}
.chip.on{background:var(--violet);border-color:var(--violet-deep);color:#fff;box-shadow:0 3px 0 var(--violet-deep)}
.chip:active{transform:translateY(2px)}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:2px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row-t{font-size:15px;font-weight:800}
.row-s{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px}
.badge{font-size:11px;font-weight:900;padding:5px 10px;border-radius:20px;letter-spacing:.6px;
  text-transform:uppercase;flex:none}
.badge.ok{background:rgba(124,224,208,.15);color:var(--mint)}
.badge.main{background:rgba(255,178,63,.18);color:var(--amber);border:1px solid rgba(255,178,63,.4)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);
  padding:15px;box-shadow:0 4px 0 var(--line-soft);animation:drop .45s both}
.tile-n{font-size:28px;font-weight:900;line-height:1;margin-bottom:5px}
.tile-l{font-size:12px;font-weight:800;color:var(--muted)}

.empty{text-align:center;padding:34px 20px;animation:fade .5s both}
.empty svg{opacity:.35;margin-bottom:14px}
.empty-t{font-size:17px;font-weight:900;margin-bottom:7px}
.empty-s{font-size:14px;font-weight:700;color:var(--muted);line-height:1.5;margin-bottom:18px}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:700;
  color:var(--muted);justify-content:center}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:block}

/* ===== Профиль пользователя ===== */
.avatar-wrap{position:relative;width:84px;height:84px;margin:0 auto 12px}
.avatar-img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--violet);background:var(--surface-2);display:block}
.avatar-btn{position:absolute;right:-2px;bottom:-2px;background:var(--violet);color:#fff;border-radius:50%;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.auth-providers{display:flex;gap:8px;margin-top:8px}
.auth-btn{flex:1;background:var(--ink);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:10px 4px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;text-align:center;transition:all .2s}
.auth-btn.on{border-color:var(--mint);color:#fff;background:rgba(124,224,208,.12)}

/* ===== Соревнования ===== */
.comp-card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);
  padding:15px;margin-bottom:14px;box-shadow:0 4px 0 var(--line-soft)}
.comp-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.comp-avatar{width:46px;height:46px;border-radius:50%;background:var(--violet);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:none;overflow:hidden}
.comp-avatar img{width:100%;height:100%;object-fit:cover}
.comp-info{min-width:0;flex:1}
.comp-name{font-size:16px;font-weight:800;line-height:1.2}
.comp-tg{font-size:12.5px;font-weight:700;color:var(--blue)}
.comp-stats-badge{font-size:11px;font-weight:900;background:rgba(124,92,252,.15);color:var(--violet);
  padding:4px 9px;border-radius:12px;display:inline-block;margin-top:3px}
.versus{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--ink);border-radius:var(--r-sm);padding:12px;margin:10px 0}
.v-user{text-align:center;flex:1;min-width:0}
.v-val{font-size:20px;font-weight:900;color:var(--amber)}
.v-lbl{font-size:11px;font-weight:800;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(23,19,46,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:2px solid var(--line);
  display:flex;padding:9px 0 calc(9px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);
  font-size:10.5px;font-weight:900;cursor:pointer;padding:3px 0;transition:color .2s}
.tab.on{color:var(--violet)}
.tab.on .ic-lg{transform:translateY(-2px) scale(1.08)}
.tab .ic-lg{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}

.toast{position:fixed;left:50%;top:calc(18px + var(--safe-top));transform:translate(-50%,-160%);
  background:var(--violet);color:#fff;padding:12px 20px;border-radius:14px;font-weight:900;font-size:14px;
  z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.45);transition:transform .4s cubic-bezier(.2,1.4,.4,1);
  max-width:88%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.spark{position:fixed;width:9px;height:9px;border-radius:2px;z-index:150;pointer-events:none}

.backdrop{position:fixed;inset:0;background:rgba(6,4,16,.72);z-index:150;
  opacity:0;transition:opacity .28s;backdrop-filter:blur(3px)}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:160;
  background:var(--surface);border-top:2px solid var(--line);
  border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.9,.3,1.05);
  max-height:82vh;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet-num{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.sheet-badge{width:56px;height:56px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:19px;font-weight:900;border:3px solid var(--line);
  background:var(--surface-2);color:var(--dim)}
.sheet-badge.done{background:var(--blue);border-color:var(--blue-deep);color:#fff}
.sheet-t{font-size:20px;font-weight:900;line-height:1.15}
.sheet-s{font-size:13px;font-weight:700;color:var(--muted);margin-top:3px}
.sheet-task{background:var(--ink);border:2px solid var(--line);border-radius:var(--r-md);
  padding:15px;margin-bottom:16px}
.sheet-task-l{font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px}
.sheet-task-t{font-size:17px;font-weight:800;line-height:1.3}
.sheet-task-s{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}

@keyframes drop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(16px) scale(.8)}
  to{opacity:1;transform:translateX(-50%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{box-shadow:0 4px 0 var(--violet-deep),0 0 0 0 rgba(124,92,252,.5)}
  50%{box-shadow:0 4px 0 var(--violet-deep),0 0 0 11px rgba(124,92,252,0)}}
@keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}
  30%{transform:translateX(-50%) translateY(-13px)}
  55%{transform:translateX(-50%) translateY(0)}
  70%{transform:translateX(-50%) translateY(-5px)}
  85%{transform:translateX(-50%) translateY(0)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
'use strict';

const API_URL = '';
const GROUP_URL = 'https://t.me/+5hxQMsAbPnZjMTky';

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg){
  tg.ready(); tg.expand();
  try{ tg.setHeaderColor('#0B0918'); tg.setBackgroundColor('#0B0918'); }catch(e){}
  applySafeArea();
  try{ tg.onEvent('safeAreaChanged',applySafeArea); tg.onEvent('contentSafeAreaChanged',applySafeArea); }catch(e){}
}

function applySafeArea(){
  let top=0;
  try{
    if(tg.contentSafeAreaInset&&tg.contentSafeAreaInset.top) top+=tg.contentSafeAreaInset.top;
    if(tg.safeAreaInset&&tg.safeAreaInset.top) top+=tg.safeAreaInset.top;
  }catch(e){}
  document.documentElement.style.setProperty('--safe-top',top+'px');
}

function haptic(type){
  if(!tg||!tg.HapticFeedback) return;
  try{
    if(type==='ok') tg.HapticFeedback.notificationOccurred('success');
    else if(type==='warn') tg.HapticFeedback.notificationOccurred('warning');
    else tg.HapticFeedback.impactOccurred('light');
  }catch(e){}
}

/* ============================ Языки ============================ */
const T={
ru:{today:'Сегодня',goals:'Цели',chains:'Цепочки',comp:'Соревнования',more:'Ещё',
 mainGoal:'Главная цель',planToday:'План на сегодня',myGoals:'Мои цели',
 newGoal:'Новая цель',createGoal:'Создать цель',cancel:'Отмена',done:'Готово',
 dayOf:'День {a} из {b}',left:'Осталось {n} {w}',overdue:'Срок вышел {n} {w} назад',
 behind:'Отставание {n} {w} от плана',reached:'Цель достигнута',
 allSteps:'Все шаги пройдены',allStepsSub:'Допиши план или поставь новую цель.',
 dayClosed:'День закрыт по этой цели',dayClosedSub:'Отлично! Работаем над другими целями.',
 noGoals:'Ни одной цели',
 noGoalsSub:'Большая цель, разбитая на дни, перестаёт быть страшной. Заведи первую!',
 emptyGoals:'Пока пусто',emptyGoalsSub:'Цель без плана — это желание. Раздели её на шаги.',
 what:'Что хочешь получить',howLong:'За сколько дней',ownNumber:'или своё число',
 stepsLabel:'Шаги — по одному в строке',
 stepsHint:'Дни распределятся по шагам поровну. Порядок важен.',
 titlePh:'Например: Выучить 500 новых слов',
 stepsPh:'Учить по 20 слов в день\nПовторять пройденное по выходным\nПройти финальное тестирование',
 deleteGoal:'Удалить цель',deleteAsk:'Удалить цель вместе с планом?',
 goalDeleted:'Цель удалена',goalCreated:'Цель создана',

function t(k,vars){
  const lang=(S&&S.lang)?S.lang:'ru';
  let s=(T[lang]||T.ru)[k]||T.ru[k]||k;
  if(vars) for(const key in vars) s=s.replace('{'+key+'}',vars[key]);
  return s;
}

/* ============================ Хранилище ============================ */
const KEY='pathstate_v3';
let memory=null;

function loadState(){
  return new Promise(resolve=>{
    if(tg&&tg.CloudStorage&&tg.CloudStorage.getItem){
      let settled=false;
      const done=v=>{ if(!settled){ settled=true; resolve(v); } };
      setTimeout(()=>done(null),2000);
      tg.CloudStorage.getItem(KEY,(err,val)=>{
        if(err||!val) return done(null);
        try{ done(JSON.parse(val)); }catch(e){ done(null); }
      });
    } else resolve(memory);
  });
}

function saveState(){
  const raw=JSON.stringify(S);
  memory=JSON.parse(raw);
  if(tg&&tg.CloudStorage&&tg.CloudStorage.setItem){
    try{ tg.CloudStorage.setItem(KEY,raw,()=>{}); }catch(e){}
  }
}

/* ============================ Даты ============================ */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>key(new Date());
function shift(n){ const d=new Date(); d.setDate(d.getDate()+n); return key(d); }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return key(d); }

function plural(n,one,few,many){
  const a=n%10,b=n%100;
  if(b>=11&&b<=14) return many;
  if(a===1) return one;
  if(a>=2&&a<=4) return few;
  return many;
}
const dayWord=n=>(S&&S.lang==='en')?(n===1?'day':'days'):plural(n,'день','дня','дней');

let S=null, screen='today', draft=null, openGoal=null, chainGoalId=null, searchUserResult=null;

function tgLang(){
  try{
    const c=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code;
    return c==='ru'?'ru':(c?'en':'ru');
  }catch(e){ return 'ru'; }
}

function blank(){
  const u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
  return{
    name:u.first_name||'Путешественник',
    tgUsername:u.username?('@'+u.username):'',

    lang:tgLang(),streak:0,best:0,freezes:1,freezeWeek:weekTag(),
    lastDone:null,days:{},goals:[],competitions:[],seq:1,start:today()
  };
}
function weekTag(){ const d=new Date(); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return key(d); }
function liveStreak(){
  if(!S.lastDone) return 0;
  return (S.lastDone===today()||S.lastDone===shift(-1))?S.streak:0;
}
function refillFreezes(){ if(S.freezeWeek!==weekTag()){ S.freezeWeek=weekTag(); S.freezes=1; } }

/* ============================ Цели ============================ */
function spread(count,total){
  if(count<=0) return [];
  if(count>=total) return Array(count).fill(1);
  const base=Math.floor(total/count);
  const out=Array(count).fill(base);
  let rest=total-base*count;
  for(let i=count-1;rest>0;i--,rest--) out[i%count]+=1;
  return out;
}

function getMainGoal(){
  if(!S.goals.length) return null;
  return S.goals.find(g=>g.isMain) || S.goals[0];
}

function addGoal(title,targetDays,texts){
  const lens=spread(texts.length,targetDays);
  const isFirst=S.goals.length===0;
  const g={
    id:S.seq++,title,targetDays,created:today(),isMain:isFirst,
    doneDays:{},
    steps:texts.map((x,i)=>({id:S.seq++,text:x,days:lens[i],progress:0,done:false}))
  };
  S.goals.push(g); saveState(); return g;
}

function setMainGoal(goalId){
  S.goals.forEach(g=>{ g.isMain=(g.id===goalId); });
  saveState();
}

const nextStep=g=>g.steps.find(s=>!s.done)||null;

function goalStat(g){
  const total=g.steps.reduce((a,s)=>a+s.days,0)||1;
  const done=g.steps.reduce((a,s)=>a+(s.done?s.days:s.progress),0);
  const left=diffDays(today(),addDays(g.created,g.targetDays));
  const elapsed=diffDays(g.created,today());
  return{
    total,done,left,behind:Math.max(0,elapsed-done),
    pct:Math.min(100,Math.round(done/total*100)),
    finished:g.steps.length>0&&g.steps.every(s=>s.done),
    stepsLeft:g.steps.filter(s=>!s.done).length
  };
}

function isGoalDoneToday(g){
  return!!(g.doneDays && g.doneDays[today()]);
}

function completeStep(goalId,stepId){
  const g=S.goals.find(x=>x.id===goalId); if(!g) return null;
  const s=g.steps.find(x=>x.id===stepId); if(!s||s.done) return null;

  s.progress+=1;
  const closed=s.progress>=s.days;
  if(closed) s.done=true;

  if(!g.doneDays) g.doneDays={};
  g.doneDays[today()]=true;

  let grew=false;
  if(S.lastDone!==today()){
    S.streak=(S.lastDone===shift(-1))?S.streak+1:1;
    S.best=Math.max(S.best,S.streak);
    S.lastDone=today(); S.days[today()]='done'; grew=true;
  }
  saveState();
  return{closed,grew,streak:S.streak,goalDone:goalStat(g).finished};
}

/* ============================ Утилиты ============================ */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

function sparks(x,y){
  const colors=['#4C8DFF','#7C5CFC','#FFB23F','#7CE0D0','#FFFFFF'];
  for(let i=0;i<14;i++){
    const p=document.createElement('i');
    p.className='spark'; p.style.left=x+'px'; p.style.top=y+'px';
    p.style.background=colors[i%colors.length];
    p.style.setProperty('--dx',(Math.random()*160-80).toFixed(0)+'px');
    p.style.setProperty('--dy',(-Math.random()*130-30).toFixed(0)+'px');
    p.style.setProperty('--rot',(Math.random()*540-270).toFixed(0)+'deg');
    p.style.animation='fly '+(0.5+Math.random()*0.4).toFixed(2)+'s cubic-bezier(.15,.7,.4,1) forwards';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }
}

  const gs=goalStat(mainG), R=26, C=2*Math.PI*R, off=C*(1-gs.pct/100);
  h+='<div class="hero">'+
    '<div class="hero-eyebrow">👑 '+t('mainGoal')+'</div>'+
    '<div class="hero-title">'+esc(mainG.title)+'</div>'+
    '<div class="hero-row"><div class="ring-wrap">'+
    '<svg class="ring" viewBox="0 0 64 64">'+
    '<circle class="ring-bg" cx="32" cy="32" r="'+R+'"/>'+
    '<circle class="ring-fg" cx="32" cy="32" r="'+R+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-off="'+off.toFixed(1)+'"/>'+
    '</svg><div class="ring-num">'+gs.pct+'%</div></div>'+
    '<div class="hero-meta"><div class="hero-day">'+t('dayOf',{a:gs.done,b:gs.total})+'</div>'+
    '<div class="hero-note'+(gs.behind>=3?' hero-warn':'')+'">'+
    (gs.finished?t('reached')
     :gs.left<0?t('overdue',{n:-gs.left,w:dayWord(-gs.left)})
     :gs.behind>=3?t('behind',{n:gs.behind,w:dayWord(gs.behind)})
     :t('left',{n:gs.left,w:dayWord(gs.left)}))+
    '</div></div></div></div>';

  const tasks=S.goals.map(g=>({g,s:nextStep(g)})).filter(x=>x.s);
  h+='<div class="sec"><div class="sec-t">'+t('planToday')+'</div><div class="sec-c">'+tasks.length+'</div></div>';

  if(!tasks.length){
    return h+'<div class="panel" style="text-align:center">'+
      '<div class="card-t" style="margin-bottom:6px">'+t('allSteps')+'</div>'+
      '<div class="card-s" style="margin-bottom:14px">'+t('allStepsSub')+'</div>'+
      '<button class="btn btn-main" data-act="go-new">'+t('newGoal')+'</button></div>';
  }

  h+='<div class="stack">';
  tasks.forEach(function(x,i){
    const g=x.g,s=x.s, gDone = isGoalDoneToday(g), pct=Math.round(s.progress/s.days*100);

      '<div class="card-body">'+
      '<div class="card-t">'+esc(s.text)+'</div>'+
      '<div class="card-s">'+(g.isMain?'⭐ ':'')+esc(g.title)+(s.days>1?' · '+t('dayNum',{n:Math.min(s.progress+(gDone?0:1),s.days),m:s.days}):'')+'</div>'+
      (s.days>1?'<div class="mini"><i style="width:'+pct+'%"></i></div>':'')+
      '</div>'+
      (gDone?'<button class="btn btn-go btn-sm" disabled>'+t('done')+'</button>'
            :'<button class="btn btn-go btn-sm" data-act="done" data-g="'+g.id+'" data-s="'+s.id+'">'+t('done')+'</button>')+
      '</div>';
  });
  h+='</div>';
  return h;

  let h=topbar();

  if(!S.goals.length) return h+emptyBlock(t('emptyGoals'),t('emptyGoalsSub'),t('createGoal'),'go-new');

  /* Сортировка: Главная цель всегда наверху */
  const sortedGoals = [...S.goals].sort((a,b)=>(b.isMain?1:0)-(a.isMain?1:0));

  sortedGoals.forEach(function(g){
    const gs=goalStat(g), isOpen=openGoal===g.id;
    h+='<div class="panel" style="margin-bottom:12px;border-color:'+(g.isMain?'var(--amber)':'var(--line)')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer" data-act="toggle" data-g="'+g.id+'">'+
      '<div style="min-width:0">'+

      (g.isMain?'<span class="badge main">'+t('isMainBadge')+'</span>':'')+
      '<div class="card-t">'+esc(g.title)+'</div></div>'+
      '<div class="card-s">'+(gs.finished?t('reached'):gs.done+' / '+gs.total+' '+dayWord(gs.total)+' · осталось '+gs.stepsLeft+' шагов')+'</div>'+
      '</div>'+
      '<div style="font-size:19px;font-weight:900;color:var(--violet);flex:none">'+gs.pct+'%</div></div>'+

        '</div>':'')+
      '</div>';
  });

  /* Кнопка "Сделать новую цель" внизу списка */
  return h+'<div class="gap"></div><button class="btn btn-main" data-act="go-new">+ '+t('newGoal')+'</button>';
}

function renderPath(g){
  let h='<div class="path" style="margin-top:16px">',marked=false;
  g.steps.forEach(function(s,i){
    const indent=[0,12,24,12][i%4];
    let cls,inner,sub;
    if(s.done){
      cls='done';
      inner='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';
      sub=s.days+' '+dayWord(s.days)+' · '+t('passed');
    } else if(!marked){
      marked=true; cls='now'; inner=String(i+1);
      sub=s.days>1?t('dayNum',{n:s.progress+1,m:s.days}):t('now');
    } else { cls=''; inner=String(i+1); sub=s.days+' '+dayWord(s.days); }
    h+='<div class="node'+(cls===''?' locked':'')+'" style="margin-left:'+indent+'px;animation-delay:'+(i*40)+'ms">'+
      '<div class="dot '+cls+'">'+inner+'</div>'+
      '<div class="node-txt"><div class="node-t">'+esc(s.text)+'</div><div class="node-s">'+sub+'</div></div></div>';
  });
  return h+'</div>';
}

function renderGoalChain(g){
  const totalDays = Math.max(1, g.targetDays);
  const days = [];
  for(let i=0; i<totalDays; i++) {
    days.push(addDays(g.created, i));
  }

  const STEP=70, TOP=42, AMP=26;
  const xs=i=>50+AMP*Math.sin(i*0.75);
  const height=TOP+days.length*STEP;
  let h='<div class="chain" style="height:'+height+'px">';

  for(let i=0; i<days.length-1; i++){
    const x1=xs(i),y1=TOP+i*STEP,x2=xs(i+1),y2=TOP+(i+1)*STEP;
    const gDone1 = g.doneDays && g.doneDays[days[i]];
    const gDone2 = g.doneDays && g.doneDays[days[i+1]];
    const on = gDone1 && gDone2;
    for(let k=1;k<=2;k++){
      const f=k/3;
      h+='<i class="link'+(on?' on':'')+'" style="left:'+(x1+(x2-x1)*f).toFixed(2)+'%;top:'+(y1+(y2-y1)*f).toFixed(1)+'px"></i>';
    }
  }

  days.forEach(function(d,i){
    const y=TOP+i*STEP, x=xs(i);
    const isDone = g.doneDays && g.doneDays[d];
    const isToday = d===today();
    const isFuture = d > today();

    const cls = isDone ? 'done' : isToday ? 'now' : isFuture ? 'future' : 'miss';
    const dayNum = i+1;

    const inner = isDone
      ? '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>'
      : String(dayNum);

    h+='<div class="day '+cls+'" data-act="day" data-d="'+d+'" data-g="'+g.id+'" style="left:'+x.toFixed(2)+'%;top:'+y+'px">'+
       inner+'<small>день '+dayNum+'</small></div>';

    if(isToday){
      h+='<div class="bolt" style="left:'+x.toFixed(2)+'%;top:'+(y-46)+'px">'+
         '<svg width="28" height="28" viewBox="0 0 24 24" fill="#FFB23F" stroke="#C77A12" stroke-width="1.5"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>'+
         '<i class="bolt-tail"></i></div>';
    }
  });
  return h+'</div>';
}

/* ============================ Экран: Соревнования ============================ */
function viewCompetitions(){
  let h=topbar();
  h+='<div class="sec"><div class="sec-t">'+t('compTitle')+'</div></div>';

  /* Форма поиска по Telegram @username */
  h+='<div class="panel" style="margin-bottom:16px">'+
    '<div class="label">'+t('compSearchPh')+'</div>'+
    '<div style="display:flex;gap:8px">'+
    '<input class="field" id="c-search" placeholder="@username" value="'+(searchUserResult?searchUserResult.username:'')+'">'+
    '<button class="btn btn-go" style="padding:0 14px" data-act="search-user">🔍</button>'+
    '</div></div>';

  /* Результат поиска пользователя */
  if(searchUserResult){
    h+='<div class="comp-card" style="border-color:var(--violet)">'+
      '<div class="comp-header">'+
      '<div class="comp-avatar">'+(searchUserResult.avatar?'<img src="'+searchUserResult.avatar+'">':searchUserResult.name[0])+'</div>'+
      '<div class="comp-info">'+
      '<div class="comp-name">'+esc(searchUserResult.name)+'</div>'+
      '<div class="comp-tg">'+esc(searchUserResult.username)+'</div>'+
      '<div class="comp-stats-badge">🏆 '+t('completedGoalsCount')+': '+searchUserResult.completedGoals+'</div>'+
      '</div></div>'+
      '<button class="btn btn-main" data-act="invite-user">'+t('inviteBtn')+'</button>'+
      '</div>';
  }

  /* Список активных дуэлей и приглашений */
  const comps = S.competitions || [];
  if(!comps.length){
    return h+'<div class="empty">'+
      '<svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#FFB23F" stroke-width="1.8"><path d="M6 9V2h12v7a6 6 0 0 1-12 0z"/><path d="M6 5H3a2 2 0 0 0-2 2v1a3 3 0 0 0 3 3h2M18 5h3a2 2 0 0 1 2 2v1a3 3 0 0 1-3 3h-2M12 15v4M8 23h8"/></svg>'+
      '<div class="empty-s">'+t('compEmpty')+'</div></div>';
  }

  comps.forEach(c=>{
    const myG = getMainGoal();
    const myPct = myG ? goalStat(myG).pct : 0;
    const isLeading = myPct >= c.opponentProgress;

    h+='<div class="comp-card">'+
      '<div class="comp-header">'+
      '<div class="comp-avatar">'+(c.opponentAvatar?'<img src="'+c.opponentAvatar+'">':c.opponentName[0])+'</div>'+
      '<div class="comp-info">'+
      '<div class="comp-name">'+esc(c.opponentName)+' ('+esc(c.opponentUsername)+')</div>'+
      '<div class="comp-stats-badge">Выполнено целей: '+(c.opponentCompletedGoals||0)+'</div>'+
      '</div>'+
      '</div>'+
      '<div class="versus">'+
      '<div class="v-user"><div class="v-val" style="color:var(--mint)">'+myPct+'%</div><div class="v-lbl">Ты</div></div>'+
      '<div style="font-weight:900;color:var(--dim)">VS</div>'+
      '<div class="v-user"><div class="v-val">'+c.opponentProgress+'%</div><div class="v-lbl">'+esc(c.opponentName)+'</div></div>'+
      '</div>'+
      '<div style="text-align:center;font-size:12px;font-weight:900;color:'+(isLeading?'var(--mint)':'var(--amber)')+'">'+
      (isLeading?'🔥 '+t('leaderMsg'):'⚡ '+t('behindMsg'))+
      '</div>'+
      '</div>';
  });

  return h;
}

/* ============================ Экран: Ещё / Профиль ============================ */
function viewProfile(){
  const completedCount = S.goals.filter(g=>goalStat(g).finished).length;

  return '<div class="sec"><div class="sec-t">'+t('profile')+'</div></div>'+
    '<div class="panel" style="margin-bottom:14px;text-align:center">'+
    '<div class="avatar-wrap">'+
    '<img class="avatar-img" id="avatar-img" src="'+(S.avatar||'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%237C5CFC\'><circle cx=\'12\' cy=\'8\' r=\'4\'/><path d=\'M12 14c-6.1 0-8 4-8 4v2h16v-2s-1.9-4-8-4z\'/></svg>')+'">'+
    '<label class="avatar-btn" for="avatar-file">📷</label>'+
    '<input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="uploadAvatar(event)">'+
    '</div>'+
    '<div class="card-s" style="margin-bottom:12px">'+t('photoNotice')+'</div>'+

    '<div class="label" style="text-align:left">'+t('nameLabel')+'</div>'+
    '<input class="field" id="p-name" value="'+esc(S.name)+'" style="margin-bottom:12px">'+

    '<div class="label" style="text-align:left">'+t('tgUserLabel')+'</div>'+
    '<input class="field" id="p-tg" placeholder="@username" value="'+esc(S.tgUsername||'')+'" style="margin-bottom:14px">'+

    '<div class="label" style="text-align:left">'+t('authProvider')+'</div>'+
    '<div class="auth-providers">'+
    '<div class="auth-btn '+(S.authMethod==='telegram'?'on':'')+'" data-act="auth" data-m="telegram">Telegram</div>'+
    '<div class="auth-btn '+(S.authMethod==='google'?'on':'')+'" data-act="auth" data-m="google">Google</div>'+
    '<div class="auth-btn '+(S.authMethod==='yandex'?'on':'')+'" data-act="auth" data-m="yandex">Яндекс</div>'+
    '</div>'+
    '</div>'+

    '<div class="panel" style="margin-bottom:14px">'+
    '<div class="row" style="padding:0"><div style="min-width:0">'+
    '<div class="row-t">'+t('completedGoalsCount')+'</div>'+
    '<div class="row-s">Общее число успешно закрытых целей</div></div>'+
    '<div style="font-size:22px;font-weight:900;color:var(--mint)">'+completedCount+'</div></div>'+
    '</div>'+

    '<div class="panel" style="margin-bottom:14px">'+
    '<div class="row" style="padding-top:0"><div style="min-width:0">'+
    '<div class="row-t">'+t('community')+'</div>'+
    '<div class="row-s">Обсуждения, поддержка и вопросы</div></div></div>'+
    '<button class="btn btn-main" data-act="group">'+t('openGroup')+'</button></div>'+

    '<div class="panel"><button class="btn btn-ghost" data-act="save-profile" style="margin-bottom:8px">'+t('done')+'</button>'+
    '<button class="btn btn-ghost" style="color:var(--rose);border-color:rgba(255,92,138,.3)" data-act="reset">'+t('reset')+'</button></div>';
}

function uploadAvatar(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    S.avatar = evt.target.result;
    saveState();
    const img = document.getElementById('avatar-img');
    if(img) img.src = S.avatar;
    toast('Аватарка обновлена');
  };
  reader.readAsDataURL(file);
}

/* ============================ Карточка дня ============================ */
function openDay(dateStr, goalId){
  const g = S.goals.find(x=>x.id===goalId) || getMainGoal();
  if(!g) return;

  const isDone = g.doneDays && g.doneDays[dateStr];
  const isToday = dateStr===today();

  const back=document.createElement('div'); back.className='backdrop'; back.id='backdrop';
  const sheet=document.createElement('div'); sheet.className='sheet'; sheet.id='sheet';

  sheet.innerHTML='<div class="sheet-grip"></div>'+
    '<div class="sheet-num"><div class="sheet-badge '+(isDone?'done':'')+'">📅</div>'+
    '<div><div class="sheet-t">'+esc(g.title)+'</div>'+
    '<div class="sheet-s">'+dateStr+'</div></div></div>'+
    '<div class="sheet-task"><div class="sheet-task-t">'+(isDone?'Выполнено в этот день!':'День выполнения цели')+'</div></div>'+
    '<button class="btn btn-ghost" data-act="sheet-close">'+t('close')+'</button>';

  document.body.appendChild(back); document.body.appendChild(sheet);
  requestAnimationFrame(()=>{ back.classList.add('show'); sheet.classList.add('show'); });
  back.addEventListener('click',closeSheet);
  sheet.addEventListener('click',e=>{ if(e.target.closest('[data-act="sheet-close"]')) closeSheet(); });
}

function closeSheet(){
  const back=document.getElementById('backdrop'),sheet=document.getElementById('sheet');
  if(back) back.classList.remove('show');
  if(sheet) sheet.classList.remove('show');
  setTimeout(()=>{ if(back) back.remove(); if(sheet) sheet.remove(); },300);
}

/* ============================ Навигация и Отрисовка ============================ */
const NAV_ICONS={
  today:'<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
  goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
  chains:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  comp:'<path d="M6 9V2h12v7a6 6 0 0 1-12 0z"/><path d="M18 5h3a2 2 0 0 1 2 2v1a3 3 0 0 1-3 3h-2M6 5H3a2 2 0 0 0-2 2v1a3 3 0 0 0 3 3h2"/>',
  more:'<circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>'
};

function navHtml(){
  return ['today','goals','chains','comp','more'].map(function(k){
    return '<div class="tab'+(screen===k?' on':'')+'" data-tab="'+k+'">'+
      '<svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+NAV_ICONS[k]+'</svg>'+
      '<span>'+t(k)+'</span></div>';
  }).join('');
}

function render(){
  refillFreezes();
  const app=document.getElementById('app');
  app.innerHTML = screen==='today'?viewToday()
                : screen==='goals'?viewGoals()
                : screen==='chains'?viewChains()
                : screen==='comp'?viewCompetitions()
                : viewProfile();
  document.getElementById('nav').innerHTML=navHtml();
  const ring=app.querySelector('.ring-fg');
  if(ring) requestAnimationFrame(()=>{ ring.style.strokeDashoffset=ring.dataset.off; });
}

/* ============================ Обработчики ============================ */
document.getElementById('nav').addEventListener('click',function(e){
  const tab=e.target.closest('.tab'); if(!tab) return;
  if(screen===tab.dataset.tab) return;
  screen=tab.dataset.tab;
  if(screen!=='goals') draft=null;
  haptic('tap'); render();
});

document.getElementById('app').addEventListener('click',function(e){
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;

  if(act==='day'){
    haptic('tap');
    openDay(el.dataset.d, Number(el.dataset.g));
    return;
  }

  if(act==='go-new'){ draft={title:'',days:30,steps:''}; screen='goals'; haptic('tap'); render(); return; }
  if(act==='cancel'){ draft=null; haptic('tap'); render(); return; }
  if(act==='days'){ syncDraft(); draft.days=Number(el.dataset.n); haptic('tap'); render(); return; }

  if(act==='save-goal'){
    syncDraft();
    const title=draft.title.trim();
    const steps=draft.steps.split('\n').map(s=>s.replace(/^\s*(?:[-–—•*]|\d+[.)])\s*/,'').trim()).filter(Boolean);
    const days=Math.max(1,Math.min(365,Number(draft.days)||30));
    if(!title){ toast(t('needTitle')); haptic('warn'); return; }
    if(!steps.length){ toast(t('needStep')); haptic('warn'); return; }
    addGoal(title,days,steps);
    draft=null; haptic('ok'); toast(t('goalCreated')); screen='today'; render(); return;
  }

  if(act==='toggle'){ const id=Number(el.dataset.g); openGoal=openGoal===id?null:id; haptic('tap'); render(); return; }

  if(act==='set-main'){
    const id=Number(el.dataset.g);
    setMainGoal(id); haptic('ok'); toast(t('madeMain')); render(); return;
  }

  if(act==='drop'){
    const id=Number(el.dataset.g);
    const kill=function(){
      S.goals=S.goals.filter(g=>g.id!==id);
      openGoal=null; saveState(); haptic('ok'); toast(t('goalDeleted')); render();
    };
    if(tg&&tg.showConfirm) tg.showConfirm(t('deleteAsk'),ok=>{ if(ok) kill(); });
    else if(confirm(t('deleteAsk'))) kill();
    return;
  }

  if(act==='done'){
    const r=completeStep(Number(el.dataset.g),Number(el.dataset.s));
    if(!r) return;
    const rect=el.getBoundingClientRect();
    sparks(rect.left+rect.width/2,rect.top+rect.height/2);
    haptic('ok');
    if(r.goalDone) toast(t('reached'));
    else if(r.closed) toast(t('stepDone'));
    else toast(t('marked'));
    setTimeout(render,250);
    return;
  }

  if(act==='prev-chain'||act==='next-chain'){
    if(!S.goals.length) return;
    let idx = S.goals.findIndex(g=>g.id===chainGoalId);
    if(act==='prev-chain') idx = (idx - 1 + S.goals.length) % S.goals.length;
    else idx = (idx + 1) % S.goals.length;
    chainGoalId = S.goals[idx].id;
    haptic('tap'); render(); return;
  }

  if(act==='search-user'){
    const inp = document.getElementById('c-search');
    const val = inp ? inp.value.trim() : '';
    if(!val){ toast('Впишите ник из Telegram'); return; }
    /* Моделирование поиска профиля */
    searchUserResult = {
      name: val.replace('@','') || 'Алексей',
      username: val.startsWith('@')?val:('@'+val),
      completedGoals: Math.floor(Math.random()*6)+1,
      avatar: ''
    };
    haptic('tap'); render(); return;
  }

  if(act==='invite-user'){
    if(!searchUserResult) return;
    if(!S.competitions) S.competitions=[];
    S.competitions.push({
      id: Date.now(),
      opponentName: searchUserResult.name,
      opponentUsername: searchUserResult.username,
      opponentAvatar: searchUserResult.avatar,
      opponentCompletedGoals: searchUserResult.completedGoals,
      opponentProgress: Math.floor(Math.random()*40)+10
    });
    searchUserResult=null;
    saveState(); haptic('ok'); toast(t('invitedMsg')); render(); return;
  }

  if(act==='auth'){
    S.authMethod = el.dataset.m; saveState(); haptic('tap'); render(); return;
  }

  if(act==='save-profile'){
    const n = document.getElementById('p-name');
    const u = document.getElementById('p-tg');
    if(n) S.name = n.value.trim() || S.name;
    if(u) S.tgUsername = u.value.trim();
    saveState(); haptic('ok'); toast('Профиль сохранен'); render(); return;
  }

  if(act==='group'){
    haptic('tap');
    if(tg&&tg.openTelegramLink) tg.openTelegramLink(GROUP_URL);
    else window.open(GROUP_URL,'_blank');
    return;
  }

  if(act==='reset'){
    const kill=function(){ S=blank(); saveState(); haptic('ok'); toast(t('resetOk')); screen='today'; render(); };
    if(tg&&tg.showConfirm) tg.showConfirm(t('resetAsk'),ok=>{ if(ok) kill(); });
    else if(confirm(t('resetAsk'))) kill();
    return;
  }
});

function syncDraft(){
  if(!draft) return;
  const a=document.getElementById('d-title'),b=document.getElementById('d-days'),c=document.getElementById('d-steps');
  if(a) draft.title=a.value;
  if(c) draft.steps=c.value;
  if(b&&b.value.trim()){ const n=parseInt(b.value,10); if(n>=1&&n<=365) draft.days=n; }
}

/* ============================ Инициализация ============================ */
(async function init(){
  const saved=await loadState();
  S = (saved&&saved.goals) ? Object.assign(blank(),saved) : blank();
  if(!S.lang) S.lang=tgLang();
  document.documentElement.lang=S.lang;
  memory=JSON.parse(JSON.stringify(S));
  render();
})();
</script>
