<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Путь — дневник целей</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0918; --surface:#17132E; --surface-2:#211B45;
  --line:#2E2757; --line-soft:#241E49;
  --blue:#4C8DFF; --blue-deep:#2A63C8;
  --violet:#7C5CFC; --violet-deep:#5433C9;
  --amber:#FFB23F; --amber-deep:#C77A12;
  --ice:#7CC4FF; --mint:#7CE0D0;
  --text:#FFFFFF; --muted:#9A93C7; --dim:#6C659B;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --safe-top:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--ink);color:var(--text);
  padding:calc(14px + var(--safe-top)) 14px calc(96px + env(safe-area-inset-bottom));
  min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
.ic{width:20px;height:20px;flex:none;display:block}
.ic-lg{width:25px;height:25px}

.topbar{display:flex;justify-content:space-between;align-items:center;background:var(--surface);
  border:2px solid var(--line);border-radius:var(--r-lg);padding:11px 8px;margin-bottom:18px;
  animation:drop .45s cubic-bezier(.2,.9,.3,1.2) both}
.metric{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:900;flex:1;justify-content:center;position:relative}
.metric+.metric::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:20px;background:var(--line-soft);border-radius:2px}
.m-fire{color:var(--amber)} .m-ice{color:var(--ice)} .m-best{color:var(--violet)}
.metric.pulse{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

.hero{position:relative;overflow:hidden;
  background:linear-gradient(140deg,#5B47E0 0%,#3A5BD9 55%,#2E77D0 100%);
  border-radius:var(--r-lg);padding:20px;margin-bottom:22px;box-shadow:0 6px 0 #26205C;
  animation:drop .5s .06s cubic-bezier(.2,.9,.3,1.2) both}
.hero::after{content:'';position:absolute;right:-60px;top:-70px;width:190px;height:190px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.hero-eyebrow{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;
  color:rgba(255,255,255,.62);margin-bottom:7px;position:relative;display:flex;align-items:center;gap:6px}
.hero-title{font-size:23px;font-weight:900;line-height:1.15;margin-bottom:16px;position:relative}
.hero-row{display:flex;align-items:center;gap:16px;position:relative}
.ring{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(0,0,0,.25);stroke-width:8}
.ring-fg{fill:none;stroke:var(--mint);stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)}
.ring-wrap{position:relative;flex:none}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.hero-meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-day{font-size:15px;font-weight:800}
.hero-note{font-size:13px;font-weight:700;color:rgba(255,255,255,.7)}
.hero-warn{color:#FFD48A}

.sec{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.sec-t{font-size:13px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.sec-c{font-size:13px;font-weight:900;color:var(--dim)}

.stack{display:flex;flex-direction:column;gap:11px;margin-bottom:26px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);
  padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 4px 0 var(--line-soft);animation:drop .45s both}
.card-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.card-t{font-size:16px;font-weight:800;line-height:1.25}
.card-s{font-size:12.5px;font-weight:700;color:var(--muted)}
.card.done{opacity:.45;box-shadow:none;border-color:var(--line-soft);background:#120F28}
.card.done .card-t{text-decoration:line-through;text-decoration-thickness:2px}
.mini{height:5px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:5px;width:120px;max-width:100%}
.mini i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.3,1)}

.btn{border:none;border-radius:var(--r-sm);font-weight:900;font-size:15px;letter-spacing:.4px;
  text-transform:uppercase;padding:12px 18px;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:7px;transition:transform .08s ease,box-shadow .08s ease,opacity .2s;flex:none}
.btn:active{transform:translateY(4px)}
.btn-go{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn-go:active{box-shadow:0 0 0 var(--blue-deep)}
.btn-main{background:var(--violet);color:#fff;box-shadow:0 5px 0 var(--violet-deep);width:100%;padding:15px}
.btn-main:active{box-shadow:0 0 0 var(--violet-deep)}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--line);box-shadow:none;width:100%;padding:13px}
.btn-ghost:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn-sm{padding:9px 14px;font-size:13px}

.path{position:relative;padding:6px 0 10px}
.node{position:relative;display:flex;align-items:center;gap:13px;margin-bottom:16px;animation:drop .5s both}
.dot{width:50px;height:50px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;border:3px solid var(--line);background:var(--surface-2);color:var(--dim);
  z-index:2;transition:all .35s cubic-bezier(.3,1.5,.5,1)}
.dot.done{background:var(--blue);border-color:var(--blue-deep);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.dot.now{background:var(--violet);border-color:var(--violet-deep);color:#fff;
  box-shadow:0 4px 0 var(--violet-deep);animation:breathe 2.4s ease-in-out infinite}
.node-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.node-t{font-size:15px;font-weight:800;line-height:1.25}
.node.locked .node-t{color:var(--dim)}
.node-s{font-size:12px;font-weight:700;color:var(--muted)}
.node.locked .node-s{color:#4E4880}

/* переключатель целей */
.switcher{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.switcher::-webkit-scrollbar{display:none}
.gtab{flex:none;background:var(--surface);border:2px solid var(--line);border-radius:20px;
  padding:9px 15px;font-size:13.5px;font-weight:900;color:var(--muted);cursor:pointer;
  transition:all .18s;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtab.on{background:var(--violet);border-color:var(--violet-deep);color:#fff;box-shadow:0 3px 0 var(--violet-deep)}
.gtab:active{transform:translateY(2px)}

/* цепочка дней */
.chain{position:relative;width:100%;margin:4px 0 8px}
.day{position:absolute;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid var(--line);background:var(--surface-2);color:var(--dim);
  font-weight:900;font-size:15px;line-height:1;animation:rise .5s both;z-index:2;cursor:pointer}
.day small{font-size:9px;font-weight:800;opacity:.75;margin-top:2px}
.day.done{background:var(--blue);border-color:var(--blue-deep);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.day.freeze{background:var(--ice);border-color:#4A9BD8;color:#0B2340;box-shadow:0 4px 0 #4A9BD8}
.day.miss{background:#1C1738;border-color:#241E49;color:#453F72}
.day.future{opacity:.45}
.day.now{background:var(--violet);border-color:var(--violet-deep);color:#fff;
  box-shadow:0 4px 0 var(--violet-deep);animation:rise .5s both,breathe 2.4s .6s ease-in-out infinite}
.link{position:absolute;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;
  background:var(--line);z-index:1;animation:fade .6s both}
.link.on{background:var(--blue-deep)}
.bolt{position:absolute;transform:translateX(-50%);z-index:5;pointer-events:none;
  animation:hop 1.6s cubic-bezier(.4,0,.5,1) infinite}
.bolt svg{filter:drop-shadow(0 3px 6px rgba(255,178,63,.55));display:block}
.bolt-tail{position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--amber)}
.finish{position:absolute;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;
  align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase;color:var(--mint)}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:0 4px 0 var(--line-soft);animation:drop .45s both}
.field{width:100%;background:var(--ink);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:13px 15px;color:#fff;font-size:16px;font-weight:700;outline:none;transition:border-color .2s;resize:none}
.field::placeholder{color:var(--dim);font-weight:700}
.field:focus{border-color:var(--violet)}
.label{font-size:12px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px 3px}
.gap{height:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:68px;background:var(--ink);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:12px 6px;color:var(--muted);font-weight:900;font-size:15px;cursor:pointer;transition:all .15s;text-align:center}
.chip.on{background:var(--violet);border-color:var(--violet-deep);color:#fff;box-shadow:0 3px 0 var(--violet-deep)}
.chip:active{transform:translateY(2px)}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:2px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row-t{font-size:15px;font-weight:800}
.row-s{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px}
.badge{font-size:11px;font-weight:900;padding:5px 10px;border-radius:20px;letter-spacing:.6px;
  text-transform:uppercase;flex:none}
.badge.ok{background:rgba(124,224,208,.15);color:var(--mint)}
.badge.off{background:rgba(154,147,199,.13);color:var(--muted)}
.badge.star{background:rgba(255,178,63,.16);color:var(--amber)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);
  padding:15px;box-shadow:0 4px 0 var(--line-soft);animation:drop .45s both}
.tile-n{font-size:28px;font-weight:900;line-height:1;margin-bottom:5px}
.tile-l{font-size:12px;font-weight:800;color:var(--muted)}

/* профиль */
.ava{width:66px;height:66px;border-radius:50%;flex:none;object-fit:cover;
  border:3px solid var(--violet-deep);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:var(--violet)}
.profile-head{display:flex;align-items:center;gap:14px;margin-bottom:4px}

.empty{text-align:center;padding:34px 20px;animation:fade .5s both}
.empty svg{opacity:.35;margin-bottom:14px}
.empty-t{font-size:17px;font-weight:900;margin-bottom:7px}
.empty-s{font-size:14px;font-weight:700;color:var(--muted);line-height:1.5;margin-bottom:18px}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:700;
  color:var(--muted);justify-content:center}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:block}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(23,19,46,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:2px solid var(--line);
  display:flex;padding:9px 0 calc(9px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);
  font-size:10.5px;font-weight:900;cursor:pointer;padding:3px 0;transition:color .2s}
.tab.on{color:var(--violet)}
.tab.on .ic-lg{transform:translateY(-2px) scale(1.08)}
.tab .ic-lg{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}

.toast{position:fixed;left:50%;top:calc(18px + var(--safe-top));transform:translate(-50%,-160%);
  background:var(--violet);color:#fff;padding:12px 20px;border-radius:14px;font-weight:900;font-size:14px;
  z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.45);transition:transform .4s cubic-bezier(.2,1.4,.4,1);
  max-width:88%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.spark{position:fixed;width:9px;height:9px;border-radius:2px;z-index:150;pointer-events:none}

.backdrop{position:fixed;inset:0;background:rgba(6,4,16,.72);z-index:150;
  opacity:0;transition:opacity .28s;backdrop-filter:blur(3px)}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:160;background:var(--surface);
  border-top:2px solid var(--line);border-radius:26px 26px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.9,.3,1.05);
  max-height:82vh;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet-num{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.sheet-badge{width:56px;height:56px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:19px;font-weight:900;border:3px solid var(--line);
  background:var(--surface-2);color:var(--dim)}
.sheet-badge.done{background:var(--blue);border-color:var(--blue-deep);color:#fff}
.sheet-badge.freeze{background:var(--ice);border-color:#4A9BD8;color:#0B2340}
.sheet-badge.now{background:var(--violet);border-color:var(--violet-deep);color:#fff}
.sheet-badge.miss{background:#1C1738;border-color:#241E49;color:#453F72}
.sheet-t{font-size:20px;font-weight:900;line-height:1.15}
.sheet-s{font-size:13px;font-weight:700;color:var(--muted);margin-top:3px}
.sheet-task{background:var(--ink);border:2px solid var(--line);border-radius:var(--r-md);padding:15px;margin-bottom:16px}
.sheet-task-l{font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.sheet-task-t{font-size:17px;font-weight:800;line-height:1.3}
.sheet-task-s{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}

@keyframes drop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(16px) scale(.8)}
  to{opacity:1;transform:translateX(-50%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{box-shadow:0 4px 0 var(--violet-deep),0 0 0 0 rgba(124,92,252,.5)}
  50%{box-shadow:0 4px 0 var(--violet-deep),0 0 0 11px rgba(124,92,252,0)}}
@keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}
  30%{transform:translateX(-50%) translateY(-13px)}
  55%{transform:translateX(-50%) translateY(0)}
  70%{transform:translateX(-50%) translateY(-5px)}
  85%{transform:translateX(-50%) translateY(0)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ================== НАСТРОЙКИ ==================
   API_URL — адрес сервера. Без него работают личные цели,
   но соревнования и поиск людей недоступны: им нужна общая база.
   ================================================ */
const API_URL = 'https://strategies-spot-responded-ram.trycloudflare.com';
const GROUP_URL = 'https://t.me/+5hxQMsAbPnZjMTky';

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg){
  tg.ready(); tg.expand();
  try{ tg.setHeaderColor('#0B0918'); tg.setBackgroundColor('#0B0918'); }catch(e){}
  applySafeArea();
  try{ tg.onEvent('safeAreaChanged',applySafeArea); tg.onEvent('contentSafeAreaChanged',applySafeArea); }catch(e){}
}
function applySafeArea(){
  let top=0;
  try{
    if(tg.contentSafeAreaInset&&tg.contentSafeAreaInset.top) top+=tg.contentSafeAreaInset.top;
    if(tg.safeAreaInset&&tg.safeAreaInset.top) top+=tg.safeAreaInset.top;
  }catch(e){}
  document.documentElement.style.setProperty('--safe-top',top+'px');
}
function haptic(k){
  if(!tg||!tg.HapticFeedback) return;
  try{
    if(k==='ok') tg.HapticFeedback.notificationOccurred('success');
    else if(k==='warn') tg.HapticFeedback.notificationOccurred('warning');
    else tg.HapticFeedback.impactOccurred('light');
  }catch(e){}
}

/* ================== ЯЗЫКИ ================== */
const T={

 stepDone:'Шаг пройден полностью',marked:'Отмечено',inRow:'{n} {w} подряд',
 frozeSaved:'Заморозка спасла серию: {n}',dontLose:'Серия {n} {w} — не потеряй её',
 streakDays:'Дней подряд',bestStreak:'Лучшая серия',totalMarked:'Всего отмечено',goalsClosed:'Целей закрыто',

 settings:'Настройки',language:'Язык',languageSub:'Язык интерфейса',

 syncSubOn:'Цели и серия берутся из бота',syncSubOff:'Данные хранятся только в приложении',
 syncNow:'Синхронизировать',syncOk:'Данные обновлены',syncFail:'Сервер не отвечает',
 syncNotSet:'Адрес сервера не указан в коде',
 profile:'Профиль',storage:'Хранилище',storageCloud:'Telegram CloudStorage',storageLocal:'Только эта сессия',

/* ================== ХРАНИЛИЩЕ ================== */
const KEY='pathstate_v3';
let memory=null;

function loadState(){
  return new Promise(function(resolve){
    if(tg&&tg.CloudStorage&&tg.CloudStorage.getItem){
      let settled=false;
      const done=function(v){ if(!settled){ settled=true; resolve(v); } };
      setTimeout(function(){ done(null); },2500);
      tg.CloudStorage.getItem(KEY,function(err,val){
        if(err||!val) return done(null);
        try{ done(JSON.parse(val)); }catch(e){ done(null); }
      });
    } else resolve(memory);
  });
}
function saveState(){
  const raw=JSON.stringify(S);
  memory=JSON.parse(raw);
  if(tg&&tg.CloudStorage&&tg.CloudStorage.setItem){
    try{ tg.CloudStorage.setItem(KEY,raw,function(){}); }catch(e){}
  }
  if(API_URL) pushToServer();
}

/* ================== СЕРВЕР ================== */
let syncBusy=false;

async function api(path,payload){
  if(!API_URL) throw new Error('no server');
  const r=await fetch(API_URL.replace(/\/$/,'')+path,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({initData:tg?tg.initData:''},payload||{}))
  });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

async function pullFromServer(silent){
  if(!API_URL){ if(!silent) toast(t('syncNotSet')); return false; }
  if(syncBusy) return false;
  syncBusy=true;
  try{
    const d=await api('/api/state');
    if(d&&d.goals){
      S.goals=d.goals.map(function(g){ return Object.assign({marks:{}},g); });
      S.streak=d.streak||0; S.best=d.best||0;
      if(typeof d.freezes==='number') S.freezes=d.freezes;
      S.lastDone=d.lastDone||S.lastDone;
      S.days=Object.assign({},S.days,d.days||{});
      S.seq=Math.max(S.seq||1,(d.seq||0)+1);
      memory=JSON.parse(JSON.stringify(S));
      if(tg&&tg.CloudStorage&&tg.CloudStorage.setItem){
        try{ tg.CloudStorage.setItem(KEY,JSON.stringify(S),function(){}); }catch(e){}
      }
      if(!silent) toast(t('syncOk'));
      return true;
    }
  }catch(e){ if(!silent) toast(t('syncFail')); }
  finally{ syncBusy=false; }
  return false;
}
function deviceTz(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){ return ''; }
}

function pushToServer(){
  if(!API_URL||!tg) return;
  // пояс устройства уходит вместе с данными — по нему бот шлёт напоминания
  api('/api/save',{state:S,tz:deviceTz()}).catch(function(){});
}

/* ================== ДАТЫ ================== */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>key(new Date());
function shift(n){ const d=new Date(); d.setDate(d.getDate()+n); return key(d); }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return key(d); }
function plural(n,one,few,many){
  const a=n%10,b=n%100;
  if(b>=11&&b<=14) return many;
  if(a===1) return one;
  if(a>=2&&a<=4) return few;
  return many;
}
const dayWord=n=>(S&&S.lang==='en')?(n===1?'day':'days'):plural(n,'день','дня','дней');

function tgUser(){
  try{ return (tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{}; }catch(e){ return {}; }
}
function tgLang(){

  return c==='ru'?'ru':(c?'en':'ru');
}
function blank(){

  return{
    name:u.first_name||'Friend', nick:u.username||'', photo:u.photo_url||'',

    lastDone:null,days:{},goals:[],seq:1,start:today(),mainGoal:null,
    invites:[],duels:[]
  };
}
function weekTag(){ const d=new Date(); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return key(d); }
function liveStreak(){
  if(!S.lastDone) return 0;
  return (S.lastDone===today()||S.lastDone===shift(-1))?S.streak:0;
}
const anyDoneToday=()=>!!S.days[today()];
const goalDoneToday=g=>!!(g.marks&&g.marks[today()]);
function refillFreezes(){ if(S.freezeWeek!==weekTag()){ S.freezeWeek=weekTag(); S.freezes=1; } }

function applyFreeze(){
  if(!S.lastDone||S.streak<=0) return null;
  if(S.lastDone!==shift(-2)) return null;
  refillFreezes();
  if(S.freezes<=0) return null;
  S.freezes-=1; S.lastDone=shift(-1); S.days[shift(-1)]='freeze';
  saveState(); return S.streak;
}

/* ================== ЦЕЛИ ================== */
function spread(count,total){
  if(count<=0) return [];
  if(count>=total) return Array(count).fill(1);
  const base=Math.floor(total/count);
  const out=Array(count).fill(base);
  let rest=total-base*count;
  for(let i=count-1;rest>0;i--,rest--) out[i%count]+=1;
  return out;
}
function addGoal(title,targetDays,texts){
  const lens=spread(texts.length,targetDays);
  const g={id:S.seq++,title:title,targetDays:targetDays,created:today(),marks:{},
    steps:texts.map(function(x,i){ return {id:S.seq++,text:x,days:lens[i],progress:0,done:false}; })};
  S.goals.push(g);
  if(!S.mainGoal) S.mainGoal=g.id;
  saveState(); return g;
}
function addGoalPlan(title,targetDays,plan){
  const g={id:S.seq++,title:title,targetDays:targetDays,created:today(),marks:{},
    steps:plan.map(function(x){
      return {id:S.seq++,text:x.step,days:Math.max(1,x.days||1),progress:0,done:false};
    })};
  S.goals.push(g);
  if(!S.mainGoal) S.mainGoal=g.id;
  saveState(); return g;
}
const nextStep=g=>g.steps.find(s=>!s.done)||null;

function goalStat(g){
  const total=g.steps.reduce(function(a,s){ return a+s.days; },0)||1;
  const done=g.steps.reduce(function(a,s){ return a+(s.done?s.days:s.progress); },0);
  const left=diffDays(today(),addDays(g.created,g.targetDays));
  const elapsed=diffDays(g.created,today());
  const stepsLeft=g.steps.filter(function(s){ return !s.done; }).length;
  return{total:total,done:done,left:left,stepsLeft:stepsLeft,
    behind:Math.max(0,elapsed-done),
    pct:Math.min(100,Math.round(done/total*100)),
    finished:g.steps.length>0&&g.steps.every(function(s){ return s.done; })};
}
function mainGoal(){
  let g=S.goals.find(function(x){ return x.id===S.mainGoal; });
  if(!g) g=S.goals.find(function(x){ return !goalStat(x).finished; })||S.goals[0]||null;
  return g;
}
function sortedGoals(){
  return S.goals.slice().sort(function(a,b){
    if(a.id===S.mainGoal) return -1;
    if(b.id===S.mainGoal) return 1;
    const fa=goalStat(a).finished?1:0, fb=goalStat(b).finished?1:0;
    return fa-fb;
  });
}

/* Отметка конкретной цели. Огонёк растёт один раз в сутки, но каждая цель отмечается отдельно. */
function completeStep(goalId,stepId){
  const g=S.goals.find(function(x){ return x.id===goalId; }); if(!g) return null;
  const s=g.steps.find(function(x){ return x.id===stepId; }); if(!s||s.done) return null;
  if(goalDoneToday(g)) return null;

  s.progress+=1;
  const closed=s.progress>=s.days;
  if(closed) s.done=true;
  if(!g.marks) g.marks={};
  g.marks[today()]=true;

  let grew=false;
  if(!anyDoneToday()){
    S.streak=(S.lastDone===shift(-1))?S.streak+1:1;
    S.best=Math.max(S.best,S.streak);
    S.lastDone=today(); S.days[today()]='done'; grew=true;
  }
  saveState();
  return{closed:closed,grew:grew,streak:S.streak,goalDone:goalStat(g).finished};
}

  const el=document.getElementById('toast');

  clearTimeout(toastTimer);

function sparks(x,y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors=['#4C8DFF','#7C5CFC','#FFB23F','#7CE0D0','#FFFFFF'];
  for(let i=0;i<16;i++){
    const p=document.createElement('i');
    p.className='spark'; p.style.left=x+'px'; p.style.top=y+'px';
    p.style.background=colors[i%colors.length];
    p.style.setProperty('--dx',(Math.random()*180-90).toFixed(0)+'px');
    p.style.setProperty('--dy',(-Math.random()*150-40).toFixed(0)+'px');
    p.style.setProperty('--rot',(Math.random()*540-270).toFixed(0)+'deg');
    p.style.animation='fly '+(0.6+Math.random()*0.5).toFixed(2)+'s cubic-bezier(.15,.7,.4,1) forwards';
    document.body.appendChild(p);
    setTimeout(function(){ p.remove(); },1200);
  }
}

function renderPath(g){

    else if(!marked){ marked=true; cls='now'; inner=String(i+1);
      sub=s.days>1?t('dayNum',{n:s.progress+1,m:s.days}):t('now'); }
    else { cls=''; inner=String(i+1); sub=s.days+' '+dayWord(s.days); }
    h+='<div class="node'+(cls===''?' locked':'')+'" style="margin-left:'+indent+'px;animation-delay:'+(i*45)+'ms">'+
      '<div class="dot '+cls+'">'+inner+'</div>'+
      '<div class="node-txt"><div class="node-t">'+esc(s.text)+'</div><div class="node-s">'+sub+'</div></div></div>';

/* Задача конкретного дня внутри конкретной цели */
function taskForDay(g,dateStr){
  const idx=diffDays(g.created,dateStr)+1;
  if(idx<1) return null;
  let cum=0;
  for(let i=0;i<g.steps.length;i++){
    const s=g.steps[i];
    cum+=s.days;
    if(idx<=cum) return {goal:g,step:s,inStep:idx-(cum-s.days),ofStep:s.days};
  }
  return null;
}

/* Цепочка одной цели: от первого дня до последнего дня срока */
function renderChain(g){
  const totalDays=Math.max(1,g.targetDays||30);
  const days=[];
  for(let i=0;i<totalDays;i++) days.push(addDays(g.created,i));

  const STEP=74,TOP=46,AMP=27;
  const xs=i=>50+AMP*Math.sin(i*0.72);
  const height=TOP+days.length*STEP+30;
  let h='<div class="chain" style="height:'+height+'px">';

  for(let i=0;i<days.length-1;i++){
    const x1=xs(i),y1=TOP+i*STEP,x2=xs(i+1),y2=TOP+(i+1)*STEP;
    const on=(g.marks&&g.marks[days[i]]&&g.marks[days[i+1]]);
    for(let k=1;k<=2;k++){
      const f=k/3;
      h+='<i class="link'+(on?' on':'')+'" style="left:'+(x1+(x2-x1)*f).toFixed(2)+'%;top:'+(y1+(y2-y1)*f).toFixed(1)+'px;animation-delay:'+(i*30)+'ms"></i>';
    }
  }

  days.forEach(function(d,i){
    const y=TOP+i*STEP,x=xs(i),n=i+1;
    const mark=(g.marks&&g.marks[d])?'done':(S.days[d]==='freeze'?'freeze':null);
    const isToday=d===today();
    const cls=mark==='done'?'done':mark==='freeze'?'freeze':isToday?'now':(d>today()?'future':'miss');
    const inner=mark==='done'?ICON_CHECK:mark==='freeze'?ICON_SNOW:String(n);

    h+='<div class="day '+cls+'" data-act="day" data-g="'+g.id+'" data-d="'+d+'" style="left:'+x.toFixed(2)+'%;top:'+y+'px;animation-delay:'+Math.min(i*30,900)+'ms">'+
       inner+(mark?'<small>'+n+'</small>':'')+'</div>';

    if(isToday){
      h+='<div class="bolt" style="left:'+x.toFixed(2)+'%;top:'+(y-48)+'px">'+
         '<svg width="32" height="32" viewBox="0 0 24 24" fill="#FFB23F" stroke="#C77A12" stroke-width="1.5" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>'+
         '<i class="bolt-tail"></i></div>';
    }
  });

  h+='<div class="finish" style="left:50%;top:'+(TOP+days.length*STEP)+'px">'+
     '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h13l-2.5 4L18 12H5"/></svg>'+
     t('finishLabel')+'</div>';
  return h+'</div>';
}

/* ================== КАРТОЧКА ДНЯ ================== */
function openDay(goalId,dateStr){
  const g=S.goals.find(function(x){ return x.id===goalId; }); if(!g) return;
  const mark=(g.marks&&g.marks[dateStr])?'done':(S.days[dateStr]==='freeze'?'freeze':null);
  const isToday=dateStr===today(), isFuture=dateStr>today();
  const n=diffDays(g.created,dateStr)+1;
  const task=taskForDay(g,dateStr);

  const cls=mark==='done'?'done':mark==='freeze'?'freeze':isToday?'now':isFuture?'':'miss';
  const status=mark==='done'?t('stDone'):mark==='freeze'?t('stFreeze')
              :isToday?t('stNow'):isFuture?t('stFuture'):t('stMiss');

  let body='<div class="sheet-task"><div class="sheet-task-l">'+t('taskLabel')+'</div>';
  if(task){
    body+='<div class="sheet-task-t">'+esc(task.step.text)+'</div>'+
          '<div class="sheet-task-s">'+esc(g.title)+
          (task.ofStep>1?' · '+t('dayNum',{n:task.inStep,m:task.ofStep}):'')+'</div>';
  } else body+='<div class="sheet-task-s" style="margin:0">'+t('noTask')+'</div>';
  body+='</div>';

  let action='';
  if(isToday&&!goalDoneToday(g)&&task&&!task.step.done){
    action='<button class="btn btn-main" data-act="sheet-done" data-g="'+g.id+'" data-s="'+task.step.id+'">'+t('markDone')+'</button><div style="height:9px"></div>';
  } else if(isToday&&goalDoneToday(g)){
    action='<button class="btn btn-main" disabled>'+t('alreadyDone')+'</button><div style="height:9px"></div>';
  } else if(isFuture){
    action='<div class="card-s" style="text-align:center;margin-bottom:12px">'+t('cantFuture')+'</div>';
  } else if(!mark){
    action='<div class="card-s" style="text-align:center;margin-bottom:12px">'+t('cantPast')+'</div>';
  }

  const back=document.createElement('div');
  back.className='backdrop'; back.id='backdrop';
  const sheet=document.createElement('div');
  sheet.className='sheet'; sheet.id='sheet';
  sheet.innerHTML='<div class="sheet-grip"></div><div class="sheet-num">'+
    '<div class="sheet-badge '+cls+'">'+n+'</div><div><div class="sheet-t">'+t('dayTitle',{n:n})+'</div>'+
    '<div class="sheet-s">'+status+'</div></div></div>'+body+action+
    '<button class="btn btn-ghost" data-act="sheet-close">'+t('close')+'</button>';

  document.body.appendChild(back); document.body.appendChild(sheet);
  requestAnimationFrame(function(){ back.classList.add('show'); sheet.classList.add('show'); });

  back.addEventListener('click',closeSheet);
  sheet.addEventListener('click',function(e){
    const el=e.target.closest('[data-act]'); if(!el) return;
    if(el.dataset.act==='sheet-close'){ closeSheet(); return; }
    if(el.dataset.act==='sheet-done'){
      const r=completeStep(Number(el.dataset.g),Number(el.dataset.s));
      if(!r) return;
      const rect=el.getBoundingClientRect();
      sparks(rect.left+rect.width/2,rect.top+rect.height/2);
      haptic('ok');
      if(r.goalDone) toast(t('reached'));
      else if(r.closed) toast(t('stepDone'));
      else if(r.grew) toast(t('inRow',{n:r.streak,w:dayWord(r.streak)}));
      else toast(t('marked'));
      closeSheet(); setTimeout(render,320);
    }
  });
}
function closeSheet(){
  const back=document.getElementById('backdrop'),sheet=document.getElementById('sheet');
  if(back) back.classList.remove('show');
  if(sheet) sheet.classList.remove('show');
  setTimeout(function(){ if(back) back.remove(); if(sheet) sheet.remove(); },340);
}

  if(act==='day'){ haptic('tap'); openDay(Number(el.dataset.g),el.dataset.d); return; }
  if(act==='chain'){ chainGoal=Number(el.dataset.g); haptic('tap'); render(); return; }

  if(act==='setmain'){
    S.mainGoal=Number(el.dataset.g); saveState(); haptic('ok'); toast(t('mainSet')); render(); return;
  }

  if(act==='group'){
    haptic('tap');
    if(tg&&tg.openTelegramLink) tg.openTelegramLink(GROUP_URL);
    else window.open(GROUP_URL,'_blank');
    return;
  }

  if(act==='save-name'){
    const inp=document.getElementById('p-name');
    if(inp&&inp.value.trim()){ S.name=inp.value.trim().slice(0,40); saveState(); haptic('ok'); toast(t('nameSaved')); render(); }
    return;
  }

  if(act==='rival-search'){
    const inp=document.getElementById('r-nick');
    const nick=(inp?inp.value:'').trim().replace(/^@/,'');
    if(!nick) return;
    haptic('tap');
    api('/api/find',{nick:nick}).then(function(d){
      if(d&&d.nick){ rivalFound=d; render(); }
      else { rivalFound=null; toast(t('rivalNotFound')); }
    }).catch(function(){ toast(t('syncFail')); });
    return;
  }

  if(act==='rival-invite'){
    haptic('ok');
    api('/api/invite',{nick:el.dataset.n}).then(function(){
      toast(t('rivalInvited')); rivalFound=null; render();
    }).catch(function(){ toast(t('syncFail')); });
    return;
  }

  if(act==='inv-yes'||act==='inv-no'){
    haptic('tap');
    api('/api/invite-reply',{nick:el.dataset.n,accept:act==='inv-yes'}).then(function(){
      pullFromServer(true).then(function(){ render(); });
    }).catch(function(){ toast(t('syncFail')); });
    return;
  }

  if(act==='gen-plan'){
    syncDraft();
    if(!draft.title.trim()){ toast(t('genNeedTitle')); haptic('warn'); return; }
    haptic('tap');
    el.disabled=true; el.textContent=t('genWait');
    const prev=(draft.aiPlan||[]).map(function(x){ return x.step; });
    api('/api/plan',{goal:draft.title.trim(),days:draft.days||30,
                     about:'',avoid:prev.length?prev:null})
      .then(function(d){
        if(d&&d.plan&&d.plan.length){
          draft.aiPlan=d.plan;
          draft.steps=d.plan.map(function(x){ return x.step; }).join('\n');
          haptic('ok'); toast(t('genOk'));
        } else { toast(t('genFail')); }
        render();
      })
      .catch(function(){ toast(t('genFail')); render(); });
    return;
  }

  if(act==='go-new'){ draft={title:'',days:30,steps:'',aiPlan:null}; screen='goals'; haptic('tap'); render(); return; }
  if(act==='cancel'){ draft=null; haptic('tap'); render(); return; }
  if(act==='days'){ syncDraft(); draft.days=Number(el.dataset.n); haptic('tap'); render(); return; }

  if(act==='lang'){
    S.lang=el.dataset.v; saveState(); haptic('tap');
    document.documentElement.lang=S.lang; render(); return;
  }

  if(act==='sync'){ haptic('tap'); pullFromServer(false).then(function(ok){ if(ok) render(); }); return; }

  if(act==='reset'){
    const kill=function(){ S=blank(); saveState(); haptic('ok'); toast(t('resetOk')); screen='today'; render(); };
    if(tg&&tg.showConfirm) tg.showConfirm(t('resetAsk'),function(ok){ if(ok) kill(); });
    else if(confirm(t('resetAsk'))) kill();
    return;
  }

  if(act==='save-goal'){
    syncDraft();
    const title=draft.title.trim();
    const steps=draft.steps.split('\n').map(function(s){
      return s.replace(/^\s*(?:[-–—•*]|\d+[.)])\s*/,'').trim();
    }).filter(Boolean).slice(0,20);
    const days=Math.max(1,Math.min(365,Number(draft.days)||30));
    if(!title){ toast(t('needTitle')); haptic('warn'); return; }
    if(!steps.length){ toast(t('needStep')); haptic('warn'); return; }
    // если шаги пришли от нейросети и не правились — сохраняем её распределение дней
    const ai=draft.aiPlan;
    const same=ai&&ai.length===steps.length&&ai.every(function(x,i){ return x.step===steps[i]; });
    if(same) addGoalPlan(title,days,ai);
    else addGoal(title,days,steps);
    if(tg&&tg.sendData){ try{ tg.sendData(JSON.stringify({action:'add_goal',title:title,days:days,steps:steps})); }catch(err){} }
    draft=null; haptic('ok'); toast(t('goalCreated')); screen='today'; render(); return;
  }

  if(act==='toggle'){ const id=Number(el.dataset.g); openGoal=openGoal===id?null:id; haptic('tap'); render(); return; }

  if(act==='drop'){
    const id=Number(el.dataset.g);
    const kill=function(){
      S.goals=S.goals.filter(function(g){ return g.id!==id; });
      if(S.mainGoal===id) S.mainGoal=S.goals.length?S.goals[0].id:null;
      if(chainGoal===id) chainGoal=null;
      openGoal=null; saveState(); haptic('ok'); toast(t('goalDeleted')); render();
    };
    if(tg&&tg.showConfirm) tg.showConfirm(t('deleteAsk'),function(ok){ if(ok) kill(); });
    else if(confirm(t('deleteAsk'))) kill();
    return;
  }

  if(act==='done'){
    const r=completeStep(Number(el.dataset.g),Number(el.dataset.s));
    if(!r) return;
    const rect=el.getBoundingClientRect();
    sparks(rect.left+rect.width/2,rect.top+rect.height/2);
    haptic('ok');
    const fire=document.getElementById('m-fire');
    if(fire&&r.grew){ fire.classList.add('pulse'); setTimeout(function(){ fire.classList.remove('pulse'); },500); }
    if(r.goalDone) toast(t('reached'));
    else if(r.closed) toast(t('stepDone'));
    else if(r.grew) toast(t('inRow',{n:r.streak,w:dayWord(r.streak)}));
    else toast(t('marked'));
    setTimeout(render,260);
  }
});

function syncDraft(){
  if(!draft) return;
  const a=document.getElementById('d-title'),b=document.getElementById('d-days'),c=document.getElementById('d-steps');
  if(a) draft.title=a.value;
  if(c) draft.steps=c.value;
  if(b&&b.value.trim()){ const n=parseInt(b.value,10); if(n>=1&&n<=365) draft.days=n; }
}

/* ================== СТАРТ ================== */
(async function init(){
  const saved=await loadState();
  S = (saved&&saved.goals) ? Object.assign(blank(),saved) : blank();
  if(!S.lang) S.lang=tgLang();
  if(!S.start) S.start=today();
  if(!S.invites) S.invites=[];
  if(!S.duels) S.duels=[];
  S.goals.forEach(function(g){ if(!g.marks) g.marks={}; });
  const u=tgUser();
  if(u.username) S.nick=u.username;
  if(u.photo_url) S.photo=u.photo_url;
  if(!S.mainGoal&&S.goals.length) S.mainGoal=S.goals[0].id;
  document.documentElement.lang=S.lang;
  memory=JSON.parse(JSON.stringify(S));

  const rescued=applyFreeze();
  render();

  if(API_URL) pullFromServer(true).then(function(ok){ if(ok) render(); });

  if(rescued) setTimeout(function(){ toast(t('frozeSaved',{n:rescued})); },700);
  else if(!anyDoneToday()&&liveStreak()>0)
    setTimeout(function(){ toast(t('dontLose',{n:liveStreak(),w:dayWord(liveStreak())})); },800);
})();
</script>
